const SLACK_OK=['창고 구석에 숨어 휴대폰을 만지작거리며 시간을 보냅니다.','바쁜 척 서류를 들고 이리저리 걸어 다니며 한숨을 돌립니다.','화장실 칸에 앉아 눈을 감고 잠깐 숨을 돌립니다.'];
const SLACK_CAUGHT=['“카터! 지금 뭐 하는 거야?” 관리자의 목소리가 등 뒤에서 날아옵니다.','쉬고 있는 모습을 동료가 관리자에게 일러바쳤습니다. 곧바로 호출이 떨어집니다.'];
function shiftKey(sh){return sh.kind==='day'?'day':sh.id;}
function shiftName(){const sh=S.shift;if(!sh)return '';return sh.kind==='day'?DAY_LABOR_LIST[sh.dl].n:`${PL[JOBS[sh.id].loc].n} · ${jobTitle(sh.id)}`;}
function cont(){if(S.shift)shiftStep();}
function eo(label,fn,o={}){
  const oo=Object.assign({},o);
  if(oo.imp){const f=oo.imp;oo.imp=()=>{f();cont();};}
  opt(label,()=>{fn();cont();},oo);
}
function startShift(){
  const J=JOBS[S.job.id];const lateMin=S.t-J.start*60;const late=lateMin>30;
  S.job.lastDay=S.day;
  S.shift={kind:'job',id:S.job.id,total:J.hours,total0:J.hours,done:0,late,perf:0,bonus:0,ded:0,seen:[],ate:false};
  say(`${PL[J.loc].n}에서 출근 카드를 찍습니다. 오늘도 「${jobTitle(S.job.id)}」로서 ${J.hours}시간 근무가 시작됩니다.`);
  if(late){S.shift.ded+=15;S.shift.perf-=2;say(`${lateMin}분 지각입니다. 관리자가 손목시계를 톡톡 두드리며 눈살을 찌푸립니다. (일당 -$15)`);if(R()<0.5&&addStrike('지각'))return;}
  if(S.alc>=20){
    say('숨결에서 술 냄새가 풍깁니다. 동료 하나가 코를 찡그리며 당신을 쳐다봅니다.');
    const strict=S.job.id==='police'||S.job.id==='army';
    if(R()<(strict?0.6:0.4)){
      if(strict){fireJob('근무 중 음주','감독관이 음주 측정기를 들이밉니다. 수치가 기준을 넘자 그 자리에서 직무 정지와 파면 통보가 내려집니다.');return;}
      say('관리자가 당신을 따로 불러 경고합니다. “술 깨고 와. 오늘 일당에서 깐다.” (일당 -$20)');S.shift.ded+=20;
      if(addStrike('음주 출근'))return;
    }
  }
  shiftStep();
}
function shiftStep(){
  const sh=S.shift;if(!sh)return;
  if(S.st.fat>=100){shiftCollapse();return;}
  if(S.st.str>=100){shiftBreakdown();return;}
  if(sh.done>=sh.total){endShift();return;}
  if(!sh.ate&&sh.total>=5&&sh.done>=Math.floor(sh.total/2)){lunchBreak();return;}
  pageTitle=shiftName()+' · 근무 중';
  sys(`근무 ${sh.done}/${sh.total}시간 · 남은 근무 ${sh.total-sh.done}시간 · 현재 ${tstr()} · 오늘 평가 ${sh.perf>=0?'+':''}${sh.perf}${sh.ded?` · 공제 예정 -$${sh.ded}`:''}`);
  opt('성실하게 일한다 (평가↑ · 피로↑)',()=>workBlock('hard'),{grp:'근무',min:60});
  opt('적당히 페이스를 조절하며 일한다',()=>workBlock('steady'),{grp:'근무',min:60});
  opt('눈치껏 땡땡이를 친다 (적발 위험)',()=>workBlock('slack'),{grp:'근무',min:60,cls:'risk'});
  const onDeploy=sh.kind==='job'&&sh.id==='deployed';
  if(sh.done>=1&&!onDeploy)opt(sh.kind==='day'?'일을 중도에 포기하고 현장을 떠난다':'관리자에게 말하고 조퇴한다',()=>leaveEarly(false),{grp:'기타'});
  if(sh.kind==='job'&&!onDeploy)opt('근무 도중 사직서를 던진다',quitConfirm,{grp:'기타',cls:'risk'});
  if(onDeploy)sys('파견 임무 중에는 조퇴하거나 임무를 이탈할 수 없습니다.');
}
function workBlock(mode){
  const sh=S.shift;if(!sh)return;
  const key=shiftKey(sh);
  pass(60,{work:mode!=='slack'});
  sh.done++;
  if(mode==='hard'){st('fat',2);st('str',1);sh.perf+=2;say(pick(WORK_LINES[key]));}
  else if(mode==='steady'){sh.perf+=1;say(pick(WORK_LINES[key]));}
  else{
    st('str',-3);st('fat',-3);
    const strict=sh.kind==='job'&&(sh.id==='police'||sh.id==='army');
    const caughtP=0.22+(strict?0.12:0)-(S.skills.street||0)*0.0025;
    if(R()<caughtP){
      sh.perf-=3;say(pick(SLACK_CAUGHT));
      if(sh.kind==='job'){if(addStrike('근무 태만'))return;}
      else{sh.ded+=10;say('반장이 장부에 무언가를 적습니다. “일당에서 10달러 깐다.”');}
    }else{sh.perf-=1;say(pick(SLACK_OK));}
  }
  if(sh.kind==='job'&&jobRank()>=2)st('str',1);
  if(mode!=='slack'&&R()<0.3){
    if(sh.kind==='job')skUp(RANKS[sh.id].sk,1);
    else{const dl=DAY_LABOR_LIST[sh.dl];if(dl.reqAttr)atUp(dl.reqAttr,1);else skUp(dl.reqSkill,1);}
  }
  if(sh.done<sh.total&&R()<0.36){runShiftEvent();return;}
  shiftStep();
}
function lunchBreak(){
  const sh=S.shift;sh.ate=true;
  pageTitle=shiftName()+' · 휴게 시간';
  say('휴게 시간입니다. 30분 동안 숨을 돌릴 수 있습니다. (휴게 시간은 근무 시간에 포함되지 않습니다.)');
  const brk=fn=>()=>{pass(30);fn();cont();};
  opt('근처 식당에서 든든하게 먹는다 ($11)',brk(()=>{
    if(S.money<11){lose(4);st('fat',-4);say('지갑이 얇아 결국 편의점 삼각김밥으로 발길을 돌립니다.');return;}
    cash(-11);st('fat',-10);st('str',-4);say('뜨끈한 국물에 밥 한 공기를 말아 먹습니다. 몸에 온기가 돕니다.');}),{min:30});
  opt('편의점 삼각김밥으로 때운다 ($4)',brk(()=>{
    if(lose(4)<4){st('fat',3);st('str',3);say('동전이 모자라 물만 한 잔 마십니다. 배 속이 쓰립니다.');return;}
    st('fat',-5);st('str',-1);say('벤치에 앉아 삼각김밥을 씹어 삼킵니다.');}),{min:30});
  opt('동료들과 어울려 함께 먹는다 ($8)',brk(()=>{
    if(lose(8)<8){st('str',2);say('돈이 모자라다고 말하기 민망해 먼저 일어납니다.');return;}
    st('fat',-7);
    if(R()<0.3+S.st.cha/200){sh.perf+=2;st('str',-5);say('동료들과 실없는 농담을 주고받습니다. 누군가 당신 어깨를 툭 치며 웃습니다. 조금은 이 자리에 섞인 기분입니다.');}
    else{st('str',3);say('대화에 끼지 못하고 밥만 먹습니다. 누군가 당신의 의안 쪽을 힐끔거립니다.');}}),{min:30});
  opt('굶고 잠깐 눈을 붙인다',brk(()=>{st('fat',-6);st('str',3);say('휴게실 의자에 기대 눈을 감습니다. 배에서 꼬르륵 소리가 납니다.');}),{min:30});
}
function leaveEarly(family){
  const sh=S.shift;if(!sh)return;
  sh.perf-=family?1:3;
  if(sh.kind==='day'){say('반장에게 몸이 안 좋다고 말하고 현장을 빠져나옵니다. 반장은 혀를 차며 일한 시간만큼만 셈을 칩니다.');endShift();return;}
  if(family)say('관리자에게 사정을 설명합니다. 관리자는 한숨을 쉬지만 이번만 봐주겠다며 손짓합니다.');
  else{say('관리자가 못마땅한 얼굴로 조퇴를 허락합니다. “일한 시간만큼만 쳐주겠네.”');if(R()<0.35&&addStrike('무단 조퇴'))return;}
  endShift();
  if(family&&!S.shift){
    pass(40);S.loc='home';S.daily.picked=1;lose(12);
    say('유치원에서 열에 들뜬 에밀리를 안고 약국에 들렀다 집으로 돌아왔습니다. 해열제 값 $12. 에밀리가 당신 목에 뜨거운 이마를 기댑니다.');
  }
}
function endShift(){
  const sh=S.shift;if(!sh)return;S.shift=null;
  const worked=Math.min(sh.done,sh.total0),full=sh.done>=sh.total0;
  if(sh.kind==='day'){
    const dl=DAY_LABOR_LIST[sh.dl];
    const cur=dl.reqAttr?S.attrs[dl.reqAttr]:S.skills[dl.reqSkill];
    const base=Math.round(dl.pay*worked/sh.total0);
    const skB=full&&cur>=dl.reqVal?8:0;
    const net=Math.max(0,base+sh.bonus+skB-sh.ded);
    cash(net);st('str',dl.str);
    say('작업이 끝났습니다. 반장이 장부를 펼쳐 셈을 칩니다.');
    sys(`정산 — 기본 $${base}${sh.bonus?` · 추가 $${sh.bonus}`:''}${skB?` · 숙련 수당 $${skB}`:''}${sh.ded?` · 공제 -$${sh.ded}`:''} → 실수령 <b>$${net}</b>`);
    pass(30);S.loc='home';
    say('땀에 전 작업복 차림으로 버스를 타고 집에 돌아왔습니다.');
    return;
  }
  const id=sh.id;
  const base=Math.round(jobPay()/sh.total0*worked);
  const merit=full&&sh.perf>=sh.total0*1.5?Math.round(jobPay()*0.1):0;
  const tip=id==='cafe'&&full?Math.floor(S.st.cha/10)*2:0;
  const net=Math.max(0,base+sh.bonus+merit+tip-sh.ded);
  cash(net);
  S.job.worked++;S.job.perf=(S.job.perf||0)+sh.perf;
  st('str',4+jobRank());
  if(id==='mech')rel('frank',2);
  if(id==='police'||id==='army')st('ctl',1);

function checkPromotion(){
  const j=S.job;if(!j)return;
  const r=j.rank||0;if(r>=3)return;
  const n=r+1,RK=RANKS[j.id];
  if(j.worked>=PROMO_DAYS[n]&&j.perf>=PROMO_PERF[n]&&(S.skills[RK.sk]||0)>=RK.req[n]&&j.strikes<2){
    if(j.id==='police'&&n===3&&S.crimes>0)return;
    const newPay=Math.round(JOBS[j.id].pay*PROMO_MULT[n]);
    say(`퇴근 직전, ${BOSS[j.id]}이(가) 당신을 따로 부릅니다. “카터, 그동안 지켜봤네. 「${RK.t[n]}」 자리를 맡겨 볼 생각인데, 어떤가?”`);
    sys(`승진 시 일당 $${jobPay()} → $${newPay} · 경고 기록 초기화 · 책임이 늘어 근무 스트레스 증가`);
    opt(`「${RK.t[n]}」 승진을 받아들인다`,()=>{
      j.rank=n;j.strikes=0;rel('maria',8);st('str',-6);st('ctl',2);st('cha',1);
      if(j.id==='mech')rel('frank',6);
      say(`${BOSS[j.id]}이(가) 당신의 손을 굳게 잡습니다. 집에 돌아와 소식을 전하자 마리아가 입을 막고 웃습니다. “스콧, 승진이라니!” 에밀리는 뜻도 모르면서 박수를 칩니다.`);
      note(`승진: ${RK.t[n]} · 일당 $${newPay}`);
    });
    opt('아직은 이르다며 사양한다',()=>{j.perf=Math.floor(j.perf*0.7);st('str',-2);say('“아직 자신이 없습니다.” 상대가 아쉬운 듯 고개를 끄덕입니다. “마음 바뀌면 실적으로 보여주게.”');});
  }
}

function runShiftEvent(){
  const sh=S.shift;const key=shiftKey(sh);
  const pool=SHIFT_EVENTS.filter(e=>(!e.job||e.job===key)&&(!e.when||e.when(sh))&&!sh.seen.includes(e.id));
  const w=[];pool.forEach(e=>{w.push(e);if(e.job)w.push(e,e);});
  if(!w.length){shiftStep();return;}
  const e=pick(w);sh.seen.push(e.id);
  pageTitle=shiftName()+' · 돌발 상황';
  e.run(sh);
  if(!choices.length)cont();
}

function crime(k){
  const C=CR[k];pass(C.time);
  if(k==='pkg')S.pendingTony=null;
  if(S.job&&(S.job.id==='police'||S.job.id==='army'||S.job.id==='deployed')){
    note(`범죄 가담 사실이 적발되어 「${JOBS[S.job.id].n}」에서 파면되었습니다.`);
    S.job=null;
  }
  const skillReduce=S.gangRank>=1?S.skills.street*0.2:0;
  const risk=Math.max(5,C.risk+S.heat/3+(S.st.fat>70?10:0)-skillReduce);
  if(R()*100<risk){caught(k);return;}
  let p=C.pay;if(k==='rob')p=300+Math.floor(R()*450);
  if(C.txt)say(C.txt);
  cash(p);S.crimeMoney+=p;S.crimes++;S.heat+=C.heat;st('tra',C.tra);st('str',k==='pkg'?4:10);
  if(k!=='rob'){
    rel('tony',8);
    if(S.gangRank>=1){
      S.gangRep+=C.rep;
      rel('don',Math.floor(C.rep/3));
      note(`조직 공헌도 +${C.rep} (현재 ${S.gangRep})`);
    }
  }
}

function gotPickpocketed(){
  if(S.money<20||R()<0.25+S.skills.street*0.008){say('붐비는 인도에서 누군가 몸을 부딪쳐 옵니다. 반사적으로 주머니를 움켜쥐자, 낯선 손이 황급히 빠져나갑니다. 지갑은 무사합니다.');st('str',3);skUp('street',1);return;}
  const l=lose(15+Math.floor(R()*Math.min(60,S.money*0.3)));
  st('str',8);say(`한참 걷다 뒷주머니가 허전합니다. 지갑 속 현금 $${l}가 감쪽같이 사라졌습니다. 아까 어깨를 부딪치고 간 남자가 떠오릅니다.`);
}
function streetGamble(){
  say('길모퉁이에서 남자가 종이컵 세 개를 현란하게 섞고 있습니다. “콩 찾으면 두 배! 20달러부터!” 구경꾼 하나가 방금 40달러를 땄다며 환호합니다.');
  const bet=()=>{if(S.money<20){say('주머니를 뒤져 보지만 판돈이 모자랍니다.');return;}cash(-20);if(R()<0.15){cash(40);st('str',-3);say('콩이 정확히 그 컵 아래에 있습니다! 남자가 떨떠름한 얼굴로 40달러를 건넵니다.');}else{st('str',7);say('콩은 어느 컵에도 없었습니다. 환호하던 구경꾼이 남자와 함께 골목으로 사라집니다. 바람잡이였습니다.');}};
  opt('20달러를 건다',bet,{cls:'risk'});
  opt('사기라는 걸 알고 지나친다',()=>{st('ctl',1);say('웃기지도 않는 수법입니다. 걸음을 재촉합니다.');},{imp:()=>{say('지나치려던 손이 이미 지갑을 꺼내고 있습니다.');bet();}});
}

  opt('코인 세탁소에서 옷을 빤다 ($7)',()=>{if(!pay(7))return;pass(40);st('cha',1);say('세탁소 건조기 앞에서 속옷 차림으로 기다립니다. 꼴은 우습지만 옷은 말끔해졌습니다.');},{min:40});
  opt('그냥 털고 간다',()=>{say('흙탕물을 대충 털어 냅니다. 지나가는 사람들이 힐끔거립니다.');});
}

  if(S.daily.counsel){say('오늘 상담은 이미 받았습니다.');return;}
  if(!pay(30))return;S.daily.counsel=1;S.flags.counsel=(S.flags.counsel||0)+1;pass(60);rel('hanna',8);
  st('tra',-6);st('str',-15);st('ctl',7);

  }else{
    const L=[
      '한나 박사가 분노가 올라올 때 몸의 어디가 먼저 반응하는지 묻습니다. 당신은 주먹이라고 대답합니다. “그럼 다음엔 주먹을 펴는 걸 연습해봐요.”',

    ];

  if(S.drank||S.alc>0)say('“술로 감정을 마비시키면 치료도 그만큼 제자리걸음을 하게 돼요, 스콧.” 한나 박사는 숨결의 알코올 냄새를 알아챕니다.');

function wornSummaryText(){
  const upper=CLOTH_CATALOG.find(c=>c.id===S.worn.upper);
  const lower=CLOTH_CATALOG.find(c=>c.id===S.worn.lower);
  const underU=CLOTH_CATALOG.find(c=>c.id===S.worn.underUpper);
  const underL=CLOTH_CATALOG.find(c=>c.id===S.worn.underLower);
  const items=[upper,lower,underU,underL].filter(Boolean).map(x=>x.n);
  if(!items.length)return '당신은 아무것도 입지 않은 상태입니다.';
  return `당신은 ${items.join(', ')} 차림입니다.`;
}

function statDesc(k,v){
  if(k==='alc'){
    return v>=70?'필름이 끊길 정도로 만취했습니다.':v>=40?'술기운이 강하게 올라와 판단이 흐립니다.':'약간 취기가 돌고 있습니다.';
  }
  if(k==='fat'){
    return v>=80?'당장 쓰러질 듯 극심하게 지쳤습니다.':v>=55?'몸이 천근만근 무겁습니다.':v>=25?'약간의 피로감이 느껴집니다.':'정신이 또렷합니다.';
  }
  if(k==='str'){
    return v>=80?'폭발하기 직전의 극한 압박감입니다.':v>=55?'신경이 날카롭게 곤두서 있습니다.':v>=25?'적당한 긴장감을 안고 있습니다.':'마음이 비교적 평온합니다.';
  }
  if(k==='tra'){
    return v>=75?'악몽과 플래시백이 일상을 잠식하고 있습니다.':v>=45?'오래된 상처가 수시로 고개를 듭니다.':v>=20?'과거의 흉터가 희미하게 남아 있습니다.':'마음의 상처가 잘 아물어 있습니다.';
  }
  if(k==='ctl'){
    return v>=75?'스스로를 단단히 통제하고 있습니다.':v>=45?'간신히 감정을 억누르고 있습니다.':v>=20?'충동이 고삐를 흔들고 있습니다.':'자제력을 거의 잃었습니다.';
  }
  if(k==='cha'){
    return v>=70?'주변 사람들의 시선을 단번에 사로잡습니다.':v>=45?'단정하고 호감 가는 인상을 줍니다.':v>=25?'평범하고 무난한 행색입니다.':'지치고 초라해 보입니다.';
  }
  return '';
}

function statDescColor(k,v){
  if(k==='alc')return '#d48cf7';
  if(k==='fat'||k==='str'||k==='tra')return v>=70?'#e05555':v>=40?'#e0a03a':'#3bb4c1';
  if(k==='ctl')return v>=60?'#48c748':v>=30?'#e0a03a':'#e05555';
  if(k==='cha')return v>=45?'#3bb4c1':'#9a9a9a';
  return '#ccc';
}

function dailyTipText(){
  const todayIv=Object.keys(S.interviews||{}).filter(k=>S.interviews[k]&&S.interviews[k].day===S.day);
  if(todayIv.length)return `오늘은 「${JOBS[todayIv[0]].n}」 면접 예약일입니다. 영업시간 내에 해당 장소를 방문하세요.`;
  if(S.missedRent>0)return `이번 주 월요일까지 집세 $${S.rent+(S.flags.rentExtra||0)}를 마련하지 못하면 퇴거당합니다.`;
  if((S.weather==='비'||S.weather==='폭풍우')&&!hasUmbrella())return '비가 내리고 있습니다. 편의점이나 쇼핑몰에서 우산을 사지 않으면 옷이 젖어 스트레스가 쌓입니다.';
  if(S.st.tra>=55||S.st.str>=65)return '화요일·목요일 10:00~16:00 사이 세인트 메리 병원 상담실에서 트라우마와 분노를 다스릴 수 있습니다.';
  if(S.shift)return '근무 중에는 성실히 일할수록 평가가 쌓여 승진에 가까워지지만, 피로도 빠르게 쌓입니다. 땡땡이는 적발되면 경고가 붙습니다.';
  if(S.flags.tooth)return '어금니 통증이 매일 스트레스를 올립니다. 세인트 메리 병원에서 치과 진료를 받을 수 있습니다.';
  if(!S.job)return '시립 도서관과 주민센터에서 기술과 지식을 쌓으면 더 나은 직장에 합격할 확률이 높아집니다.';
  return '집의 옷장에서 상황에 맞는 의상 세트를 갈아입으면 외모와 보온을 관리할 수 있습니다.';
}

function render(){
  const timeOfDay=hh()<6?'새벽':hh()<12?'아침':hh()<18?'오후':'밤';
  const rentLeft=((7-wd())%7)||7;
  const nextEvent=S.shift?`${shiftName()} 근무 중입니다.`:S.job?`직장: ${PL[JOBS[S.job.id].loc].n} · ${jobTitle(S.job.id)}`:`다음 집세($${S.rent}) 납부까지 ${rentLeft}일 남았습니다.`;

  // 좌측 상시 미니 사이드바
  const miniStats=[
    {k:'fat',ch:'피',v:S.st.fat,c:STATC.fat},
    {k:'str',ch:'스',v:S.st.str,c:STATC.str},
    {k:'tra',ch:'트',v:S.st.tra,c:STATC.tra},
    {k:S.alc>0?'alc':'ctl',ch:S.alc>0?'음':'통',v:S.alc>0?Math.round(S.alc):S.st.ctl,c:S.alc>0?'#b85ce6':'#48c748'},
    {k:'cha',ch:'매',v:S.st.cha,c:'#3bb4c1'}
  ];
  $('mini-bar').innerHTML=`<div class="mb-time">${String(hh()).padStart(2,'0')}<span>..</span>${String(S.t%60).padStart(2,'0')}</div>`+
    miniStats.map(s=>`<div class="mb-stat" title="${s.ch}: ${s.v}"><b style="color:${s.c}">${s.ch}</b><i><em style="width:${s.v}%;background:${s.c}"></em></i></div>`).join('');
  $('mini-bar').onclick=()=>setPanel(true);

  // 상세 패널 (제목 없음, Arousal 없음, DoL 서술형 스탯 + 격자 버튼)
  $('dol-top').innerHTML=`<div class="dol-info">
    <p>${S.weather} ${timeOfDay}입니다.<br>소지금은 <b>$${S.money}</b>입니다.</p>
    <p>현재 시각은 <b>${tstr()}</b>입니다.<br>오늘은 <b>${DAYS[wd()]}</b> (${S.day}일차)입니다.<br>${nextEvent}</p>
    <div class="dol-wear">${wornSummaryText()}</div>
  </div>`;

  $('stats').innerHTML=Object.keys(STATN).map(k=>{
    const isAlcSlot=(k==='ctl' && S.alc>0);
    const statKey=isAlcSlot?'alc':k;
    const label=isAlcSlot?'음주':STATN[k];
    const val=isAlcSlot?Math.round(S.alc):S.st[k];
    const barCol=isAlcSlot?'#b85ce6':(k==='ctl'?'#48c748':(k==='cha'?'#3bb4c1':STATC[k]));
    const dTxt=statDesc(statKey,val);
    const dCol=statDescColor(statKey,val);
    return `<div class="dol-stat">
      <div class="dol-stat-lbl">${label}: <span style="color:${dCol}">${dTxt}</span></div>
      <div class="dol-bar"><i style="width:${val}%;background:${barCol}"></i></div>
    </div>`;
  }).join('');

  $('dol-tip').innerHTML=`<div class="dol-tip"><b>팁:</b> ${dailyTipText()}</div>`;

  $('loc').textContent=S.ended?'':`${pageTitle||PL[S.loc].n} · ${tstr()}`;
  $('story').innerHTML=buf.join('');

  // 선택지 구역별 렌더링 (주요 장소 / 이동 / 우회 경로)
  const C=$('choices');C.innerHTML='';
  const secOrder=[['poi','주요 장소'],['travel','이동'],['alt','우회 경로']];
  let idxCounter=1;
  const indexed=choices.map((c,origIdx)=>({c,origIdx})).filter(x=>!x.c.inline);
  const onlyInline=!indexed.length&&choices.length>0;
  C.style.display=onlyInline?'none':'';
  $('ch-hr').style.display=onlyInline?'none':'';

  if(!S.ended && isMenu && S.loc!=='home'){
    secOrder.forEach(([secKey,secTitle])=>{
      const group=indexed.filter(x=>(x.c.sec||'poi')===secKey);
      if(!group.length)return;
      const h=document.createElement('div');h.className='ch-sec';h.textContent=secTitle;C.appendChild(h);
      group.forEach(({c,origIdx})=>{
        const b=document.createElement('button');
        b.innerHTML=`(${idxCounter++}) ${c.label}`;
        if(c.cls)b.className=c.cls;
        b.onclick=()=>choose(origIdx);
        C.appendChild(b);
      });
    });
  }else{
    let lastGrp=null;
    indexed.forEach(({c,origIdx},i)=>{
      if(c.grp&&c.grp!==lastGrp){lastGrp=c.grp;const h=document.createElement('div');h.className='ch-sec';h.textContent=c.grp;C.appendChild(h);}
      const b=document.createElement('button');
      b.innerHTML=`(${idxCounter++}) ${c.label}`;
      if(c.cls)b.className=c.cls;
      b.onclick=()=>choose(origIdx);
      C.appendChild(b);
    });
  }
  window.scrollTo(0,0);
}

      say('사회복지사가 차분하게 법원 명령서를 보여 줍니다. 당신의 손이 에밀리의 가방끈에서 천천히 풀립니다. “양육 계획에 동의하시기 전까지는 면회가 허용되지 않습니다.”');

    }else note(`면회 ${S.flags.fosterVisits}회 · 귀가 조건: 맨정신 면회 3회 이상, 에밀리 호감도 30 이상 (현재 ${S.rel.emily})`);

  ['emilySick','daycare'].forEach(k=>{const L=LIFE[k];if(L){const w0=L.w;L.w=()=>!isFoster()&&w0();}});
  {const mc=SHIFT_EVENTS.find(e=>e.id==='mariaCall');if(mc){const w0=mc.when;mc.when=sh=>w0(sh)&&sh.id!=='deployed'&&!isFoster();}}

  function nextCrisis(){
    const f=S.flags;

    if(dc&&dc.until&&S.day>=dc.until)return (dc.stage==='grace'&&S.rel.maria>=30)?'divorceDrop':'divorceFinal';

    if(cc&&cc.review&&S.day>=cc.review)return 'cpsReview';

    if(!dc&&!S.sep&&!f.famAtLucia&&S.rel.maria<=FAM_CRISIS&&(!f.divorceDropped||S.day>=f.divorceDropped+7)&&R()<0.5)return 'divorce';

  /* ===================== 3. 해외 파견: 7일 연속 기지 상주 → 장기 휴가 ===================== */
  JOBS.deployed.noDaily=true;

    note(`해외 파견 시작: ${DEPLOY_DAYS}일 동안 하루도 빠짐없이 파견 임무를 완수해야 하며, 이 기간에는 기지를 벗어날 수 없습니다.${D.firstDay>S.day?' 오늘은 점호 시간이 지나 내일부터 연속 파견 일수가 집계됩니다.':''}`);

    else t+=' 마리아가 사회복지사에게서 들은 에밀리의 소식을 조심스럽게 전해 줍니다.';

  ];
  const mercVal=m=>S.attrs[m.key]!=null?S.attrs[m.key]:(S.skills[m.key]||0);

  function mercChance(m,mode){

      -S.st.fat*0.25-(S.st.str>=70?8:0)-(S.alc>0?15:0)-(S.injured?10:0)-(mode==='bold'?12:0);

  function mercBoard(){

    H.push(`<p class="wd-sec"><span class="wd-title">오늘의 의뢰</span> <i class="wd-cnt">${list.length}건</i></p>`);

      if(lock)act=`<span class="wd-dim">「${RANKS.mercenary.t[m.minRank]}」 이상만 맡을 수 있는 의뢰입니다.</span>`;

      else if(S.st.fat>=80)act='<span class="wd-dim">너무 지쳐 있어 의뢰를 맡을 수 없습니다. (피로 80 미만 필요)</span>';
      else act=lk(`이 의뢰를 검토한다`,()=>mercBrief(m));

    });
    H.push(`<p class="wd-dim">의뢰는 하루 한 건만 맡을 수 있으며, 고정 근무나 결근 처리는 없습니다. 다만 ${MERC_IDLE}일 넘게 아무 의뢰도 맡지 않으면 계약이 해지됩니다.</p>`);
    H.push('</div>');

  function mercBrief(m){
    pageTitle='계약 의뢰 · '+m.n;
    pass(20);
    say(`계약 담당자가 지도와 사진 몇 장을 책상 위에 펼칩니다. 「${m.n}」. ${m.brief}`);
    sys(`보수 $${mercPay(m)} · 소요 ${m.hours}시간 · 위험 ${RISK_N[m.risk]} · 핵심 능력 ${mercKeyName(m)} ${fl(mercVal(m))}`);
    opt(`신중하게 계획대로 진행한다 (성공률 ${mercChance(m,'careful')}%)`,()=>mercRun(m,'careful'),{min:m.hours*60,imp:()=>mercRun(m,'bold')});
    opt(`과감하게 밀어붙인다 (성공률 ${mercChance(m,'bold')}% · 성공 시 보수 30% 추가)`,()=>mercRun(m,'bold'),{cls:'risk',min:m.hours*60});
    opt('의뢰서를 내려놓고 게시판으로 돌아간다',()=>mercBoardPage('의뢰서를 다시 핀에 꽂아 둡니다.'));
  }
  function mercRun(m,mode){
    const j=S.job;if(!j||j.id!=='mercenary'){say('계약이 이미 해지되어 의뢰를 맡을 수 없습니다.');return;}
    const ch=mercChance(m,mode),pay=mercPay(m);
    S.daily.mercDone=1;
    pass(m.hours*60,{work:true});
    j.worked++;j.lastMission=S.day;
    const roll=R()*100;
    if(roll<ch){
      const bonus=mode==='bold'?Math.round(pay*0.3):0,perf=6+m.risk*4+(mode==='bold'?3:0);
      cash(pay+bonus);j.perf=(j.perf||0)+perf;
      st('str',3+m.risk*2);if(m.risk>=2)st('tra',1);S.heat+=m.heat||0;
      if(S.attrs[m.key]!=null)atUp(m.key,1.5);else skUp(m.key,1.5);
      say(m.win);
      sys(`정산 — 계약 보수 $${pay}${bonus?` · 성과 보너스 $${bonus}`:''} → 수령 <b>$${pay+bonus}</b> · 임무 평가 +${perf} (누적 ${j.perf})`);
    }else if(roll<ch+(100-ch)*0.6){
      const half=Math.round(pay*0.5);cash(half);j.perf=(j.perf||0)+1;
      st('str',8+m.risk*2);st('tra',1+m.risk);S.heat+=m.heat||0;
      if(R()<0.25+m.risk*0.12)injure(m.risk>=2?2:1);
      say(m.part);
      sys(`정산 — 목표 일부 미달로 보수의 절반 → 수령 <b>$${half}</b> · 임무 평가 +1${S.injured?' · 부상 (병원 치료 필요)':''}`);
    }else{
      j.perf=(j.perf||0)-4;injure(m.risk>=3&&R()<0.5?3:2);st('str',14+m.risk*2);st('tra',3+m.risk*2);st('fat',8);S.heat+=m.heat||0;
      say(m.fail);
      sys('정산 — 임무 실패로 보수 없음 · 임무 평가 -4 · 부상 (병원 치료 필요)');
      if(addStrike('계약 임무 실패'))return;
    }
    checkPromotion();
  }

  const I=injState();
  let n=lv||(()=>{const r=R();return r<0.5?1:r<0.85?2:3;})();
  if(I.lv>0){const worse=n>=I.lv&&R()<0.5;n=Math.min(3,Math.max(n,I.lv)+(worse?1:0));}
  const was=I.lv;
  I.lv=Math.min(3,n);I.part=part||(was&&I.part?I.part:pick(INJ_PARTS[I.lv]));
  I.treated=false;I.days=0;I.heal=0;S.injured=true;
  note(`부상 — ${I.part}: ${INJ_DESC[I.lv]} (<b>${INJ_N[I.lv]}</b>) · ${injDebuffTxt()}`);
}
function healInjury(){const I=injState();I.lv=0;I.part='';I.treated=false;I.days=0;I.heal=0;S.injured=false;}
function injPen(){
  const I=injState();if(!I.lv)return null;
  const b=Object.assign({},INJ_PEN[I.lv]),p=I.part||'';
  if(/손|손목|손가락|손바닥|손등/.test(p))b.dex=Math.round(b.dex*1.6);

  if(I.treated)Object.keys(b).forEach(k=>b[k]=Math.round(b[k]*0.6));
  return b;
}
function injDebuffTxt(){
  const I=injState();if(!I.lv)return '';

   3. 별거 · 이혼 이후의 삶 — 책임을 다하며 마리아의 마음을 되찾기 (최고 난이도)

const SEP_SUPPORT=90;
function sepCap(){
  const f=S.flags;let c=100;
  if(S.gangRank>0)c=Math.min(c,30);
  if(f.lastCrimeDay!=null&&S.day-f.lastCrimeDay<30)c=Math.min(c,45);
  if(f.lastDrinkDay!=null&&S.day-f.lastDrinkDay<14)c=Math.min(c,55);
  if((HOUSES[S.house]||{tier:1}).tier<=0)c=Math.min(c,70);
  if(S.prison)c=Math.min(c,25);
  return c;
}
function sepTrust(d){
  if(!S.sep||!d)return;
  const s=S.sep,o=s.trust;
  if(d>0)d*=o>=85?0.4:o>=60?0.6:1;
  let v=o+d;
  if(d>0){const cap=sepCap();if(v>cap)v=Math.max(o,cap);}
  s.trust=Math.max(0,Math.min(100,Math.round(v*10)/10));
  const nr=Math.round(s.trust),r=nr-(S.rel.maria||0);S.rel.maria=nr;
  if(r)fx.r_maria=(fx.r_maria||0)+r;
}

    visits:0,missed:0,supMiss:0,arrears:0,lastSupMiss:-99,counsel:0,aa:0,letterDay:-99,lastText:-99,textStreak:0,
    visitWeek:-1,extraWeek:-1,ms:{},couple:0,block:0,joint:false,wedWeek:-1};

  say('이삿짐 트럭이 떠나기 직전, 에밀리가 버니를 안고 돌아봅니다. “아빠, 토요일에 봐?” 마리아가 아이의 어깨를 감싸며 당신에게 종이 한 장을 건넵니다. 임시 양육 계획서입니다.');

  say('하지만 이야기는 여기서 끝나지 않습니다. 당신이 오늘부터 어떤 사람으로 사는지, 마리아는 멀리서 지켜볼 것입니다.');
  note(`별거 시작 · 매주 금요일 양육비 $${SEP_SUPPORT} 자동 이체 · 매주 토요일 10:00~16:00 시립 공원에서 에밀리 면접 교섭 · 마리아의 「신뢰」는 아주 천천히만 오르고, 술·범죄·조직·약속 위반에는 크게 무너집니다.`);

/* ----- 일일 · 주간 처리 ----- */
function sepDaily(drankY){
  const s=S.sep,f=S.flags,w=wd();

  if(drankY)d-=4;else d+=S.sober>=14?0.5:0.3;

  if(S.heat>=30)d-=0.8;
  if(S.gangRank>0)d-=0.8;
  if(S.prison)d-=1;

  sepTrust(d);
  /* 금요일: 양육비 */

function sepProposal(){

    note('마리아가 아직은 준비되지 않았다고 말했습니다. 14일 뒤 다시 마음을 전할 수 있습니다.');};

  opt(`그동안 지켜 온 날들을 조용히 하나씩 말한다 (${xTag({k:'calm',b:32,m:0.6})})`,()=>go2({k:'calm',b:32,m:0.6},'금주 일수, 한 번도 빠지지 않은 토요일, 레이먼드에게 건 새벽 전화들. 자랑하듯이가 아니라, 보고하듯이. 마리아가 고개를 끄덕일 때마다 노을이 조금씩 짙어집니다.'));
  if(S.money>=300)opt(`작은 반지를 꺼내 무릎을 꿇는다 ($300 · ${xTag({k:'cha',b:38,m:0.6})})`,()=>{cash(-300);go2({k:'cha',b:38,m:0.6},'모래 위에 한쪽 무릎을 꿇습니다. 상자를 여는 손이 떨립니다. 마리아가 두 손으로 입을 막습니다.');});
}

function initTest(why){
  pageTitle='입단 시험 · 이스트 엔드';
  if(why==='family'){rel('don',6);say('살바토레가 처음으로 웃습니다. “가족. 좋은 대답이다. 우리도 가족이니까.” 그 말이 묘하게 등골을 서늘하게 합니다.');}
  else if(why==='money'){rel('don',2);say('“솔직해서 좋군. 돈 때문에 온 놈은 돈 때문에 떠나지만, 적어도 거짓말은 안 하지.”');}
  else{rel('don',3);rel('tony',8);say('토니가 문 옆에서 고개를 숙인 채 웃음을 참습니다. “그 녀석 말을 믿는다고? 용감하군.”');}
  say('“식구가 되려면 시험이 필요하다. 이스트 엔드에서 정비소를 하는 에디 마르티네스가 석 달째 빚 $600를 갚지 않고 있어. 오늘 밤 토니와 가서 받아 와.”');

  say('에디의 정비소. 셔터가 반쯤 내려진 차고 안에서 백열등이 흔들립니다. 기름때 묻은 작업복 차림의 에디가 렌치를 든 채 굳어 섭니다. 작업대 옆 간이침대에서 여섯 살쯤 된 남자아이가 만화책을 보다가 고개를 듭니다.');
  say('“카터…? 너 프랭크네서 일하던 그 카터 아냐?” 에디의 목소리가 떨립니다. “제발. 이번 달엔 진짜 없어. 부품상이 외상을 끊어서…”');
  const fixC={k:'mech',b:20,m:0.9};
  opt('아이 앞에서 렌치를 빼앗아 작업대를 내려친다',()=>initCeremony('threat'),{cls:'risk'});
  opt(`밀린 손님 차 세 대를 대신 고쳐 수리비로 빚을 갚게 한다 (${xTag(fixC)})`,()=>initCeremony(xRoll(fixC)?'fix':'fixFail'));
  opt('자기 돈 $200를 보태고 나머지는 다음 달로 미뤄 준다',()=>initCeremony(S.money>=200?'pay':'noMoney'));

function initCeremony(how){
  let rep=15;
  if(how==='threat'){pass(30);rep+=6;rel('don',4);st('tra',4);st('str',6);say('쾅. 작업대 위 공구들이 튀어 오릅니다. 아이가 만화책으로 얼굴을 가립니다. 에디가 떨리는 손으로 금고를 열어 꼬깃꼬깃한 지폐를 전부 내놓습니다. 돌아 나오는 길, 당신은 에밀리가 방문 뒤에서 버니를 끌어안던 모습을 떠올립니다.');}
  else if(how==='fix'){pass(240);rep+=8;rel('don',6);rel('tony',4);skUp('mech',2);say('작업복 소매를 걷고 리프트 아래로 들어갑니다. 새벽 두 시, 세 번째 차의 시동이 걸립니다. 에디가 수리비 봉투를 통째로 내밀며 고개를 숙입니다. 보고를 들은 살바토레가 껄껄 웃습니다. “빚쟁이를 일꾼으로 만들었다고? 머리가 돌아가는 놈이군.”');}
  else if(how==='fixFail'){pass(240);rep+=2;st('str',8);say('밤새 매달렸지만 마지막 차는 끝내 살아나지 않습니다. 토니가 남은 금액만큼 에디의 공구 상자를 챙깁니다. 살바토레는 별말 없이 봉투만 받아 듭니다.');}
  else if(how==='pay'){cash(-200);rep+=3;rel('tony',6);rel('don',-2);say('당신은 지갑에서 $200를 꺼내 에디의 봉투에 보탭니다. 토니가 어이없다는 듯 당신을 보다가 웃습니다. “너 진짜 안 변했다.” 살바토레는 봉투의 두께를 손으로 가늠하더니 눈을 가늘게 뜹니다. “마음이 약한 건 고쳐야 할 거다.”');}
  else{rep+=1;rel('don',-4);st('str',6);say('지갑을 열었지만 보탤 돈이 없습니다. 결국 토니가 에디의 낡은 오토바이 열쇠를 챙깁니다. 살바토레의 눈빛이 싸늘합니다.');}
  pass(60);
  pageTitle='살바토레 조직 본거지 · 입단식';
  say('자정. 창고 안쪽, 드럼통 위에 촛불 세 개가 켜져 있습니다. 조직원 열두 명이 둥글게 둘러섭니다. 살바토레가 오래된 은반지를 낀 손을 내밉니다. “이 반지에 입을 맞추면, 넌 우리 피붙이가 된다. 우리를 배신하는 건 피를 배신하는 거고.”');
  opt('반지에 입을 맞추고 서약한다',()=>{
    S.gangRank=1;S.gangRep=rep;rel('tony',10);rel('don',20);st('tra',3);gangFireLawJob();
    say('차가운 은반지의 감촉. 조직원들이 차례로 당신의 어깨를 두드립니다. 토니가 마지막으로 다가와 당신을 끌어안습니다. “형제. 이제 진짜 형제다.” 살바토레가 잔을 들어 올립니다. “스콧 카터에게.”');
    note('조직 계급: 조직 행동대원 · 본거지의 「조직 작전 수행」에서 작전을 맡을 수 있습니다.');
  },{cls:'risk'});
  opt('마지막 순간, 반지 앞에서 돌아선다',()=>{
    S.flags.initDeclined=S.day;rel('don',-15);rel('tony',-10);st('ctl',3);st('str',8);
    say('촛불이 흔들립니다. 당신은 한 걸음 뒤로 물러섭니다. 조직원들 사이로 술렁임이 번집니다. 살바토레가 손을 거두며 낮게 웃습니다. “토니, 친구를 바깥까지 배웅해라.” 철문 밖 공기가 유난히 차갑습니다.');
  });
}
/* ----- 간부 승진 (행동대원 → 구역 관리자) ----- */
function promoCapo(){
  pageTitle='살바토레 조직 · 간부 승진 심사';pass(20);
  say('살바토레가 책상 위에 장부 두 권을 나란히 펼칩니다. “웨스트 브룩 구역 관리자 루카 페라로. 석 달째 상납금이 줄었어. 경기가 나빠서라고 하더군.” 그가 시가 재를 털어 냅니다. “루카가 정말 손을 대고 있는지 알아 와. 맞다면, 그 자리는 네 거다.”');
  const ctx={ev:0};
  const C1={k:'know',b:25,m:0.8},C2={k:'street',b:25,m:0.7},C3={k:'cha',b:20,m:0.6};
  opt(`두 장부를 밤새 대조한다 (${xTag(C1)})`,()=>{pass(240);if(xRoll(C1)){ctx.ev=2;say('세탁소와 술집 세 곳의 날짜가 맞지 않습니다. 같은 날 같은 가게에서 두 번 걷은 돈 중 한 번만 장부에 올라 있습니다. 새벽 네 시, 숫자들이 하나의 이름을 가리킵니다.');}else{say('숫자가 머릿속에서 엉킵니다. 수상한 건 분명한데 확실한 증거는 잡히지 않습니다.');}capoConfront(ctx);},{min:240});
  opt(`루카의 수금원 대니얼을 술집에서 구슬린다 ($150 · ${xTag(C2)})`,()=>{if(!pay(150))return;pass(180);if(xRoll(C2)){ctx.ev=2;ctx.witness=1;say('세 번째 잔에서 대니얼의 입이 풀립니다. “루카 형님이 봉투를 두 개씩 들고 다녀요. 하나는 보스 거, 하나는 자기 거.” 그는 다음 날 증언하겠다고 약속합니다.');}else{say('대니얼은 술만 마시고 입을 열지 않습니다. 오히려 그가 루카에게 전화를 거는 모습이 보입니다.');ctx.warned=1;}capoConfront(ctx);},{min:180});
  opt(`루카를 직접 찾아가 떠본다 (${xTag(C3)})`,()=>{pass(60);if(xRoll(C3)){ctx.ev=1;say('루카가 너무 많이 웃습니다. 당신이 상납금 얘기를 꺼내자 그의 손가락이 반지를 세 번 돌립니다. 거짓말할 때의 버릇입니다.');}else{ctx.warned=1;say('루카가 당신의 의도를 눈치챘습니다. “보스가 보냈구나?” 그의 눈이 차갑게 식습니다.');}capoConfront(ctx);},{min:60});
}
function capoConfront(ctx){
  pageTitle='웨스트 브룩 · 루카의 사무실';
  say(ctx.warned?'루카의 사무실 문을 열자 그가 서랍에서 손을 빼고 있습니다. 책상 위에는 이미 짐을 싼 가방. “카터, 우리 얘기 좀 하지.”':'루카의 사무실. 당신이 장부를 책상 위에 던지자 루카의 얼굴에서 웃음이 사라집니다.');
  if(ctx.ev>=2){
    say('“…그래. 맞아. 딸 대학 등록금이었어.” 루카가 의자에 무너지듯 앉습니다. “보스한테 넘기면 난 끝이야, 카터. 너도 딸 있잖아.”');
    opt('보스에게 사실대로 넘긴다',()=>{rel('don',12);st('tra',3);S.flags.lucaFate='handed';say('살바토레가 장부를 받아 들고 고개를 끄덕입니다. 그날 밤 루카의 사무실 불은 다시 켜지지 않습니다. 그 뒤로 루카를 봤다는 사람은 없습니다.');capoCeremony();});
    opt('도시를 떠날 시간을 주고, 빼돌린 돈만 회수한다',()=>{rel('don',4);S.flags.lucaFate='spared';cash(300);say('“오늘 밤 안에 떠나. 다시는 돌아오지 마.” 루카가 떨리는 손으로 봉투를 내밉니다. 보스에게는 그가 이미 달아났다고 보고합니다. 반은 사실입니다.');note('루카에게 자비를 베풀었습니다. 언젠가 이 일이 돌아올지도 모릅니다.');capoCeremony();});
    opt(`루카를 살려 두는 대신 내 사람으로 만든다 (${xTag({k:'cha',b:30,m:0.6})})`,()=>{if(xRoll({k:'cha',b:30,m:0.6})){S.flags.lucaFate='mine';rel('luca',30);rel('don',6);say('“빼돌린 돈은 오늘 안에 채워 넣고, 앞으로 내 밑에서 일해. 그럼 보스는 모르는 거야.” 루카가 한참 당신을 보다가 무릎에 손을 짚고 일어섭니다. “…빚졌다, 카터.”');note('루카 페라로가 당신의 사람이 되었습니다. 그는 조직 내부 정보를 쥐고 있습니다.');}else{S.flags.lucaFate='fled';rel('don',-4);say('루카가 고개를 끄덕이는 척하더니 그날 밤 자취를 감춥니다. 빼돌린 돈과 함께.');}capoCeremony();},{cls:'risk'});
  }else if(ctx.ev===1){
    say('증거는 정황뿐입니다. 루카가 비웃습니다. “의심만으로 날 엮겠다고? 보스가 그걸 믿을 것 같아?”');
    const C={k:'calm',b:30,m:0.7};
    opt(`증거가 있는 척 허세를 부린다 (${xTag(C)})`,()=>{if(xRoll(C)){S.flags.lucaFate='handed';rel('don',8);say('“대니얼이 다 불었어.” 거짓말입니다. 하지만 루카의 얼굴이 하얗게 질립니다. 그가 스스로 무너집니다.');capoCeremony();}else capoFail('루카가 껄껄 웃으며 전화기를 듭니다. “보스, 카터가 날 모함하는데요?”');});
    opt('물러나 증거를 더 모은다',()=>capoFail('당신은 장부를 다시 챙깁니다. 살바토레는 기다려 주지만, 그의 인내심에도 끝이 있습니다.'));
  }else capoFail('손에 쥔 것이 아무것도 없습니다. 루카가 당신의 어깨를 두드립니다. “다음엔 숙제를 해 와, 신입.”');
}
function capoFail(t){S.gangRep=Math.max(0,S.gangRep-10);rel('don',-6);S.flags.capoRetry=S.day+3;say(t);note('간부 승진 심사에 실패했습니다. 사흘 뒤 다시 기회가 옵니다. (공헌도 −10)');}
function capoCeremony(){
  pass(60);pageTitle='살바토레 조직 · 구역 관리자 임명';
  say('다음 날 저녁. 살바토레가 웨스트 브룩 구역 지도와 열쇠 꾸러미, 금 커프스 한 쌍을 책상 위에 올려놓습니다. “오늘부터 부두와 웨스트 브룩은 네가 책임진다. 매일 네 몫 $90. 구역에서 사고가 나면 그것도 네 책임이다.”');
  say('간부들이 술잔을 듭니다. 문 옆의 토니가 박수를 치지만, 그 웃음 끝이 조금 굳어 있습니다. 같은 골목에서 시작한 친구가, 이제 당신의 부하가 되는 겁니다.');
  S.gangRank=2;rel('don',15);
  opt('토니를 오른팔로 삼는다',()=>{S.flags.tonyRight=1;rel('tony',15);say('“토니. 네가 내 옆에 있어 줘.” 토니가 잠시 말을 잃었다가 당신을 끌어안습니다. “형님이라고 불러야 하냐, 이제?” 둘은 오랜만에 소리 내어 웃습니다.');note('조직 승급: 구역 관리자 (간부) · 토니가 오른팔이 되었습니다.');});
  opt('토니와 선을 긋고 다른 간부들과 손을 잡는다',()=>{S.flags.tonyRight=0;rel('tony',-12);rel('don',4);S.gangRep+=5;say('“토니, 이제부터는 공과 사를 구분하자.” 토니가 고개를 끄덕이지만 눈은 웃지 않습니다. 간부들은 당신의 냉정함을 마음에 들어 합니다.');note('조직 승급: 구역 관리자 (간부)');});
}
/* ----- 보스 계승 (구역 관리자 → 조직 보스) ----- */
function promoBoss(){
  pageTitle='세인트 메리 병원 · 특실';pass(40);
  say('세인트 메리 병원 꼭대기 층 특실. 산소 호흡기 소리 사이로 빅 살바토레가 손짓합니다. 한때 항구를 쥐락펴락하던 손이 이불 위에서 떨립니다. “의사 놈들이 석 달이래. 웃기지. 총알도 못 죽인 날 담배가 죽인다니.”');
  say('“내 자리는 네게 주고 싶다, 스콧. 하지만 마르코 비안키가 가만있지 않을 거다. 간부 셋의 표를 얻어. 지오반니는 부두, 레나는 카지노와 돈, 페드로는 운송이다. 둘 이상이 네 편이면… 반지는 네 거다.”');
  rel('don',5);rel('marco',0);
  const ctx={votes:S.flags.lucaFate==='mine'?1:0};
  if(ctx.votes)say('병실을 나서자 루카에게서 문자가 옵니다. 「마르코가 레나의 카지노 돈에 손댄 증거, 내가 갖고 있다. 써.」');
  bossCouncil(ctx);
}
function bossCouncil(ctx){
  pageTitle='항구 창고 · 간부 회의';pass(60);
  say('창고 안쪽 긴 테이블. 마르코 비안키가 상석 옆자리에 앉아 웃고 있습니다. “환자 대신 회의를 주재하시겠다? 서열이라는 게 있는데 말이야.”');
  const A={k:'cha',b:20,m:0.6},B={k:'street',b:20,m:0.6};
  opt(`지난 작전 실적과 수익 장부를 내민다 (공헌도·${xTag(A)})`,()=>{const p=Math.min(92,xChance(A)+Math.floor(S.gangRep/10));if(R()*100<p){ctx.votes+=2;say('당신이 펼친 장부를 지오반니와 페드로가 오래 들여다봅니다. 숫자는 거짓말을 하지 않습니다. 둘이 동시에 고개를 끄덕입니다.');}else{ctx.votes+=1;say('지오반니는 설득됐지만 페드로는 팔짱을 풉니다. “숫자는 좋은데, 경험이 부족해.”');}bossAmbush(ctx);});
  opt(`간부들에게 다음 분기 몫을 약속한다 ($1500)`,()=>{if(!pay(1500))return bossAmbush(ctx);ctx.votes+=2;S.heat+=3;say('봉투 세 개가 테이블 아래로 오갑니다. 레나가 봉투의 두께를 가늠하며 미소 짓습니다. 돈으로 산 표는 돈으로 다시 팔릴 수도 있다는 걸, 당신도 압니다.');bossAmbush(ctx);});
  opt(`마르코가 카지노 돈을 빼돌린 정황을 폭로한다 (${xTag(B)})`,()=>{if(S.flags.lucaFate==='mine'||xRoll(B)){ctx.votes+=2;rel('marco',-30);say('당신이 테이블에 사진과 송금 내역을 던집니다. 레나의 얼굴이 굳습니다. “내 카지노 돈을?” 마르코의 웃음이 처음으로 멎습니다.');}else{rel('marco',-20);say('증거가 약합니다. 마르코가 비웃습니다. “모함도 실력이 있어야지.” 간부들이 서로 눈치를 봅니다.');}bossAmbush(ctx);},{cls:'risk'});
}
function bossAmbush(ctx){
  pageTitle='항구 주차장 · 자정';pass(90);
  say('회의가 끝난 자정. 주차장 가로등 아래 세워 둔 차 문을 여는 순간, 어둠 속에서 엔진 소리가 커집니다. 헤드라이트도 켜지 않은 승합차 한 대가 미끄러져 들어옵니다. 마르코의 사람들입니다.');
  const F={k:'strg',b:25,m:0.6},E={k:'stam',b:25,m:0.6};

     {l:'못 본 척 자기 돈으로 채운다 (−$60)',cost:60,win:1,ok:'빈 봉투에 지폐를 채워 넣습니다. 토니는 아무것도 모릅니다. 아마도.',rel:{tony:3}},
     {l:'살바토레에게 그대로 보고한다',win:2,ok:'살바토레가 장부를 덮습니다. “정직한 놈이군.” 그날 밤 토니는 연락을 받지 않습니다.',rel:{tony:-12,don:4}}]},
  res:{great:'살바토레가 봉투 두께를 보고 고개를 끄덕입니다. “구역이 조용하면 돈도 조용히 들어오지.”',ok:'이번 주 수금이 무사히 끝났습니다.',part:'몇 집은 다음 주로 미뤘습니다. 보스의 표정이 썩 좋지 않습니다.',fail:'수금은 엉망이 되었고, 상점가에 경찰이 깔렸습니다.'}},

 {id:'mole',n:'조직 내 밀고자 색출',minRank:1,hours:4,pay:[300,520],rep:18,heat:2,prison:'street',cd:10,

  brief:'살바토레가 창밖을 보며 말합니다. “우리 안에 쥐가 있다.” 용의자는 셋. 운전수 조이, 회계 담당 실비아, 그리고 열아홉 살 신참 대니. “찾아와. 어떻게 할지는 그다음에 정한다.”',
  app:[
   {l:'세 사람에게 각각 다른 가짜 정보를 흘린다',c:{k:'know',b:30,m:0.9},win:3,lose:1,ok:'조이에게는 7번 부두, 실비아에게는 3번 창고, 대니에게는 해변 주차장. 이틀 뒤 경찰이 들이닥친 곳은 해변 주차장입니다.',bad:'가짜 정보가 서로 엉켜, 누가 어떤 얘기를 들었는지 당신도 헷갈립니다.'},
   {l:'부두 술집에서 술을 사며 하나씩 떠본다',c:{k:'cha',b:30,m:0.7},win:2,lose:1,ok:'대니가 세 번째 맥주에서 자꾸 휴대폰을 확인합니다. 화면에 뜬 이름은 「엄마」가 아닙니다.',bad:'다들 술만 마시고 입을 닫습니다.',fx:()=>{S.drank=true;}},
   {l:'제4지구 경찰서 뒷문을 잠복하며 지켜본다',c:{k:'street',b:30,m:0.8},heat:1,win:3,lose:1,ok:'새벽 다섯 시. 후드를 눌러쓴 대니가 경찰서 뒷문으로 들어갑니다.',bad:'밤새 잠복했지만 아무도 나타나지 않습니다.'}],
  inc:[
   {t:'대니의 집을 찾아갑니다. 낡은 트레일러. 창문 너머로 기침하는 중년 여성과, 식탁 위에 쌓인 이민국 서류가 보입니다.',ch:[
     {l:'서류를 사진으로 찍어 둔다',c:{k:'dex',b:35,m:0.6},win:1,lose:0,ok:'추방 심사 통지서. 담당 형사의 명함이 클립으로 끼워져 있습니다. 모든 게 맞아떨어집니다.',bad:'창문 앞에서 개가 짖어 물러납니다.'},
     {l:'그냥 돌아선다',win:0,ok:'당신은 트레일러 앞을 떠납니다. 기침 소리가 오래 귀에 남습니다.',str:4}]},
   {t:'조사 도중 실비아가 당신을 따로 부릅니다. “카터, 토니 쪽 장부도 좀 이상해. 혹시 그쪽도 볼래?”',ch:[
     {l:'“지금은 쥐 한 마리만 잡자.” 하고 거절한다',win:1,ok:'실비아가 어깨를 으쓱합니다. 토니 문제는 다음으로 미룹니다.'},

     {l:'살바토레에게 넘긴다',win:2,tra:4,ok:'대니를 본거지로 데려갑니다. 살바토레가 고개를 끄덕이자 조직원 둘이 그를 데리고 나갑니다. 그 뒤로 대니를 본 사람은 없습니다.',rel:{don:8},fx:()=>{S.flags.moleFate='handed';}},
     {l:'버스표와 돈을 쥐여 주고 도시를 떠나게 한다 (−$150)',cost:150,win:1,ok:'새벽 첫 버스. 대니가 창문에 손바닥을 붙인 채 멀어집니다. 보스에게는 그가 이미 달아났다고 보고합니다.',fx:()=>{S.flags.moleFate='spared';S.flags.moleDay=S.day;}},

  res:{great:'살바토레가 당신의 어깨에 손을 얹습니다. “쥐를 잡는 고양이는 귀하다.”',ok:'밀고자 문제는 일단락되었습니다.',part:'의심은 남았지만 확실한 결론은 내지 못했습니다.',fail:'색출은 실패했고, 오히려 당신이 의심을 받기 시작합니다.'}},

 {id:'smuggle',n:'경쟁 조직 밀수선 습격',minRank:1,hours:5,pay:[1500,2200],rep:28,heat:28,prison:'syndicate',cd:3,phys:true,

   {l:'잠입 — 크레인 사각지대로 소수만 들어간다',c:{k:'dex',b:28,m:0.7},win:3,lose:2,ok:'크레인 그림자를 따라 컨테이너에 접근합니다. 자물쇠가 소리 없이 열립니다.',bad:'철판을 밟는 소리가 울립니다. 선원 하나가 손전등을 이쪽으로 돌립니다.'},

   {t:'갑판 위 선원 하나가 무전기를 들어 올립니다. 저 무전이 코브라스 본거지로 가면 끝입니다.',ch:[

     {l:'화물 절반만 챙겨 즉시 철수한다',win:1,pm:0.6,ok:'트럭 두 대가 반대편 게이트로 빠져나갑니다. 아쉽지만 아무도 다치지 않았습니다.'}]},
   {t:'철수하던 중 부하 미키가 컨테이너 틈에 다리가 끼었습니다. 뒤에서 코브라스 놈들의 발소리가 가까워집니다.',ch:[

     {l:'전속력으로 해안 도로를 달린다',c:{k:'mech',b:25,m:0.7},win:2,lose:2,ok:'당신이 손본 트럭 엔진이 굉음을 냅니다. 순찰정이 따라올 수 없는 내륙 도로로 사라집니다.',bad:'과열된 엔진이 덜컹거립니다. 겨우 빠져나왔지만 번호판이 찍혔을지도 모릅니다.',fx:(x,ok)=>{if(!ok)x.heat+=5;}}]},
  res:{great:'창고에 화물이 가득 쌓입니다. 살바토레가 컨테이너를 두드리며 웃습니다. “코브라스 놈들 오늘 밤 잠 못 자겠군.”',ok:'화물 대부분을 챙겨 돌아왔습니다.',part:'건진 건 화물 일부뿐입니다.',fail:'작전은 아수라장이 되었습니다.'}},

 {id:'audit',n:'레드 룸 카지노 장부 감사',minRank:2,hours:4,pay:[600,950],rep:15,heat:2,prison:'street',cd:7,

  app:[
   {l:'석 달 치 칩 교환 기록을 대조한다',c:{k:'know',b:30,m:0.9},win:3,lose:1,ok:'금요일 밤마다 칩 교환 금액과 테이블 수익이 정확히 12퍼센트씩 어긋납니다.',bad:'기록이 방대해 패턴을 찾지 못했습니다.'},

     {l:'증언하면 봐주겠다고 약속한다',win:2,ok:'실비오가 녹음기 앞에서 모든 걸 털어놓습니다.',fx:x=>{x.witness=1;}},
     {l:'“애가 둘이면 더 조심했어야지.” 하고 밀어낸다',win:1,tra:1,ok:'실비오가 사색이 되어 물러납니다. 그는 그날 밤 카지노를 그만둡니다.'}]},
   {t:'마틴이 사무실로 당신을 부릅니다. 탁자 위에 봉투 하나. “감사 결과는 서로 좋게 마무리합시다. 이건 수고비요.”',ch:[

  });

function opChoiceLabel(ch){return ch.l+(ch.c?` (${xTag(ch.c)})`:'')+(ch.cost&&!/\$/.test(ch.l)?` (−$${ch.cost})`:'');}
function opDo(ctx,ch,next){
  pass(ch.min||40,{work:true});
  if(ch.cost){if(S.money<ch.cost){say('수중에 돈이 모자랍니다. 계획을 즉석에서 바꿀 수밖에 없습니다.');ctx.score-=1;next();return;}cash(-ch.cost);}
  let ok=true;if(ch.c)ok=xRoll(ch.c);
  ctx.score+=ok?(ch.win||0):-(ch.lose||0);
  if(ch.heat)ctx.heat+=ch.heat;
  if(ch.tra)st('tra',ch.tra);if(ch.str)st('str',ch.str);
  if(ch.rel)Object.keys(ch.rel).forEach(k=>rel(k,ch.rel[k]));
  if(ch.pm)ctx.pm*=ch.pm;
  say(ok?ch.ok:(ch.bad||ch.ok));
  if(!ok&&ch.hurt&&R()<ch.hurt)injure(ch.hl);
  if(ch.fx)ch.fx(ctx,ok);
  next();
}
function opChoices(ctx,list,next){
  list.forEach(ch=>{
    const o={cls:ch.cls||'',min:ch.min||40};
    if(ch.imp)o.imp=()=>opDo(ctx,Object.assign({},ch.imp),next);
    opt(opChoiceLabel(ch),()=>opDo(ctx,ch,next),o);
  });
}
function opStart(o){
  const ctx={op:o,score:0,heat:0,pm:1};
  S.daily.gangOp=1;
  pageTitle=`작전 · ${o.n}`;pass(30);
  say(o.brief);
  sys('접근 방식을 고르십시오. 각 단계의 판정 결과가 쌓여 작전의 성패를 가릅니다.');
  opChoices(ctx,o.app,()=>opInc(ctx,0));
  opt('작전을 보류한다',()=>{S.daily.gangOp=0;rel('don',-2);say('“다음에 하지.” 토니가 분필을 내려놓습니다. 보스의 표정이 썩 좋지는 않을 겁니다.');});
}
function opInc(ctx,i){
  const o=ctx.op;
  if(!ctx.incs){const pool=o.inc.slice();for(let a=pool.length-1;a>0;a--){const b=Math.floor(R()*(a+1));[pool[a],pool[b]]=[pool[b],pool[a]];}ctx.incs=pool.slice(0,o.hours>=5?2:1);}
  if(i>=ctx.incs.length){opClim(ctx);return;}
  const inc=ctx.incs[i];
  pageTitle=`작전 · ${o.n} · 돌발 상황`;
  say(inc.t);
  opChoices(ctx,inc.ch,()=>opInc(ctx,i+1));
}
function opClim(ctx){
  const o=ctx.op;pageTitle=`작전 · ${o.n} · 결정적 순간`;
  say(o.clim.t);
  opChoices(ctx,o.clim.ch,()=>opResolve(ctx));
}
function opResolve(ctx){
  const o=ctx.op,f=S.flags,r=S.gangRank,rm=[1,1,1.25,1.6][r];
  if(!f.opCd)f.opCd={};if(o.cd)f.opCd[o.id]=S.day+o.cd;
  const sc=ctx.score+(ctx.alarm?-1:0);
  const tier=sc>=5?'great':sc>=2?'ok':sc>=-1?'part':'fail';
  pageTitle=`작전 결과 · ${o.n}`;
  S.heat=clamp(S.heat+o.heat+ctx.heat);
  S.crimes++;f.opsDone=(f.opsDone||0)+1;
  if(tier==='fail'){
    S.gangRep=Math.max(0,S.gangRep-5);rel('don',-4);st('str',12);st('tra',2);
    say(`<b>작전 실패.</b> ${o.res.fail}`);
    const caughtP=Math.max(10,Math.min(70,20+S.heat/4+ctx.heat-S.skills.street*0.2));
    if(R()*100<caughtP){caught(o.prison);return;}
    if(R()<0.4)injure(o.phys?2:1);
    sys('간신히 몸을 빼냈습니다. 손에 쥔 것은 없습니다. (공헌도 −5)');
    if(o.after)o.after(tier);
    return;
  }
  const base=tier==='great'?o.pay[1]:tier==='ok'?Math.round((o.pay[0]+o.pay[1])/2):Math.round(o.pay[0]*0.5);
  const pay=Math.max(0,Math.round(base*ctx.pm*rm));
  const rep=Math.round(o.rep*(tier==='great'?1.3:tier==='ok'?1:0.5));
  cash(pay);S.crimeMoney+=pay;S.gangRep+=rep;rel('don',Math.floor(rep/3));rel('tony',tier==='part'?0:3);
  st('str',tier==='part'?8:4);
  say(`<b>${tier==='great'?'작전 대성공':tier==='ok'?'작전 성공':'절반의 성공'}.</b> ${o.res[tier]}`);
  sys(`분배 몫 $${pay} · 공헌도 +${rep} (현재 ${S.gangRep}) · 수배도 ${S.heat}`);
  if(o.after)o.after(tier);
  if(r===1&&S.gangRep>=55&&(S.rel.don||0)>=45)note('보스가 당신을 눈여겨보기 시작했습니다. 본거지에서 간부 승진 심사를 받을 수 있습니다.');
  if(r===2&&S.gangRep>=115&&(S.rel.don||0)>=75)note('조직 안에서 후계자 이야기가 돌기 시작했습니다. 본거지에서 후계 문제를 논의할 수 있습니다.');
}

function ptSched(k){const J=JOBS[k];return `${J.days.length===7?'매일':J.days.map(x=>DAYS[x][0]).join('·')} ${String(J.start).padStart(2,'0')}:00부터 ${J.hours}시간`;}
function lpPartTime(H){
  const known=PT_KEYS.filter(k=>S.leads[k]).length;
  H.push(`<p class="wd-sec"><span class="wd-title">시간제 일자리</span> <i class="wd-cnt">확인 ${known} / ${PT_KEYS.length}</i></p>`);
  H.push('<p>알바 구인 앱 <b>「잡플러스」</b>를 엽니다. 면접 없이 온라인 지원서와 자동 서류 심사로 바로 채용이 결정됩니다. 지원은 일자리마다 하루 한 번만 할 수 있습니다.</p>');
  if(S.job&&!PT_KEYS.includes(S.job.id))H.push(`<p class="wd-hot">현재 「${JOBS[S.job.id].n}」에 재직 중입니다. 시간제 일자리에 지원하려면 먼저 그만둬야 합니다.</p>`);
  PT_KEYS.forEach(k=>{
    const J=JOBS[k],I=PT_INFO[k],known=!!S.leads[k],cur=S.job&&S.job.id===k,ban=banUntil(k);
    const reqs=I.reqs(),allOk=reqs.every(x=>x[1]);
    const badge=cur?'재직 중':ban?`재지원 제한 (${ban}일차부터)`:!known?'미확인 공고':allOk?'지원 가능':'조건 미충족';
    const bc=cur?'ok':ban||(!allOk&&known)?'warn':known?'':'dim';
    let acts;
    if(cur)acts=`<span class="wd-dim">「${jobTitle(k)}」(으)로 근무 중 · 일당 $${jobPay()} · 근무지에서 출근하세요.</span>`;
    else if(!known)acts=lk('공고를 검색한다 (0:20)',()=>{pass(20);S.leads[k]=1;laptopPage('parttime',`「${J.n}」 공고의 근무 조건과 지원 양식을 확인했습니다.`);});
    else if(ban)acts=`<span class="wd-dim">${ban}일차부터 다시 지원할 수 있습니다.</span>`;
    else if(S.job)acts='<span class="wd-dim">재직 중에는 지원할 수 없습니다.</span>';
    else if(S.daily['ap_'+k])acts='<span class="wd-dim">오늘은 이미 지원했습니다.</span>';
    else acts=lk('온라인 지원서를 제출한다 (0:20)',()=>ptApply(k),{cls:allOk?'':'risk'});
    const reqTxt=known?reqs.map(([t,ok])=>`<span class="${ok?'wd-ok':'wd-hot'}">${t}</span>`).join(' · '):'공고를 검색하면 지원 조건을 볼 수 있습니다.';
    H.push(`<div class="wd-item wd-static${cur?' worn':''}"><div class="wd-item-info"><b>${J.n} <em class="lp-badge ${bc}">${badge}</em></b><span>근무지 ${I.where} · ${ptSched(k)}</span><span>${I.reward}</span><span>${reqTxt}</span>${known?`<span class="wd-desc">${I.desc}</span>`:''}<p class="wd-links">${acts}</p></div><span class="wd-act">$${J.pay}</span></div>`);
  });
}
function ptApply(k){
  const J=JOBS[k],I=PT_INFO[k];
  S.daily['ap_'+k]=1;pass(20);
  const miss=I.reqs().filter(x=>!x[1]).map(x=>x[0]);
  if(miss.length){S.flags['ban_'+k]=S.day+1;st('str',3);laptopPage('parttime',`「${J.n}」 자동 서류 심사에서 탈락했습니다. 미충족 조건: ${miss.join(', ')}`);return;}
  const score=42+S.st.cha*0.3+I.key()-S.st.fat*0.2-S.heat*0.3-(S.flags.firedCount||0)*4-injLv()*5;
  if(R()*100<score){
    S.job={id:k,strikes:0,lastDay:0,hired:S.day,worked:0,rank:0,perf:0};
    st('str',-6);st('ctl',1);if(!S.sep&&!S.flags.famAtLucia)rel('maria',4);
    note(`채용: ${J.n} · ${ptSched(k)} · 일당 $${J.pay} · 근무지 ${I.where}`);
    laptopPage('parttime',`<b>「${J.n}」 채용 확정!</b> 앱 알림이 울립니다. ${k==='delivery'?'「내일부터 11시까지 푸드코트 배달 거점으로 오세요. 헬멧은 지급합니다.」':k==='diner'?'루비에게서 직접 문자가 옵니다. 「주말 아침 8시. 늦으면 국물도 없어.」':'「첫 근무일 시간에 맞춰 근무지로 출근하세요.」'}`);
  }else{
    S.flags['ban_'+k]=S.day+2;st('str',5);
    laptopPage('parttime',`「${J.n}」 지원 결과: 「아쉽지만 이번에는 함께하기 어렵습니다.」 이틀 뒤 다시 지원할 수 있습니다. (매력을 가꾸고 피로·수배도를 낮추면 합격 가능성이 오릅니다.)`);
  }
}

LOC.diner=()=>{
  const d=S.daily,h=hh(),s=S.sep;

  opt('커피와 체리 파이를 주문한다 ($6)',()=>{if(!pay(6))return;pass(25);st('fat',-8);st('str',-4);rel('ruby',1);say(pick(['진한 커피와 따뜻한 체리 파이. 바삭한 격자 무늬 반죽 사이로 시큼한 체리 즙이 흘러나옵니다.','루비가 말없이 커피를 한 번 더 채워 줍니다. 리필은 공짜라는 뜻입니다.']));},{min:25});
  if(h>=6&&h<11)opt('아침 정식 「빅 루비」를 먹는다 ($9)',()=>{if(!pay(9))return;pass(30);st('fat',-15);st('str',-3);say('달걀 세 개, 베이컨, 해시브라운, 팬케이크 두 장. 접시 하나로 오전이 든든해집니다.');},{min:30});
  if(!d.rubyTalk)opt('카운터의 루비와 이야기를 나눈다',()=>{d.rubyTalk=1;pass(20);rel('ruby',3);
    if(s){say(s.trust<30?'루비가 행주를 내려놓고 팔짱을 낍니다. “마리아한테서 들을 얘긴 다 들었어. 커피는 팔지만 동정은 안 팔아.”':'루비가 커피를 따르며 낮게 말합니다. “요즘 토요일마다 에밀리가 신나서 와. 아빠랑 오리 봤다고. …계속 그렇게 해.”');if(s.trust>=30)sepTrust(0.5);}
    else say(pick(['“마리아는 우리 가게 보배야. 손님들이 그 애 보러 온다니까.” 루비가 당신을 위아래로 훑어봅니다. “그러니까 잘해, 카터.”','루비가 오래된 주크박스를 가리킵니다. “마리아가 좋아하는 노래가 저기 다 있어. 라틴 팝 B-12번. 알아 둬.”','“30년 장사하면서 배운 게 하나 있어. 사람은 변해. 근데 아주 천천히.” 루비가 계산대를 닦습니다.']));},{min:20});
  if(!s&&!S.flags.famAtLucia&&mariaWorking()&&!d.dinerMaria)opt('일하는 마리아에게 잠깐 인사한다',()=>{d.dinerMaria=1;pass(15);
    if(S.alc>0){rel('maria',-5);say('마리아가 당신을 보고 표정이 굳습니다. 그녀가 손님들 눈치를 보며 속삭입니다. “여기까지 와서 술 냄새 풍기지 마.”');return;}
    rel('maria',3);st('str',-3);say('주문서를 들고 바쁘게 오가던 마리아가 카운터 너머로 당신을 발견하고 놀란 듯 웃습니다. “웬일이야?” 그녀가 몰래 감자튀김 한 접시를 당신 앞에 밀어 줍니다.');},{min:15});
  if(S.flags.famAtLucia&&mariaWorking()&&!d.dinerMaria)opt('일하는 마리아에게 새집 소식을 전한다',()=>{d.dinerMaria=1;pass(15);rel('maria',2);say('마리아가 앞치마에 손을 닦으며 다가옵니다. “집은… 알아보고 있어?” 당신이 고개를 끄덕이자 그녀가 작게 한숨을 쉽니다. “에밀리가 매일 물어봐.”');},{min:15});

function aaMeeting(){
  const d=S.daily,f=S.flags;d.aa=1;pass(90);

  if(S.sep)sepTrust(1);

    rel('raymond',15);
    say('지하 강당. 접이식 의자 스무 개가 원을 그리고, 구석의 커피포트에서 김이 오릅니다. 백발의 덩치 큰 남자가 일어나 손을 내밉니다. “레이먼드다. 19년째 술을 안 마셨지. 첫날이면 그냥 앉아만 있어도 돼.”');
    say('사람들이 차례로 이야기합니다. 잃어버린 직장, 잃어버린 가족, 다시 찾은 것들. 당신 차례가 오자 목이 막힙니다. “…스콧입니다. 저는… 술을 마십니다.” 원 안의 모두가 대답합니다. “안녕, 스콧.”');
  }else{
    rel('raymond',4);
    say(pick(['오늘은 항만 노동자 마커스가 금주 1년 칩을 받습니다. 그가 칩을 높이 들어 올리자 박수가 터집니다. 당신은 그 동그란 동전 같은 칩을 오래 바라봅니다.','레이먼드가 자신의 바닥을 이야기합니다. 딸의 결혼식에 취해서 나타났던 날. “그 사진 속 내 얼굴을 지금도 지갑에 넣고 다녀. 잊지 않으려고.”','당신이 처음으로 그 골목의 밤과 어머니 이야기를 꺼냅니다. 아무도 끼어들지 않습니다. 이야기가 끝나자 옆자리 노부인이 당신의 손등을 두 번 두드립니다.']));
  }
  if(S.alc>0){S.crave=Math.max(0,S.crave-10);st('str',-3);say('레이먼드가 당신의 숨결을 맡고도 아무 말 없이 커피를 건넵니다. “오늘 여기 온 게 중요한 거야. 내일도 와.”');return;}
  S.crave=Math.max(0,S.crave-30);st('str',-8);st('ctl',3);st('tra',-1);
  const chip=[[90,'90일'],[60,'60일'],[30,'30일'],[7,'7일']].find(([n])=>S.sober>=n&&!(f.aaChip||{})[n]);
  if(chip){f.aaChip=f.aaChip||{};f.aaChip[chip[0]]=1;st('ctl',4);st('cha',1);if(S.sep)sepTrust(2);note(`금주 ${chip[1]} 칩을 받았습니다. 레이먼드가 당신을 끌어안습니다. “버텨 줘서 고맙다.”`);}
  else sys(`금주 ${S.sober}일째 · 모임 참석 ${f.aa}회`);
}

  salmonbowl:{m:['마리아가 한 입 먹고 놀란 듯 당신을 봅니다. “연어 굽기 진짜 어려운 건데… 촉촉하다.” 그녀가 당신의 그릇에 자기 연어 껍질을 옮겨 줍니다. 당신이 제일 좋아하는 부분입니다.','“이거 맛있다.” 마리아가 젓가락을 멈추지 않습니다.','마리아가 연어를 조금씩 떼어 먹습니다. 맛있다는 말은 하지 않지만 그릇은 비웁니다.'],

  tunamelt:{m:['마리아가 샌드위치를 반으로 잘라 한쪽을 당신에게 건넵니다. “소박하지만 좋다. 둘이 처음 이사 왔을 때 이것만 먹었잖아.”','“간단하게 잘했네.” 마리아가 샌드위치를 들고 소파로 갑니다.','“또 통조림이야?” 마리아가 지친 목소리로 묻습니다.'],

  fruitsalad:{m:['마리아가 딸기 하나를 집어 당신 입에 넣어 줍니다. “당신이 몰래 먹는 거 다 봤어.”','“상큼하다.” 마리아가 포크로 바나나를 콕 찍어 먹습니다.','마리아가 과일 몇 조각만 먹고 그릇을 내려놓습니다.'],

  fruitbox:{m:['마리아가 반달 오렌지를 보고 웃습니다. “에밀리 도시락통에 넣어 주면 친구들이 부러워하겠다.”','“예쁘게 담았네.” 마리아가 청포도를 몇 알 집어 먹습니다.','마리아가 과일 통을 냉장고에 넣으며 고맙다고만 합니다.'],
    e:['에밀리가 오렌지 껍질로 웃는 입을 만들어 보입니다. “아빠도 해 봐!” 둘이 오렌지 입을 하고 마리아를 쫓아다닙니다.','에밀리가 청포도를 하나씩 굴리며 먹습니다.','에밀리가 사과만 몇 조각 먹습니다.']},
  arroz:{m:['한 숟가락 뜬 마리아가 그대로 굳습니다. 숟가락을 내려놓고 한참 고개를 숙입니다. “…엄마 맛이랑 똑같진 않은데. 그래도, 이거 기억해 줘서…” 목소리가 끝까지 이어지지 않습니다.','마리아가 눈을 감고 천천히 씹습니다. “소스를 조금만 더 졸이면 엄마 맛이야. 다음엔 내가 옆에서 알려 줄게.”','마리아가 접시를 보고 오래 말이 없습니다. “…이건 엄마가 해 주던 건데.” 반가운 건지 아픈 건지 그녀 자신도 모르는 얼굴입니다.'],
    e:['에밀리가 “할머니 밥이다!” 하고 외칩니다. 영상 통화로만 본 외할머니 이야기를 엄마에게 조릅니다.','에밀리가 주황빛 밥을 숟가락으로 꾹꾹 눌러 먹습니다.','에밀리가 토마토 맛이 시다며 물을 찾습니다.']},
  hiddencarrot:{m:['마리아가 미트볼을 반으로 갈라 주황빛 알갱이를 보고 입을 막고 웃습니다. 그리고 에밀리 몰래 당신에게 윙크합니다.','“이거 혹시…” 마리아가 눈치챘지만 모른 척 넘어가 줍니다.','마리아가 무심하게 미트볼을 먹습니다.'],
    e:null},
  cake:{m:['마리아가 기울어진 케이크를 보고 웃음을 터뜨립니다. “피사의 케이크야?” 한 입 먹고는 웃음이 멎습니다. “…맛있어. 진짜로.”','“생크림 직접 올린 거야?” 마리아가 손가락으로 크림을 찍어 맛봅니다.','마리아가 케이크를 보고 묻습니다. “무슨 날이야? 재료비 꽤 들었겠다.”'],
    e:['에밀리가 케이크 앞에서 얼어붙습니다. “아빠가 만든 거야? 진짜로?” 딸기 하나를 집어 버니 입에 먼저 대 줍니다. 그날 밤 에밀리는 크림을 볼에 묻힌 채 잠듭니다.','에밀리가 딸기만 쏙쏙 빼 먹고 크림을 코에 묻힙니다.','에밀리가 케이크를 한 조각 먹고 “맛있어”라고 작게 말합니다.']},

    e:['에밀리가 새우를 꼬리째 들어 “새우가 춤춘다!” 하며 흔듭니다.','에밀리가 면만 후루룩 먹습니다.','에밀리가 새우 꼬리가 무섭다며 접시를 밀어냅니다.']}
};
const EMILY_CARROT=['에밀리가 수프 속 당근을 하나하나 골라 당신 그릇에 옮겨 담습니다. “아빠는 당근 좋아하잖아.” 마리아가 웃음을 참습니다.','에밀리가 숟가락으로 당근만 피해 국물을 떠먹습니다. 정교한 작업입니다.','에밀리가 당근을 보자마자 입을 꾹 다물고 고개를 젓습니다.'];
function dishReaction(r,mh,eh,gain){
  const f=S.flags;if(!f.dishLog)f.dishLog={};
  const log=f.dishLog[r.id]||{last:-9,n:0,streak:0};
  const repeat=log.last>=S.day-1&&log.n>0;
  log.streak=repeat?(log.streak||0)+1:0;log.last=S.day;log.n++;f.dishLog[r.id]=log;
  const first=log.n===1;
  if(!mh&&!eh){
    if(S.sep)return pick([`혼자 식탁에 앉아 ${r.n}을(를) 먹습니다. 맞은편 빈 의자 두 개가 유난히 커 보입니다. 사진을 찍어 마리아에게 보낼까 하다 휴대폰을 내려놓습니다.`,`${r.n}을(를) 한 그릇 더 덜어 냉동실에 넣어 둡니다. 토요일에 에밀리에게 데워 줄 수 있을까 생각하다가, 그럴 수 없다는 걸 떠올립니다.`]);
    if(S.flags.famAtLucia)return '루시아의 집에 있는 마리아와 에밀리 생각이 납니다. 쉼터 공용 부엌의 다른 사람들과 음식을 나눠 먹습니다.';
    return '혼자 식탁에 앉아 천천히 먹습니다.';
  }
  const T=[],D=DISH_REACT[r.id]||{};
  const tier=v=>v>=65?0:v>=35?1:2;
  T.push(mh&&eh?'세 식구가 식탁에 둘러앉습니다.':mh?'마리아와 마주 앉아 식사를 합니다.':'에밀리와 단둘이 식탁에 앉습니다.');
  let gm=r.relM,ge=r.relE;
  if(mh){
    if(S.alc>0){T.push('마리아는 술 냄새에 말없이 숟가락만 움직입니다. 무엇을 차렸는지는 중요하지 않은 얼굴입니다.');gm=1;}
    else if(repeat&&log.streak>=1){T.push(`“또 ${r.n.split(' (')[0]}이야?” 마리아가 웃으며 포크를 듭니다. “맛은 있는데, 다음엔 다른 것도 해 줘.”`);gm=Math.round(gm*0.4);}
    else{
      T.push(D.m?D.m[tier(S.rel.maria)]:'“맛있다, 스콧.” 마리아가 한 숟가락 더 뜹니다.');
      if(DISH_FAV.maria.includes(r.id)){gm=Math.round(gm*1.4);if(first)T.push('마리아가 좋아하는 요리입니다.');}
      if(r.id==='pancake'&&wd()===6&&hh()<12){gm+=3;T.push('일요일 아침의 팬케이크. 마리아에게 그건 단순한 아침 식사가 아닙니다.');}
      if((r.id==='steak'||r.id==='cake')&&S.money<120&&!S.daily.mariaBday&&!S.daily.emilyBday){gm=Math.round(gm*0.6);T.push('마리아가 지갑 사정을 아는 얼굴로 조심스럽게 묻습니다. “이번 주 집세는 괜찮은 거지?”');}
      if(r.id==='arroz'&&first)gm+=4;
    }
  }
  if(eh){
    if(r.id==='hiddencarrot'){
      if(xRoll({k:'craft',b:35,m:0.8})){T.push('에밀리가 미트볼을 세 개째 해치웁니다. “아빠, 오늘 미트볼 왜 이렇게 맛있어?” 당신은 마리아와 눈을 마주치고 아무 말도 하지 않습니다. 작전 성공입니다.');ge+=2;f.carrotWin=(f.carrotWin||0)+1;if(f.carrotWin===3){note('에밀리가 당근을 세 번이나 모르고 먹었습니다. 언젠가 진실을 말해 줄 날이 오겠지요.');}}
      else{T.push('에밀리가 미트볼 단면을 뚫어지게 봅니다. “…이거 주황색 뭐야?” 정적. “아빠 당근 넣었지!” 에밀리가 배신감 가득한 얼굴로 버니를 끌어안습니다.');ge=1;}
    }else if(r.carrot||r.need.carrot){T.push(EMILY_CARROT[tier(S.rel.emily)]);ge=1;}
    else if(repeat&&log.streak>=1){T.push(`“아빠, 어제도 ${r.n.split(' (')[0]} 먹었잖아.” 에밀리가 볼을 부풀립니다.`);ge=Math.round(ge*0.4);}
    else{
      T.push(D.e?D.e[tier(S.rel.emily)]:'에밀리가 입가에 소스를 묻힌 채 엄지를 치켜세웁니다.');
      if(DISH_FAV.emily.includes(r.id))ge=Math.round(ge*1.4);
      if((r.id==='pancake'||r.id==='breakfast')&&hh()>=17){T.push('“저녁에 아침밥 먹는 거야? 최고!” 에밀리가 의자 위에서 방방 뜁니다.');ge+=1;}
    }
  }
  if(r.id==='cake'&&(S.daily.mariaBday||S.daily.emilyBday)){
    T.push('불을 끄고 초를 켭니다. 서툰 생일 축하 노래가 작은 부엌을 채웁니다.');
    if(S.daily.mariaBday&&mh){gm+=10;S.daily.bdayWishedM=1;}
    if(S.daily.emilyBday&&eh){ge+=12;S.daily.bdayWishedE=1;}
  }
  if(gain){if(mh)rel('maria',gm);if(eh)rel('emily',ge);}
  else T.push('<span class="wd-dim">(오늘은 이미 가족과 함께 식사를 해서 호감은 더 오르지 않습니다.)</span>');
  return T.join(' ');
}

(function(){

    if(I&&I.lv&&min>0){
      if(!o.sleep){const k=(I.lv===1?0.3:I.lv===2?0.9:1.8)*(I.treated?0.6:1)*(o.work?1.5:1);st('fat',min/60*k);}

      if(S&&S.attrs&&penBase){Object.keys(penBase).forEach(k=>{const delta=(S.attrs[k]||0)-penLow[k];S.attrs[k]=Math.round((penBase[k]+delta)*10)/10;});}

    /* 보호관찰 */

function busRide(k){
  if(!hasBusPass()&&!pay(BUS_FARE))return;
  const ride=12+Math.floor(R()*14);
  say(`${hasBusPass()?'정기권을 찍고':'요금을 내고'} 창가 자리에 앉습니다. ${SEASON_DESC[seasonIdx()]} 창밖으로 도시가 천천히 흘러갑니다.`);
  if(R()<0.32)busEvent();
  if(!isOpen(k)){
    const hub=BUS_HUB[k]||'street';
    say(`${PL[k].n} 앞 정류장에서 내렸지만 문이 닫혀 있습니다. (운영시간 ${PL[k].open[0]}:00~${PL[k].open[1]}:00)`);
    go(hub,ride);return;
  }
  go(k,ride);
}

  }
  if(loc==='beach'&&!d.swim&&w!=='폭풍우'&&w!=='비'&&day){
    if(si===1)opt('바다에 뛰어들어 수영한다',()=>{d.swim=1;pass(60);const sw=S.worn.lower==='swim_trunks'||S.worn.lower==='shorts';st('fat',sw?4:8);st('str',sw?-14:-6);atUp('stam',2);say(sw?'차가운 파도가 온몸을 감쌉니다. 한참을 헤엄치다 물 위에 떠서 하늘을 봅니다. 귓가에 파도 소리만 남습니다.':'청바지째 바다에 뛰어듭니다. 시원하지만, 젖은 옷이 무겁게 들러붙습니다. (수영복이나 반바지가 있으면 더 좋았을 겁니다)');S.wet=1;},{min:60});
    if(si===3)opt('겨울 바다를 바라본다',()=>{d.swim=1;pass(30);st('str',-8);st('tra',-1);say('잿빛 파도가 텅 빈 해변을 때립니다. 갈매기 몇 마리가 바람을 타고 제자리에 떠 있습니다. 차가운 공기에 머릿속이 투명해집니다.');},{min:30});
  }
  if(loc==='home'&&si===3&&!d.heater&&h>=17){
    opt('난로 앞에서 몸을 녹인다',()=>{d.heater=1;pass(30);st('fat',-6);st('str',-5);say(mariaHome()?'마리아가 담요를 들고 와 당신 옆에 앉습니다. 난로의 주황 불빛이 두 사람 얼굴을 데웁니다.':'전기난로를 켜고 손바닥을 비빕니다. 얼었던 손가락에 서서히 감각이 돌아옵니다.');},{min:30});
  }
}
/* ----- 계절 사건 ----- */
LIFE.boiler={home:true,w:()=>seasonIdx()===3&&S.flags.boilerSeason!==seasonNo()&&S.house!=='shelter'&&!HOUSES[S.house].safe,run:()=>{
  S.flags.boilerSeason=seasonNo();
  say('새벽, 덜덜 떨며 눈을 뜹니다. 라디에이터가 차갑게 식어 있습니다. 보일러 표시등이 빨갛게 깜빡입니다. 창문에 성에가 끼었습니다.');
  opt('수리 기사를 부른다 ($95)',()=>{pass(90);const p=lose(95);if(p<95){S.flags.rentExtra=(S.flags.rentExtra||0)+(95-p);say('가진 돈이 모자라 나머지는 다음 집세에 얹기로 합니다.');}else say('기사가 점화 장치를 교체하자 보일러가 다시 웅웅거립니다.');},{min:90});
  opt(`직접 보일러를 뜯어 고친다 (${xTag({k:'mech',b:20,m:0.9})})`,()=>{pass(120);if(xRoll({k:'mech',b:20,m:0.9})){skUp('mech',2);st('str',-3);if(mariaHome())rel('maria',3);say('막힌 응축수 배관을 뚫고 점화 플러그를 닦아 냅니다. 보일러가 다시 살아납니다. 정비공 손은 집에서도 쓸모가 있습니다.');}else{lose(30);st('fat',8);st('str',8);say('부품을 사 왔지만 맞지 않습니다. 그날 밤은 온 가족이 담요를 겹겹이 덮고 잡니다.');if(mariaHome())rel('maria',-3);}},{min:120});
}};
LIFE.heatwave={home:false,w:()=>seasonIdx()===1&&S.flags.heatSeason!==seasonNo(),run:()=>{
  S.flags.heatSeason=seasonNo();S.temp=Math.max(S.temp,34);
  say('휴대폰에 재난 문자가 울립니다. 「폭염 경보 발령 · 낮 최고 34도 · 야외 활동을 자제하십시오」 집 안 공기가 찜통 같습니다.');
  opt('선풍기를 한 대 더 산다 ($30)',()=>{if(!pay(30))return;st('str',-3);if(mariaHome())rel('maria',2);say('철물점에서 사 온 선풍기 바람에 에밀리가 “아아아” 하고 목소리를 떨며 놉니다.');});
  opt('그냥 버틴다',()=>{st('fat',6);st('str',6);say('찬물 샤워를 세 번이나 합니다. 밤새 뒤척입니다.');});
}};

/* ----- 연결부 ----- */
(function(){
  const _nd=newDay;
  newDay=function(){
    const prevSi=seasonIdx();
    _nd();
    if(!S)return;
    rollWeather();
    const si=seasonIdx();
    if(si!==prevSi){
      chapterCard(`${SEASONS[si]}이 왔습니다`,['겨울의 끝자락이 물러가고 가로수에 꽃망울이 맺힙니다. 아침 공기가 한결 부드럽습니다.','뜨거운 햇살이 아스팔트를 달굽니다. 해변에 파라솔이 하나둘 펼쳐집니다.','바닷바람이 서늘해지고 가로수 잎이 물들기 시작합니다. 옷장에서 두꺼운 옷을 꺼낼 때입니다.','첫눈 예보가 나옵니다. 입김이 하얗게 피어오릅니다. 보일러와 난방비 걱정이 시작됩니다.'][si]);
      note(`계절이 ${SEASONS[si]}(으)로 바뀌었습니다. 날씨와 기온이 달라지니 옷차림을 확인하세요. (의류 매장에서 계절 옷을 살 수 있습니다)`);
    }
    if(!S.prison){
      if(wd()===2&&(si===3||si===1)){const ex=si===3?28:14;const p=lose(ex);note(`${si===3?'겨울 난방비':'여름 냉방비'} $${p}가 공과금에 추가로 청구되었습니다.`);if(p<ex)S.flags.rentExtra=(S.flags.rentExtra||0)+(ex-p);}
      if(festToday())note(`오늘은 ${SEASON_FEST[si].n}입니다! (${PL[SEASON_FEST[si].loc].n} · ${SEASON_FEST[si].h[0]}:00~${SEASON_FEST[si].h[1]}:00)`);
      if(!S.pendingLife&&R()<0.1&&(LIFE.boiler.w()||LIFE.heatwave.w()))queueLife(LIFE.boiler.w()?'boiler':'heatwave');
    }
  };
  /* 눈 · 비옷 · 기온 */
  const _hu=hasUmbrella;
  hasUmbrella=function(){return _hu()||S.worn.upper==='raincoat'||S.wardrobe.includes('folding_umb');};
  const _wa=weatherAtmosphere;
  weatherAtmosphere=function(){
    const t=S.weather==='눈'?`창밖에 함박눈이 소리 없이 내려 쌓입니다. 기온은 ${S.temp}°C입니다.`:_wa();
    return `${seasonName()} ${seasonDay()}일째. ${t}`;
  };
  const _we=weatherExposure;
  weatherExposure=function(l){
    _we(l);
    const outdoor=['street','westbrook','seabreeze','civic','park','beach','gas','alley'];
    if(!outdoor.includes(l))return;
    const tw=totalWarmth(),[lo,hi]=comfortRange();
    if(S.weather==='눈'){
      if(S.worn.feet==='snow_boots'||S.worn.feet==='rain_boots')sys('미끄러운 눈길이지만 부츠 덕분에 발이 젖지 않습니다.');
      else{st('str',2);if(R()<0.12){injure(1,'손목');say('빙판길에서 미끄러져 손목을 짚었습니다.');}else sys('눈이 신발 속으로 스며들어 발이 시립니다. (방한화나 장화가 있으면 좋습니다)');}
    }
    if(tw<lo-2){const g=Math.min(6,Math.ceil((lo-tw)/4));st('str',g);st('fat',Math.ceil(g/2));say(`<b>옷차림이 너무 얇습니다.</b> 찬 공기가 옷 속으로 파고들어 이가 딱딱 부딪힙니다. (보온성 ${tw} · 쾌적 범위 ${lo}~${hi})`);if(tw<lo-10&&R()<0.15){st('fat',6);note('몸살 기운이 돕니다. 따뜻하게 입어야 합니다.');}}
    else if(tw>hi+3){const g=Math.min(5,Math.ceil((tw-hi)/4));st('fat',g);st('str',Math.ceil(g/2));say(`<b>옷차림이 너무 덥습니다.</b> 셔츠가 땀에 흠뻑 젖어 등에 들러붙습니다. (보온성 ${tw} · 쾌적 범위 ${lo}~${hi})`);}
  };
  /* 장소에 버스 · 계절 활동 연결 */
  ['street','westbrook','seabreeze','civic'].forEach(k=>{
    const f=LOC[k];
    LOC[k]=function(){
      f();
      opt(busRuns()?`버스 정류장에서 시내버스를 탄다 (요금 $${BUS_FARE})`:'버스 정류장 (운행 종료)',busPage,{sec:'travel',cls:busRuns()?'':'off',tag:hasBusPass()?'정기권':''});
      if(k==='street')festivalOpts('street');
    };
  });
  ['park','beach','home'].forEach(k=>{const f=LOC[k];LOC[k]=function(){f();seasonalOpts(k);festivalOpts(k);};});
  /* 정장 면접 보너스 */
  const _hr=hireRoll;
  hireRoll=function(id,p){
    const n=formalCount();
    if(n>=2){say(n>=4?'빈틈없는 정장 차림에 면접관이 고개를 끄덕입니다. 외모에서 이미 반은 먹고 들어갑니다.':'단정한 옷차림이 면접관에게 좋은 인상을 줍니다.');p+=n*3;}
    return _hr(id,p);
  };
  /* 화면 */
  const _render=render;
  render=function(){
    _render();
    const top=$('dol-top');
    if(top&&S)top.innerHTML=top.innerHTML.replace(/<p>([^<]*?) (새벽|아침|오후|밤)입니다\./,`<p>${seasonName()} ${seasonDay()}일째 · $1 $2입니다.`);
  };
  const _tip=dailyTipText;
  dailyTipText=function(){
    const t=_tip();
    if(festToday()&&!S.daily.fest&&!S.prison){const F=SEASON_FEST[seasonIdx()];return `오늘은 ${F.n}! ${PL[F.loc].n}에서 ${F.h[0]}:00~${F.h[1]}:00 사이에 즐길 수 있습니다.`;}
    if(!S.shift&&!S.prison&&!S.sep){const tw=totalWarmth(),[lo,hi]=comfortRange();if(tw<lo-2)return `바깥 기온 ${S.temp}°C. 지금 옷차림(보온성 ${tw})은 너무 춥습니다. 옷장에서 따뜻한 옷으로 갈아입으세요. (쾌적 범위 ${lo}~${hi})`;if(tw>hi+3)return `바깥 기온 ${S.temp}°C. 지금 옷차림(보온성 ${tw})은 너무 덥습니다. 가벼운 옷으로 갈아입으세요.`;}
    return t;
  };
  const _sj=showJournal;
  showJournal=function(){_sj();const b=$('mbox');if(b)b.innerHTML=b.innerHTML.replace('<tr><td>날씨 및 기온</td><td>',`<tr><td>계절</td><td>${seasonName()} ${seasonDay()}일째 (다음 계절까지 ${SEASON_LEN-seasonDay()+1}일)</td></tr><tr><td>날씨 및 기온</td><td>`);};
})();

setPanel(window.innerWidth>=1000);
start();
</script>
</body>
