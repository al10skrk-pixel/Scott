<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스콧 카터: 윌로우 크릭</title>
<style>
:root{--bg:#1c1c1c;--panel:#161616;--line:#3a3a3a;--text:#e6e6e6;--dim:#8a8a8a;--blue:#3d9be9;--story-size:16px;--choice-size:14px;--ui-size:14px;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
#app{position:relative;min-height:100%}
#mini-bar{position:fixed;top:0;left:0;bottom:0;width:46px;background:#141414;border-right:1px solid var(--line);z-index:25;display:flex;flex-direction:column;align-items:center;padding-top:52px;gap:4px;transition:transform .25s}
body.po #mini-bar{transform:translateX(-100%)}
.mb-time{width:38px;border:1px solid #444;background:#1c1c1c;text-align:center;font-size:13px;font-weight:700;line-height:1.15;padding:4px 0;color:#e6e6e6;margin-bottom:4px}
.mb-time span{display:block;font-size:10px;color:#8a8a8a;letter-spacing:2px}
.mb-stat{width:38px;border:1px solid #3a3a3a;background:#191919;text-align:center;padding:3px 2px 4px;cursor:pointer}
.mb-stat b{display:block;font-size:13px;font-weight:700;line-height:1.2}
.mb-stat i{display:block;height:3px;background:#333;margin-top:3px;overflow:hidden}
.mb-stat i em{display:block;height:100%;font-style:normal}
#panel{position:fixed;top:0;left:0;bottom:0;width:300px;background:var(--panel);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .25s;z-index:28;overflow-y:auto;padding:52px 14px 28px}
#panel.open{transform:none}
#tog{position:fixed;top:10px;left:4px;z-index:35;width:38px;height:38px;background:#242424;color:#fff;border:1px solid #666;font-size:20px;cursor:pointer;transition:left .25s;line-height:1}
#tog.open{left:256px}
.dol-info{text-align:center;font-size:14px;line-height:1.65;color:#e0e0e0;margin-bottom:14px}
.dol-info p{margin:0 0 10px}
.dol-wear{font-size:13px;color:#cfcfcf;line-height:1.6;margin:10px 0 14px;text-align:center;word-break:keep-all}
.dol-stat{margin:8px 0;text-align:center}
.dol-stat-lbl{font-size:14px;margin-bottom:3px;color:#e6e6e6}
.dol-bar{height:5px;background:#444;overflow:hidden}
.dol-bar i{display:block;height:100%;transition:width .35s,background .35s}
.dol-tip{margin:16px 0;font-size:13px;line-height:1.6;color:#dcdcdc;text-align:center;word-break:keep-all}
.dol-tip b{color:#e0c040}
.dol-grid{border:1px solid #4a4a4a;margin-bottom:12px}
.dol-grid-row{display:grid;grid-template-columns:1fr 1fr}
.dol-grid-row+.dol-grid-row,.dol-grid>.pbtn+.pbtn,.dol-grid>.pbtn+.dol-grid-row{border-top:1px solid #4a4a4a}
.dol-grid-row .pbtn+.pbtn{border-left:1px solid #4a4a4a}
.pbtn{display:block;width:100%;padding:11px 6px;background:transparent;color:#eaeaea;border:none;font-size:var(--ui-size);font-weight:600;letter-spacing:.04em;cursor:pointer;text-align:center}
.pbtn:hover{background:#242424}
.optrow{margin:14px 0}.optrow label{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:7px;color:#bbb}.optrow input[type=range]{width:100%;accent-color:#8ea9df}.optreset{background:#292929;color:#bbb;border:1px solid #444;padding:7px 11px;border-radius:4px;font-size:13px;cursor:pointer}
main{max-width:740px;margin:0 auto;padding:54px 22px 60px 62px;transition:padding .25s}
@media(min-width:1000px){body.po main{padding-left:328px;max-width:1050px}}
#loc{color:var(--dim);font-size:13px;letter-spacing:.1em;margin-bottom:14px;text-align:center}
#story p{line-height:1.8;margin:0 0 14px;font-size:var(--story-size);word-break:keep-all}
#story .note{display:block;color:#c9b26b;font-size:14px;margin:6px 0}
#story .imp{color:#e46a6a;font-style:italic}
#story .sys{color:var(--dim);font-size:14px}
.fx{font-size:13px;color:var(--dim);margin:4px 0 6px}
.fx span{margin-right:10px}.fx .up{color:#7fc97f}.fx .dn{color:#e46a6a}
hr{border:none;border-top:1px solid var(--line);margin:22px 0}
#choices{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:2px 0}
.ch-sec{color:#e6e6e6;font-size:15px;font-weight:600;margin:14px 0 4px}
.ch-sec:first-child{margin-top:2px}
#choices button{display:block;width:auto;max-width:100%;margin:0;padding:0;border:0;border-radius:0;background:none;color:#6ea8fe;font-size:var(--choice-size);font-weight:600;line-height:1.65;cursor:pointer;text-align:left;word-break:keep-all}
#choices button:hover{background:none;color:#a9cbff;text-decoration:underline}
#choices button.off{color:#666;opacity:.75}
#choices button.risk{color:#e08a5a}
#choices button.risk:hover{color:#f2ad83}
.lp-box{font-size:14px;line-height:1.65;color:#e6e6e6}
.lp-bar{display:flex;justify-content:space-between;align-items:center;background:#141414;border:1px solid #3a3a3a;border-radius:5px;padding:7px 11px;margin-bottom:12px;font-size:12px;color:#9a9a9a}
.lp-tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid #3a3a3a;padding-bottom:8px}
.lp-tab{background:#1a1a1a;color:#9a9a9a;border:1px solid #3a3a3a;border-radius:4px;padding:6px 11px;font-size:13px;cursor:pointer;margin:0}
.lp-tab.active{background:#263244;color:#8eb8ff;border-color:#537bb8;font-weight:700}
.lp-card{background:#181818;border:1px solid #333;border-radius:6px;padding:10px 12px;margin-bottom:9px}
.lp-card h4{margin:0 0 4px;font-size:14px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lp-card p{margin:0 0 8px;font-size:13px;color:#b8b8b8;line-height:1.55}
.lp-badge{font-size:11px;padding:2px 6px;border-radius:3px;background:#262626;color:#c9b26b;border:1px solid #444;white-space:nowrap}
.lp-badge.ok{color:#7fc97f;border-color:#3d6b3d}
.lp-badge.warn{color:#e08a5a;border-color:#6b4433}
.lp-actions{display:flex;flex-wrap:wrap;gap:6px}
.lp-actions button{margin:0;font-size:12px;padding:5px 10px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.box{background:#1f1f1f;border:1px solid #444;border-radius:8px;max-width:540px;width:100%;max-height:88vh;overflow:auto;padding:20px}
.box h3{margin:0 0 12px;font-size:18px}
.box p,.box li{line-height:1.7;font-size:14px}
.box table{width:100%;border-collapse:collapse;font-size:14px}
.box td{padding:6px 4px;border-bottom:1px solid #2e2e2e;vertical-align:top}
.box td:first-child{color:var(--dim);width:36%}
.box button{background:#2a2a2a;color:var(--text);border:1px solid #555;border-radius:4px;padding:8px 12px;cursor:pointer;margin:4px 4px 0 0;font-size:14px}
.box button:hover{background:#343434}
.box textarea{width:100%;height:80px;background:#111;color:#ccc;border:1px solid #444;font-size:12px}
.bar{height:5px;background:#444;overflow:hidden}.bar i{display:block;height:100%}
.relc{margin:10px 0 16px}.relc .t{display:flex;justify-content:space-between;font-size:15px}.relc .d{color:var(--dim);font-size:13px;margin-top:4px}
.end h2{text-align:center;margin:10px 0 20px;font-size:24px}
.shop-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.shop-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#252525;border:1px solid #353535;border-radius:6px}
.shop-item div{max-width:72%}
.shop-item b{font-size:14px;display:block;margin-bottom:2px}
.shop-item span{font-size:12px;color:var(--dim);display:block;line-height:1.4}
/* ===== 옷장 · 노트북 공용 UI (참고 이미지 디자인) ===== */
.wd{font-size:var(--story-size);line-height:1.8;color:#e6e6e6}
.wd p{margin:0 0 8px}
.wd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.wd-head-l{flex:1;min-width:0}
.wd-optbtn{flex:none;background:transparent;color:#e6e6e6;border:1px solid #5a5a5a;border-radius:4px;padding:9px 15px;font-size:var(--ui-size);font-family:inherit;cursor:pointer;margin-top:34px}
.wd-optbtn:hover,.wd-optbtn.on{border-color:#a0a0a0;background:#222}
.wd-hr{border:none;border-top:2px solid #d0d0d0;margin:18px 0}
.wd-lbl{margin:0 0 6px}
.wd-gauge{position:relative;height:14px;border-radius:8px;background:linear-gradient(90deg,#3b82f6 0%,#9cc3ec 28%,#fff6cf 50%,#f4b48e 70%,#e5342a 100%);margin:8px 0 14px}
.wd-gauge .rng{position:absolute;top:-4px;bottom:-4px;border:2px solid rgba(255,255,255,.75);border-radius:9px;box-sizing:border-box}
.wd-gauge .mk{position:absolute;top:-7px;width:6px;height:28px;margin-left:-3px;background:#fff;border:2px solid #111;border-radius:3px}
.wd-helpwrap{text-align:center;margin:4px 0 10px}
.wd-help{display:inline-flex;align-items:center;justify-content:center;width:46px;height:44px;background:transparent;border:1px solid #6a6a6a;cursor:pointer;padding:0}
.wd-help span{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:#3a7bc8;border:2px solid #cfe0f5;color:#fff;font-weight:700;font-size:15px;line-height:1}
.wd-cold{color:#3fc1c9}.wd-warm{color:#e0c040}.wd-hot{color:#f0863e}.wd-ok{color:#7fc97f}.wd-num{color:#e8963a}
.wd-dim{color:#8a8a8a;font-size:.9em}
.wd-msg{margin:4px 0 12px}
.wd-links,.wd-radios{line-height:2.1}
.wd-link{color:#6ea8fe;cursor:pointer;text-decoration:none;white-space:nowrap}
.wd-link:hover{color:#a9cbff;text-decoration:underline}
.wd-link.active{color:#e8c43a;text-decoration:underline;text-underline-offset:3px}
.wd-link.risk{color:#e08a5a}
.wd-sep{color:#d0d0d0;margin:0 9px;font-weight:300}
.wd-title{color:#fff;text-decoration:underline;text-underline-offset:5px}
p.wd-sec{margin-top:6px}
.wd-cnt{color:#e6e6e6;font-style:italic}
.wd-radio{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;white-space:nowrap}
.wd-radio i{flex:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #c8c8c8;box-sizing:border-box}
.wd-radio.on i{border:6px solid #3b82f6}
.wd-check i{border-radius:5px}
.wd-check.on i{border:2px solid #3b82f6;background:#3b82f6 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3 8.5l3 3 7-7' stroke='white' stroke-width='2.4' fill='none'/></svg>") center/14px no-repeat}
.wd-sets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 6px}
.wd-setbtn{background:transparent;color:#6ea8fe;border:2px solid #9a9a9a;padding:10px 8px;text-align:center;cursor:pointer;font-size:var(--story-size);font-family:inherit;line-height:1.4;word-break:keep-all}
.wd-setbtn:hover{background:#222;color:#a9cbff}
.wd-setbtn.del{color:#e08a5a;border-color:#8a5a44}
.wd-setbtn small{display:block;color:#8a8a8a;font-size:12px;margin-top:3px}
.wd-panel{border:1px solid #444;background:#181818;padding:10px 12px;margin:10px 0}
.wd-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 11px;border:1px solid #3a3a3a;background:#181818;margin:0 0 7px;cursor:pointer}
.wd-item:hover{border-color:#6ea8fe}
.wd-item.worn{border-color:#e8c43a;background:#201e15}
.wd-item.wd-static{cursor:default}
.wd-item.wd-static:hover{border-color:#3a3a3a}
.wd-item-info{min-width:0;flex:1}
.wd-item-info>b{display:block;color:#eee;font-size:.95em;font-weight:600;line-height:1.6}
.wd-item-info>span{display:block;color:#9a9a9a;font-size:13px;line-height:1.55}
.wd-item-info>span.wd-desc{color:#767676}
.wd-item-info .wd-links{margin:4px 0 0;font-size:14px;line-height:1.9}
.wd-tag{font-style:normal;font-weight:600;color:#e8c43a;font-size:12px;border:1px solid #6b5b20;padding:0 5px;margin-right:4px}
.wd-act{flex:none;font-size:13px;color:#6ea8fe;border:1px solid #444;padding:3px 9px;white-space:nowrap}
.wd-act.risk{color:#e08a5a;border-color:#6b4433}
.wd-act.dim{color:#777}
.lp-badge.dim{color:#888}
.fam-box{margin:2px 0 14px}
.fam-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fam-card{border:2px solid #9a9a9a;padding:9px 10px;cursor:pointer;background:#181818}
.fam-card:hover{border-color:#6ea8fe}
.fam-card.away{border-color:#474747}
.fam-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.fam-top b{color:#6ea8fe;font-size:1.05em}
.fam-role{font-size:12px;color:#9a9a9a;white-space:nowrap}
.fam-where{display:block;font-size:13px;margin:2px 0 6px;line-height:1.4}
.fam-mood{display:block;font-size:12px;color:#bbb;margin-top:5px}
.fam-profile{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.fam-avatar{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#111}
.fam-bar{height:7px;margin:4px 0 12px}
.wd-msgbox{margin:4px 0 12px}
.wd-na{color:#666}
.wd-input{width:100%;max-width:280px;background:#111;color:#eee;border:1px solid #555;padding:6px 8px;font-size:14px;font-family:inherit;margin:0 0 4px}

/* ===== 기상 시 옷 고르기 ===== */
.wake .wd-radio{flex-direction:row-reverse}
/* ===== 의류 매장 (참고 이미지 디자인) ===== */
.cs-top{display:flex;align-items:flex-start;gap:8px;margin:0 0 14px}
.cs-back{flex:none;display:inline-block;background:#6a6a6a;padding:1px;clip-path:polygon(16px 0,100% 0,100% 100%,16px 100%,0 50%);cursor:pointer;margin-right:auto;text-decoration:none}
.cs-back span{display:block;background:var(--bg);clip-path:polygon(16px 0,100% 0,100% 100%,16px 100%,0 50%);padding:8px 14px 8px 24px;color:#6ea8fe;white-space:nowrap}
.cs-back:hover span{color:#a9cbff}
.cs-sbtn{flex:none;background:transparent;color:#e6e6e6;border:1px solid #5a5a5a;border-radius:3px;padding:12px 10px;font-size:13px;font-family:inherit;cursor:pointer;line-height:1.2}
.cs-sbtn.on{background:#2a2a2a;border-color:#a0a0a0}
.cs-tabs{display:flex;flex-wrap:wrap;margin:2px 0 0 26px}
.cs-tabs+.cs-tabs{margin:0 0 16px 10px}
.cs-tab{transform:skewX(-28deg);border:1px solid #d8d8d8;margin:0 -1px -1px 0;padding:5px clamp(7px,2.4vw,12px);cursor:pointer;user-select:none}
.cs-tab b{display:inline-block;transform:skewX(28deg);font-weight:500;color:#e6e6e6;white-space:nowrap;font-size:clamp(13px,3.6vw,.95em)}
.cs-tab:hover{background:#2a2a2a}
.cs-tab.on{background:#ececec}.cs-tab.on b{color:#111}
.cs-search{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:10px 0 12px}
.cs-search input{background:#111;border:1px solid #5a5a5a;color:#eee;padding:9px 10px;font-size:15px;min-width:0;font-family:inherit}
.cs-clear{background:#222;border:1px solid #5a5a5a;color:#e6e6e6;padding:8px 14px;cursor:pointer;font-family:inherit;font-size:var(--story-size);white-space:nowrap}
.cs-clear:hover{background:#2c2c2c}
.cs-per{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.cs-perbox{border:1px solid #5a5a5a;padding:4px 10px;cursor:pointer;min-width:38px;text-align:center}
.cs-per .wd-dim{margin-left:auto}
.cs-item{position:relative;border:2px solid #9a9a9a;margin:0 0 4px;padding:8px 92px 10px 19%;cursor:pointer;min-height:92px;background:#121212;line-height:1.5}
.cs-item:hover{border-color:#6ea8fe}
.cs-item.own{background:#1b1b1b}
.cs-item.cs-big{cursor:default}.cs-item.cs-big:hover{border-color:#9a9a9a}
.cs-slot{position:absolute;left:10px;top:12px;font-size:11px;color:#6f6f6f;letter-spacing:.05em}
.cs-head{margin-bottom:3px}
.cs-name{color:#6ea8fe;font-size:1.05em}
.cs-own{color:#e6e6e6;font-size:.92em;margin-left:8px}
.cs-dots{display:flex;align-items:center;gap:4px;font-size:12px;line-height:1.55}
.cs-dots span{width:22px;color:#cfcfcf}
.cs-dots i{flex:none;width:11px;height:11px;border-radius:50%;border:1px solid #8a8a8a;box-sizing:border-box}
.cs-desc{color:#8a8a8a;font-size:13px;margin-top:4px}
.cs-tag{position:absolute;top:12px;right:4px;transform:rotate(22deg);background:#707070;color:#1a1a1a;font-weight:800;padding:2px 11px 2px 19px;border-radius:12px 5px 5px 12px;font-size:15px;line-height:1.5}
.cs-tag::before{content:'';position:absolute;left:8px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#1a1a1a}
.cs-tag.own{background:#f2d64b;box-shadow:0 2px 6px rgba(0,0,0,.55)}
.cs-pager{text-align:center;margin-top:10px}
/* ===== 식료품점 (참고 이미지 디자인) ===== */
.gr-box{border:2px solid #555;background:#2b2b2b;margin-top:12px}
.gr-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:2px solid #555}
.gr-lbl{color:#f0cf47;font-weight:700;flex:none}
.gr-fill{flex:1 1 auto;min-width:0;line-height:1.7}
.gr-fill a{color:#6ea8fe;cursor:pointer}
.gr-fill a:hover{color:#a9cbff;text-decoration:underline}
.gr-basket{flex:none;margin-left:auto;text-align:right;line-height:1.3;white-space:nowrap}
.gr-total{display:block;font-size:12px;color:#f0cf47}
.gr-input{flex:1;min-width:0;background:#444;border:2px solid #666;color:#eee;padding:8px 10px;font-size:15px;font-family:inherit}
.gr-list{max-height:62vh;overflow-y:auto;padding:12px 10px}
.gr-cat{border:2px solid #555;background:#232323;margin-bottom:12px;min-height:80px}
.gr-cat:last-child{margin-bottom:0}
.gr-cat-h{color:#f0cf47;padding:8px 14px;cursor:pointer;font-size:1.05em;user-select:none}
.gr-chev{display:inline-block;width:9px;height:9px;border-right:3px solid #c8c8c8;border-bottom:3px solid #c8c8c8;transform:rotate(-45deg);margin-left:12px;vertical-align:2px;transition:transform .2s}
.gr-cat.open .gr-chev,.gr-list.searching .gr-chev{transform:rotate(45deg);vertical-align:5px}
.gr-cat-b{display:none}
.gr-cat.open .gr-cat-b,.gr-list.searching .gr-cat-b{display:block}
.gr-item{text-align:center;padding:10px 12px 12px;border-top:2px solid #444}
.gr-item:first-child{border-top:none}
.gr-meta b{color:#f0cf47;font-weight:500}
.gr-step{border:2px solid #666;border-radius:14px;overflow:hidden;margin:6px auto 6px;max-width:440px}
.gr-name{padding:5px 6px;border-bottom:2px solid #666}
.gr-btns{display:grid;grid-template-columns:1fr 1fr 1fr 2.6fr 1fr 1fr 1fr}
.gr-btns>*{border:0;border-left:2px solid #666;background:#2e2e2e;color:#eee;padding:7px 0;display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:inherit;margin:0}
.gr-btns>*:first-child{border-left:0}
.gr-btns button{cursor:pointer}
.gr-btns button:hover{background:#3a3a3a}
.gr-btns button:active{background:#454545}
.gr-q{color:#f0cf47;background:#353535}
.gr-btns svg{width:20px;height:20px}
.gr-desc{color:#b0b0b0;font-size:14px;margin-top:6px;line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <div id="mini-bar" title="사이드바 열기"></div>
  <aside id="panel">
    <div id="dol-top"></div>
    <div id="stats"></div>
    <div id="dol-tip"></div>

function say(...t){t.forEach(x=>buf.push('<p>'+x+'</p>'))}
function note(t){buf.push('<p class="note">'+t+'</p>')}
function sys(t){buf.push('<p class="sys">'+t+'</p>')}
function st(k,d){if(!d)return;const o=S.st[k];S.st[k]=clamp(o+d);const r=S.st[k]-o;if(r)fx[k]=(fx[k]||0)+r;}
function alcMod(d){if(!d)return;const o=S.alc;S.alc=clamp(o+d);const r=S.alc-o;if(r)fx.alc=(fx.alc||0)+r;}
function rel(k,d){if(!S.met[k]){S.met[k]=1;if(S.rel[k]==null)S.rel[k]=20;}const o=S.rel[k];S.rel[k]=clamp(o+d);const r=S.rel[k]-o;if(r)fx['r_'+k]=(fx['r_'+k]||0)+r;}
function cash(d){S.money+=d;fx.money=(fx.money||0)+d;}
function lose(n){const a=Math.max(0,Math.min(S.money,Math.round(n)));if(a)cash(-a);return a;}
/* 난이도: 기술·능력치는 소폭씩, 높을수록 더 더디게 오른다 */
function skUp(k,n){const cur=S.skills[k]||0;const g=Math.max(0.2,n*0.45*(1-cur/120));S.skills[k]=Math.min(100,Math.round((cur+g)*10)/10);return g;}
function atUp(k,n){const cur=S.attrs[k]||0;const g=Math.max(0.2,n*0.45*(1-cur/120));S.attrs[k]=Math.min(100,Math.round((cur+g)*10)/10);return g;}
const fl=v=>Math.floor(v||0);
function fmtDur(min){
  if(!min)return '';
  const h=Math.floor(min/60),m=min%60;
  return ` (${h}:${String(m).padStart(2,'0')})`;
}
function opt(label,fn,o={}){
  const sec=o.sec||'poi';
  const dur=o.min?fmtDur(o.min):'';
  const tag=o.tag?` (${o.tag})`:'';
  choices.push(Object.assign({label:label+dur+tag,fn,sec},o));
}

function flushFx(){
  const keys=Object.keys(fx).filter(k=>fx[k]);if(!keys.length)return;
  const good={fat:-1,str:-1,tra:-1,ctl:1,cha:1,alc:-1,money:1};
  const h=keys.map(k=>{
    const v=fx[k];let nm,g;
    if(k==='money'){nm='돈';g=1}
    else if(k==='alc'){nm='음주';g=-1}
    else if(k.startsWith('r_')){const P=NPC[k.slice(2)]||{n:k.slice(2)};nm=P.sn||P.n.split(' ')[0];g=1}
    else{nm=STATN[k];g=good[k]}
    const cls=(v*g>0)?'up':'dn';
    if(k==='money')return `<span class="${cls}">${nm} ${v>0?'+':''}$${Math.abs(v)}</span>`;
    const a=Math.abs(v);
    const sign=v>0?'+':'-';
    const mark=a<4?sign:a<10?(sign+sign):(sign+sign+sign);
    return `<span class="${cls}">${nm} ${mark}</span>`;
  }).join('');
  buf.push('<div class="fx">'+h+'</div>');fx={};
}

/* ============ 시간 ============ */
function pass(min,o={}){
  let left=min;
  while(left>0){
    const step=Math.min(60,left);left-=step;S.t+=step;
    const stamFactor=Math.max(0.65,1-(S.attrs?.stam||30)*0.003);
    if(o.sleep) st('fat',-step/60*(o.rest||12));
    else st('fat',step/60*(o.work?4:2.2)*stamFactor);
    if(!o.drinking && S.alc>0){
      const drop=(step/60)*(o.sleep?11:7);
      S.alc=Math.max(0,Math.round((S.alc-drop)*10)/10);
      if(S.alc<1)S.alc=0;
    }
    if(S.t>=1440){S.t-=1440;newDay();}
  }
}

function newDay(){
  const prevWd=wd();const prevDay=S.day;const prevDaily=S.daily||{};
  if(S.prison){
    S.day++;S.daily={};S.flags.nightOutWarn=0;
    S.weather=pick(['맑음','맑음','흐림','흐림','비','폭풍우']);
    const baseTemp={맑음:18,흐림:14,비:11,폭풍우:8}[S.weather]||15;
    S.temp=baseTemp+Math.floor(R()*5)-2;
    if(S.drank){S.sober=0}else{S.sober++}
    S.drank=false;S.crave=Math.max(0,S.crave-4);
    S.heat=Math.max(0,S.heat-5);
    famDaily(prevDaily,true);
    injDaily();
    S.prison.daysLeft--;
    if(S.prison.daysLeft<=0){
      const crimeLabel=S.prison.reason;
      S.prison=null;
      S.loc='street';
      S.heat=Math.max(0,S.heat-25);
      st('str',-10);
      note(`형기(${crimeLabel})를 모두 마치고 블랙우드 교도소 정문 밖으로 출소했습니다. 윌로우 크릭 드라이브로 돌아왔습니다.`);
    }else{
      rel('maria',-1);
      note(`수감 ${S.prison.totalDays-S.prison.daysLeft}일째. 출소까지 ${S.prison.daysLeft}일 남았습니다.`);
    }
    return;
  }
  if(S.job&&!JOBS[S.job.id].noDaily){
    const J=JOBS[S.job.id];
    if(J.days.includes(prevWd)&&S.job.lastDay!==prevDay&&S.job.hired<prevDay){
      note(`어제 「${J.n}」에 무단결근했습니다.`);
      addStrike('무단결근',2);

  if(S.loc!=='home'&&!S.flags.nightOutWarn&&!S.sep&&!S.flags.famAtLucia&&!S.prison&&!(S.deploy&&S.deploy.phase==='service')){rel('maria',-4);S.flags.nightOutWarn=1;}
  S.day++;S.daily={};S.flags.nightOutWarn=0;
  S.weather=pick(['맑음','맑음','맑음','흐림','흐림','비','비','폭풍우']);
  const baseTemp={맑음:18,흐림:14,비:11,폭풍우:8}[S.weather]||15;
  S.temp=baseTemp+Math.floor(R()*5)-2;
  if(S.drank){S.sober=0}else{S.sober++}
  S.drank=false;S.crave=clamp(S.crave+7);
  if(S.crave>=60){st('str',5);}
  if(S.st.str>=90)st('ctl',-6);else if(S.st.str>=70)st('ctl',-3);
  if(S.st.tra>=60)st('ctl',-1);
  S.heat=Math.max(0,S.heat-3);
  injDaily();
  if(S.job)rel('maria',1);else if(S.day>=6)rel('maria',-1);
  if(S.gangRank>=2){
    const passive=S.gangRank===3?220:90;
    cash(passive);
    note(S.gangRank===3?`조직 보스 상납금 $${passive}가 들어왔습니다.`:`구역 관리 몫으로 조직에서 $${passive}를 보내왔습니다.`);
  }
  const w=wd();
  if(w===4&&!S.sep&&!S.flags.famAtLucia){const wp=Math.round((WIFE_PAY-(S.flags.wifeCut?120:0))*payMult());S.flags.wifeCut=0;cash(wp);note(`금요일. 마리아의 주급 $${wp}가 생활비 통장에 들어왔습니다.${payMult()<1?' (임신·출산으로 근무를 줄여 평소보다 적습니다)':''}`);}

  if(S.flags.tooth){st('str',4);st('fat',2);note('어금니가 밤새 욱신거렸습니다. (병원에서 치과 진료 가능)');}
  if(S.flags.fineDue&&S.day>=S.flags.fineDue){S.flags.fineDue=0;const p=lose(100);st('str',6);note(`미납 과태료가 가산금과 함께 $${p} 강제 징수되었습니다.`);}
  if(S.flags.loanBack&&S.day>=S.flags.loanBack.day){const lb=S.flags.loanBack;S.flags.loanBack=null;if(lb.amt){cash(lb.amt);note(`동료가 빌려 간 $${lb.amt}를 약속대로 갚았습니다.`);}else{st('str',5);note('돈을 빌려 간 동료가 당신을 피해 다닙니다. 40달러는 떼인 모양입니다.');}}
  if(S.flags.luciaBack&&S.day>=S.flags.luciaBack.day){const lb=S.flags.luciaBack;S.flags.luciaBack=null;if(lb.amt){cash(lb.amt);note('루시아가 빌려 간 $100를 갚았습니다. 마리아가 안도의 한숨을 쉽니다.');}else{st('str',4);note('루시아에게선 소식이 없습니다. 마리아는 그 이야기를 꺼내지 않습니다.');}}
  if(w===0&&(S.rent+(S.flags.rentExtra||0))>0){
    const due=S.rent+(S.flags.rentExtra||0),HS=HOUSES[S.house],lbl=S.houseOwned?'관리비·재산세':'집세';
    if(S.money>=due){cash(-due);S.rentPaid++;S.flags.rentExtra=0;note(`월요일. ${lbl} $${due}${due>S.rent?` (추가 청구분 포함)`:''}가 빠져나갔습니다. (남은 돈 $${S.money})`);}
    else{S.missedRent++;st('str',20);rel('maria',-15);
      note(S.missedRent>=2?`${lbl}를 또 내지 못했습니다...`:S.houseOwned?`${lbl} $${due}를 내지 못했습니다! 시청에서 체납 독촉장이 날아왔습니다. 다음 주에도 못 내면 집이 압류됩니다.`:`${lbl} $${due}를 내지 못했습니다! ${HS.landlord}이(가) 문에 최후통첩을 붙였습니다. 다음 주에도 못 내면 쫓겨납니다.`);}
  }
  {const HS=HOUSES[S.house];
    if(HS.str)st('str',HS.str);
    if(HS.relM&&R()<0.6)rel('maria',HS.relM);
    if(HS.relE&&R()<0.6)rel('emily',HS.relE);
    if(HS.damp&&R()<0.3){st('fat',3);note('반지하의 눅눅한 곰팡이 냄새 때문에 밤새 기침을 했습니다.');}
  }
  famDaily(prevDaily,false);
  if(S.flags.emilyWorse&&S.day>=S.flags.emilyWorse){S.flags.emilyWorse=0;S.pendingLife='emilyWorse';}
  else if(!S.pendingLife&&S.day>=3&&R()<0.38)S.pendingLife=pickLife();
}

function isOpen(l){const o=PL[l].open;if(!o)return true;const h=hh();return o[0]<o[1]?(h>=o[0]&&h<o[1]):(h>=o[0]||h<o[1]);}
const mariaHome=()=>{if(S.sep||S.flags.famAtLucia)return false;const h=hh();if(h>=23||h<6)return false;if(mLeave())return true;return weekend()?true:(h>=18||(h<7&&h>=6)||S.daily.mariaOff);};
const emilyHome=()=>{const h=hh();if(S.flags.emilyFoster||S.sep||S.flags.famAtLucia)return false;if(S.daily.emilyBed||h>=21||h<7)return false;return weekend()?true:(h>=18||(S.daily.picked&&h>=15));};

/* ============ 메인 루프 ============ */
function choose(i){
  const c=choices[i];if(!c)return;
  buf=[];fx={};choices=[];isMenu=false;pageTitle='';
  let fn=c.fn;
  if(c.imp){
    const p=Math.max(0,100-effCtl())/110;
    if(R()<p){
      buf.push(`<p class="imp">당신은 「${c.label.replace(/<[^>]+>/g,'')}」을(를) 택하려 했습니다. 하지만 ${S.alc>0?'술기운에 휩싸인 ':'스콧의 '}몸이 먼저 움직였습니다.</p>`);
      fn=c.imp;
    }
  }
  fn();
  after();
}
function after(){
  if(!S.ended)checks();
  flushFx();
  if(!S.ended&&choices.length===0)menu();
  render();
}
function checks(){
  if(choices.length)return;
  if(S.prison)return;
  if(S.missedRent>=2)return evictionEvent();
  if(S.rel.maria<=0&&!S.sep)return mariaLeavesEvent();
  if(S.st.ctl<=0)return lossOfControlEvent();
  if(S.day>=29&&S.job&&S.missedRent===0&&!S.flags.goodEnd){S.flags.goodEnd=1;return monthMilestone();}
  if(S.st.fat>=100){collapse();return;}
  if(S.st.str>=100){breakdown();return;}
  if(S.flags.famEvt&&!S.shift){const id=S.flags.famEvt;if(id==='birth'||(S.loc==='home'&&mariaHome())){S.flags.famEvt=null;return FAMEVT[id]();}}
  if(S.pendingLife&&!S.shift){
    const L=LIFE[S.pendingLife];
    if(!L){S.pendingLife=null;return;}
    if(!L.home||S.loc==='home'){S.pendingLife=null;L.run();return;}
  }
}
function menu(){
  isMenu=true;
  if(!buf.length)say(desc());
  LOC[S.loc]();
}
function hasUmbrella(){
  return (S.inv&&S.inv.umbrella>0)||(S.worn&&S.worn.handheld==='umbrella_blk')||(S.wardrobe&&S.wardrobe.includes('umbrella_blk'));
}
function weatherExposure(l){
  const outdoor=['street','westbrook','seabreeze','civic','park','beach','gas','alley'];
  if(!outdoor.includes(l))return;
  const w=S.weather;
  if(w==='비'||w==='폭풍우'){
    if(hasUmbrella()){
      if(S.worn.handheld!=='umbrella_blk'&&S.wardrobe.includes('umbrella_blk'))S.worn.handheld='umbrella_blk';
      sys(w==='폭풍우'?'강한 비바람이 몰아치지만 검은 우산을 단단히 쥐어 몸이 젖는 것을 막았습니다.':'우산 위로 빗방울이 톡톡 떨어집니다. 우산 덕분에 옷이 젖지 않았습니다.');
    }else{
      const strAdd=w==='폭풍우'?8:4;
      const fatAdd=w==='폭풍우'?5:2;
      st('str',strAdd);st('fat',fatAdd);
      say(w==='폭풍우'
        ?'<b>우산이 없어 폭풍우를 온몸으로 맞았습니다!</b> 차가운 빗물이 셔츠와 바지 속까지 스며들어 온몸이 젖어 듭니다. 불쾌한 한기에 신경이 날카로워집니다.'
        :'<b>우산이 없어 비를 그대로 맞았습니다.</b> 축축하게 젖은 옷이 몸에 들러붙어 찝찝하고 스트레스가 쌓입니다.');
      if(R()<0.35){st('cha',-1);note('빗물에 젖어 행색이 초라해졌습니다. (매력 -)');}
    }
  }else if(w==='맑음'&&hh()>=10&&hh()<=16&&R()<0.25){
    st('str',-1);
    sys('따스한 햇살이 얼굴을 비춥니다. 잠시나마 기분이 한결 가벼워집니다.');
  }
}
function go(l,min){
  pass(min||T_PLACE);S.loc=l;say(arrive(l));
  weatherExposure(l);
  if(S.st.tra>=50 && S.st.str>=55 && !S.daily.ptsd && R()<0.28){
    S.daily.ptsd=1;
    ptsdEpisode();
    return;
  }
  if((l==='street'||l==='westbrook'||l==='seabreeze'||l==='civic')&&R()<0.3)streetEncounter();
  else if(l==='beach'&&!S.met.tony&&hh()>=16&&hh()<23&&S.day>=2)meetTony();
}

/* ============ 정신질환 심화 이벤트 (플래시백·과각성·해리) ============ */
function ptsdEpisode(){
  const mode=pick(['flashback','hyper','dissoc']);
  if(mode==='flashback'){
    say('<b>갑자기 주변 소리가 멎습니다.</b> 지나가던 행인의 구두 소리가 어두운 골목의 발소리로 겹쳐 들리고, 깨진 맥주병의 날카로운 섬광이 왼쪽 눈구멍을 찌릅니다.');
    say('스콧은 벽에 등을 기댄 채 거칠게 숨을 몰아쉽니다. 심장이 갈비뼈를 부술 듯 두드립니다.');
    opt('벽을 짚고 호흡을 가다듬는다 (5-4-3-2-1 감각 집중)',()=>{
      pass(20);st('str',-4);st('tra',-1);st('ctl',2);
      say('발바닥이 닿은 아스팔트의 감각, 차가운 공기 냄새에 억지로 집중합니다. 몇 분 뒤, 현실의 소음이 천천히 돌아옵니다.');
    });
    opt('공황 속에서 아무 골목으로 뛰쳐나간다',()=>{
      pass(25);st('fat',10);st('str',8);st('tra',2);st('ctl',-3);
      say('누군가 뒤에서 쫓아온다는 착각에 휩싸여 무작정 달립니다. 막다른 골목에서 무릎을 꿇고 나서야 아무도 없음을 깨닫습니다.');
    },{cls:'risk'});
  }else if(mode==='hyper'){
    say('<b>과각성 상태.</b> 사각지대인 왼쪽 방향에서 누군가 스쳐 지나가는 순간, 온몸의 근육이 돌처럼 굳습니다. 스콧의 손이 저도 모르게 주먹을 쥐고 상대를 노려봅니다.');
    opt('시선을 내리고 주먹을 편다',()=>{
      pass(10);st('str',4);st('ctl',1);
      say('한나 박사의 말을 떠올리며 억지로 손가락을 폅니다. 상대는 영문도 모른 채 발걸음을 재촉합니다.');
    },{imp:()=>{
      st('str',8);st('ctl',-4);S.heat+=2;
      say('“뭘 꼬라봐?!” 목에서 거친 고함이 튀어나옵니다. 주변 사람들이 놀라 걸음을 멈춥니다.');
    }});
  }else{
    say('<b>해리 증상.</b> 발밑의 땅이 물렁하게 꺼지는 기분이 듭니다. 유리벽 너머에서 남의 몸을 조종하는 것처럼 손끝에 감각이 없습니다.');
    pass(30);st('str',5);st('tra',1);
    say('30분이나 그 자리에 멍하니 서 있었다는 걸 시계를 보고서야 알아차립니다.');
  }
}

function homeFurnitureDesc(){
  if(!S.furniture||!S.furniture.length)return '';
  const lines=[];
  if(S.furniture.includes('sofa'))lines.push('거실 한쪽에는 새로 들인 패브릭 2인용 소파가 놓여 있어 예전보다 아늑합니다.');
  if(S.furniture.includes('table'))lines.push('부엌 옆에는 4인용 원목 식탁 세트가 단정하게 자리 잡고 있습니다.');
  if(S.furniture.includes('bookshelf'))lines.push('벽면의 원목 책장에는 에밀리의 그림책과 당신의 정비 교본이 가지런히 꽂혀 있습니다.');
  if(S.furniture.includes('lamp'))lines.push('원목 플로어 스탠드가 집 안 구석을 따뜻한 불빛으로 비춥니다.');
  if(S.furniture.includes('bunk'))lines.push('작은 방에는 에밀리 전용 별빛 침대가 놓여 있습니다.');

}
function weatherAtmosphere(){
  const w=S.weather;
  if(w==='맑음')return `창밖은 맑게 개어 있고 바깥 온도계는 ${S.temp}°C를 가리킵니다.`;
  if(w==='흐림')return `잿빛 구름이 낮게 깔려 있으며 기온은 ${S.temp}°C입니다.`;
  if(w==='비')return `유리창을 타고 빗줄기가 흘러내립니다. 기온은 ${S.temp}°C입니다.${hasUmbrella()?'':' (우산이 없어 외출하면 옷이 젖을 것입니다.)'}`;
  return `세찬 비바람이 창문을 흔드는 폭풍우 날씨입니다. 기온은 ${S.temp}°C입니다.${hasUmbrella()?'':' (우산 없이 나가면 온몸이 흠뻑 젖을 것입니다!)'}`;
}
function desc(){
  const h=hh(),w=S.weather;
  switch(S.loc){
    case 'home': {
      const HS=HOUSES[S.house];
      const base=h<6||h>=22?HS.night:(mariaHome()?HS.day+' 마리아가 부엌에서 무언가를 하고 있습니다.':HS.day);

    }
    case 'school': return hh()>=8&&hh()<15&&!weekend()?'붉은 벽돌 교사 너머로 아이들의 합창 소리가 들립니다. 운동장 옆 단층 건물이 부속 유치원입니다.':'한산한 학교 정문. 운동장 옆 부속 유치원 창문에 아이들 그림이 붙어 있습니다.';

/* ============ 가족: 선택 가능한 인물 (마리아 · 에밀리) ============ */
function famWhere(k){
  if(isKid(k))return kidWhere(k);
  const h=hh(),atHome=S.loc==='home';
  if(k==='maria'){
    if(mariaHome())return {state:'home',here:atHome,txt:'집에 있음'};
    if(h>=23||h<6)return {state:'asleep',here:atHome,txt:'침실에서 잠들어 있음'};
    return {state:'away',here:false,txt:'식당 「루비스 다이너」에서 근무 중'};
  }
  if(emilyHome())return {state:'home',here:atHome,txt:'집에 있음'};
  if(S.daily.emilyBed||h>=21||h<7)return {state:'asleep',here:atHome,txt:'자기 방에서 잠들어 있음'};
  if(!weekend()&&h>=15&&h<18)return {state:'away',here:false,txt:'유치원에서 하원 대기 중 (15:00~18:00)'};
  return {state:'away',here:false,txt:'학교 부속 유치원 해바라기반에 있음'};
}
function famMood(k){
  if(isKid(k))return kidMood(k);
  const r=S.rel[k];
  if(k==='maria'){
    if(S.daily.fought)return '화가 나 있음';
    if(S.alc>0)return '실망한 기색';
    if(S.preg&&S.preg.told)return pregMonth()<=3?'입덧 중':'배를 감싸 쥠';
    if(mPeriod())return '예민함 (생리 중)';
    return r>=80?'애정 어림':r>=60?'다정함':r>=40?'무난함':r>=20?'지쳐 있음':'냉랭함';
  }
  if(S.daily.snapped)return '겁먹음';
  return r>=85?'아빠 바라기':r>=65?'신남':r>=45?'얌전함':r>=25?'눈치를 봄':'아빠를 피함';
}
function familyCardsHtml(){
  const card=k=>{
    const F=FAMILY[k],w=famWhere(k),r=S.rel[k],i=ia(F.short,()=>charPage(k));
    return `<div class="fam-card${w.state==='away'?' away':''}" data-ch="${i}" role="button"><div class="fam-top"><b>${F.short}</b><span class="fam-role">${F.role} · ${famAge(F)}</span></div><span class="fam-where ${w.state==='home'?'wd-ok':'wd-dim'}">${w.txt}</span><div class="dol-bar"><i style="width:${r}%;background:${F.color}"></i></div><span class="fam-mood">호감 ${r} · ${famMood(k)}</span></div>`;
  };
  return `<div class="wd fam-box"><p class="wd-sec"><span class="wd-title">가족</span> <i class="wd-cnt">인물을 선택해 상호작용하세요</i></p><div class="fam-cards">${card('maria')}${card('emily')}${kidKeys().map(card).join('')}</div></div>`;
}
/* 상호작용 실행 후 같은 인물 화면으로 돌아오기 (선택지가 생기면 그대로 보여줌) */

    if(w.state==='away')return '마리아는 지금 식당에서 일하고 있습니다. 휴대폰으로 연락할 수 있습니다.';
    if(w.state==='asleep')return '마리아가 침실에서 고르게 숨을 쉬며 잠들어 있습니다.';

    return `마리아가 ${h<12?'부엌 식탁에서 커피를 마시고':h<18?'거실에서 빨래를 개고':'부엌에서 설거지를 하고'} 있습니다. 당신이 다가가자 ${r>=50?'옅게 웃으며 ':''}고개를 듭니다.`;

  if(w.state==='asleep')return '에밀리가 버니를 끌어안은 채 새근새근 잠들어 있습니다.';
  if(S.daily.snapped||r<30)return '에밀리가 방문 뒤에서 버니를 안고 조심스럽게 당신을 살핍니다.';

}
function mariaActs(w){
  const d=S.daily,h=hh(),A=[],r=S.rel.maria;

function charPage(k,msg){

  const acts=isKid(k)?kidActs(k,w):k==='maria'?mariaActs(w):emilyActs(w);
  if(!acts.length)H.push(`<p class="wd-dim">${k==='emily'?'지금은 에밀리와 함께할 수 있는 일이 없습니다. 평일 오후 학교 부속 유치원으로 데리러 가 보세요.':(isKid(k)?'지금은 아기와 함께할 수 있는 일이 없습니다.':'지금은 마리아와 함께할 수 있는 일이 없습니다.')}</p>`);

      const label=a.label+(a.min?` ${fmtDur(a.min).trim()}`:'');
      if(a.done)return `<span class="wd-na">${a.label} (오늘 완료)</span>`;
      if(a.na)return `<span class="wd-na">${a.label} (${a.na})</span>`;
      return lk(label,famAct(k,a.fn),{imp:a.imp?famAct(k,a.imp):null,cls:a.cls});
    });
    H.push(`<p class="wd-sec"><span class="wd-title">${g}</span></p><p class="wd-links">${items.join(SEP)}${SEP}</p>`);
  });
  H.push('</div>');
  buf.push(H.join(''));
}

/* ============ 가족 확장: 마리아의 주기 · 피임 · 임신 · 출산 · 육아 (에밀리의 동생들) ============ */
/* 이야기 속 시간은 압축되어 있습니다: 임신 기간 30일(=10개월), 아기 나이 3일 = 1개월 */
const CYC_LEN=28, PREG_DAYS=30, DAYS_PER_MONTH=3, PP_DAYS=14, MAX_KIDS=4, BIRTH_COST=320, CONDOM_PROTECT=0.12;
const KID_NAMES={M:['마테오','헨리','올리버','레오','잭','노아','루카스'],F:['소피아','릴리','그레이스','미아','클로이','이사벨','엘라']};
const hasJong=t=>{const c=String(t).charCodeAt(String(t).length-1)-0xAC00;return c>=0&&c<11172&&c%28!==0;};
const J=(t,a,b)=>t+(hasJong(t)?a:b);
const kids=()=>S.kids||(S.kids=[]);
const isKid=k=>kids().some(x=>x.key===k);
const kidOf=k=>kids().find(x=>x.key===k);
const kidDays=x=>S.day-x.born;
const kidMonths=x=>Math.floor(kidDays(x)/DAYS_PER_MONTH);
function kidAgeTxt(x){const m=kidMonths(x);return m<1?`신생아 ${kidDays(x)+1}일째`:m<24?`${m}개월`:`${Math.floor(m/12)}세`;}
function famAge(F){return F.ageTxt?F.ageTxt():F.age+'세';}
function kidStage(x){const m=kidMonths(x);return m<3?'newborn':m<12?'infant':m<24?'toddler':'child';}
function syncKids(){
  kids().forEach(x=>{
    if(!FAMILY[x.key]||FAMILY[x.key]._n!==x.name){
      const sx=x.sex==='M';
      FAMILY[x.key]={_n:x.name,short:x.name,name:x.name+' 카터',role:sx?'아들':'딸',color:sx?'#6ec1e0':'#f0a0b8',ageTxt:()=>kidAgeTxt(x),
        job:'카터 가족의 새 식구 · 에밀리의 동생',
        likes:'아빠의 낮은 목소리, 따뜻한 우유, 에밀리 누나의 버니 인형, 딸랑이 소리',
        dislikes:'젖은 기저귀, 큰 소리, 낯선 사람, 배고픈 시간',
        bio:`${x.name}. 에밀리의 ${sx?'남동생':'여동생'}으로 태어났다. 아직 말은 못 하지만 아빠의 해적 눈을 보면 꼭 웃는다.`};
    }
    NPC[x.key]={n:`${x.name} (${x.sex==='M'?'아들':'딸'})`,sn:x.name,d:`에밀리의 ${x.sex==='M'?'남동생':'여동생'}. 카터 가족의 새 식구.`};
    if(S.rel[x.key]==null)S.rel[x.key]=40;
    S.met[x.key]=1;
  });
}
function kidKeys(){syncKids();return kids().map(x=>x.key);}

/* ----- 마리아의 주기 ----- */
function mLeave(){const p=S.preg;return !!((p&&p.told&&p.due-S.day<=3)||(S.flags.ppUntil&&S.day<S.flags.ppUntil));}
function payMult(){const p=S.preg;return ((p&&p.told&&p.due-S.day<=8)||(S.flags.ppUntil&&S.day<S.flags.ppUntil+7))?0.5:1;}
function mCyc(){
  const f=S.flags;
  if(S.preg)return {ph:'preg',cd:0,chance:0,label:'임신 중'};
  if(f.ppUntil&&S.day<f.ppUntil)return {ph:'pp',cd:0,chance:0,label:'산후 회복 중'};
  if(f.cycOff==null)f.cycOff=Math.floor(R()*CYC_LEN);
  const cd=((S.day-1+f.cycOff)%CYC_LEN)+1;
  let ph,chance,label;
  if(cd<=5){ph='menses';chance=0;label=`생리 중 (${cd}일째)`;}
  else if(cd<=9){ph='low';chance=0.03;label='임신 가능성 낮음';}
  else if(cd<=11){ph='rise';chance=0.10;label='배란기 접근 · 가능성 보통';}
  else if(cd<=13){ph='fertile';chance=0.22;label='가임기 · 가능성 높음';}
  else if(cd===14){ph='ovul';chance=0.38;label='배란일 · 가능성 매우 높음';}
  else if(cd<=16){ph='fertile';chance=0.22;label='가임기 · 가능성 높음';}
  else if(cd===17){ph='rise';chance=0.08;label='배란기 끝 · 가능성 보통';}
  else{ph='low';chance=0.02;label='임신 가능성 낮음';}
  return {ph,cd,chance,label};
}
const mPeriod=()=>mCyc().ph==='menses';
function pregMonth(){const p=S.preg;if(!p)return 0;return Math.min(10,Math.floor((S.day-p.conceived)/3)+1);}
function famMariaInfo(){
  const c=mCyc(),p=S.preg;
  if(p){
    const left=Math.max(0,p.due-S.day);
    return `<p class="wd-lbl">임신 <span class="wd-num">${pregMonth()}개월</span> · ${p.told?`출산 예정일까지 ${left}일`:'아직 확인 전'}${p.checks?` · 산전 검진 ${p.checks}회`:''}</p>`;
  }
  if(c.ph==='pp')return `<p class="wd-lbl">산후 회복 중 · ${S.flags.ppUntil-S.day}일 더 쉬어야 합니다</p>`;
  const risk=c.chance>0?`무방비 시 약 ${Math.round(c.chance*100)}% · 피임기구 사용 시 약 ${Math.max(1,Math.round(c.chance*CONDOM_PROTECT*100))}%`:'임신 가능성 거의 없음';
  return `<p class="wd-lbl">주기: <span class="wd-num">${c.label}</span></p><p class="wd-dim">냉장고 달력에 마리아가 표시해 둔 날짜를 보고 알 수 있습니다. (${risk})</p>`;
}
function famKidsRow(){
  const ks=kids(),p=S.preg;let t=[];
  if(p)t.push(`마리아 임신 ${pregMonth()}개월${p.told?'':' (아직 모름)'}`);
  if(ks.length)t.push(ks.map(x=>`${x.name} ${kidAgeTxt(x)}`).join(' · '));
  return t.length?`<tr><td>동생들</td><td>${t.join(' / ')}</td></tr>`:'';
}

/* ----- 둘만의 밤: 피임기구 선택 ----- */
function famNightAct(add,h,r,d){
  if(!(h>=21&&h<23&&r>=30))return;
  const c=mCyc();
  if(c.ph==='pp'){add('애정','둘만의 밤을 보낸다',{na:'산후 회복 중'});return;}
  add('애정','둘만의 밤을 보낸다',{done:d.nightTogether,min:180,fn:nightStart});
}
function nightStart(){
  const d=S.daily,c=mCyc();
  if(S.drank||S.alc>0){
    d.nightTogether=1;pass(180,{sleep:true,rest:8});
    rel('maria',-4);st('str',3);say('마리아는 술 냄새를 느끼고 조용히 고개를 젓습니다. “오늘은 그냥 자자, 스콧.” 당신은 같은 침대에 누웠지만 한동안 잠들지 못합니다.');return;
  }
  if(c.ph==='menses'){
    d.nightTogether=1;pass(15);rel('maria',-1);st('str',3);
    say(pick([
      '당신이 어깨에 손을 올리자 마리아가 몸을 틀어 손을 밀어냅니다. “…오늘은 건드리지 마. 배 아파 죽겠어.” 그녀는 이불을 끌어당겨 등을 돌립니다. 당신은 한숨을 삼키고 불을 끕니다.',
      '“스콧, 오늘 그런 날 아니야.” 마리아가 날카롭게 말하며 당신의 손을 뿌리칩니다. 곧 미안한 듯 덧붙입니다. “…짜증 내려던 건 아니야. 그냥 오늘은 혼자 있고 싶어.” 당신은 말없이 침대 끝에 눕습니다.'
    ]));
    note('생리 중에는 마리아가 스콧을 밀어냅니다. 따뜻한 차를 챙겨 주는 쪽이 훨씬 환영받습니다.');return;
  }
  if(c.ph==='preg'){
    nightFinish(false,c);return;
  }
  const have=S.inv.condom||0;
  say(pick([
    '에밀리가 잠든 뒤, 마리아가 당신 옆에 앉습니다. 오래된 농담과 처음 만났던 날의 이야기 끝에 조심스러운 입맞춤이 이어집니다.',
    '마리아가 먼저 당신의 손을 잡습니다. “요즘 우리, 이렇게 앉아 있는 시간도 없었지.” 말없이 어깨를 기대온 그녀를 당신은 꼭 안아줍니다.'
  ]));
  if(c.ph==='ovul')say('마리아가 서랍 위 달력을 힐끗 봅니다. 오늘 날짜에 동그라미가 쳐져 있습니다. “…오늘, 그날이야.”');
  else if(c.ph==='fertile')say('마리아가 달력을 힐끗 보고 작게 중얼거립니다. “요즘 좀 위험한 시기긴 한데…”');
  say(have>0?`협탁 서랍에는 피임기구가 ${have}개 남아 있습니다.`:'협탁 서랍을 뒤져 보지만 피임기구가 없습니다.');
  if(have>0)opt('피임기구를 사용한다',famAct('maria',()=>nightDo(true,c)));
  opt('피임기구 없이 밤을 보낸다',famAct('maria',()=>nightDo(false,c)));
  opt('오늘은 이야기만 나누고 잔다',famAct('maria',()=>{
    S.daily.nightTogether=1;pass(120,{sleep:true,rest:10});rel('maria',3);st('str',-4);
    say('“그래, 그것도 좋아.” 마리아가 웃으며 당신의 팔을 베고 눕습니다. 두 사람은 천장을 보며 한참 이야기를 나누다 잠이 듭니다.');
  }));
}
function nightDo(protect,c){
  if(protect)S.inv.condom=Math.max(0,(S.inv.condom||0)-1);
  nightFinish(protect,c);
}
function nightFinish(protect,c){
  const preg=c.ph==='preg';
  S.daily.nightTogether=1;
  pass(180,{sleep:true,rest:8});
  rel('maria',8);st('str',-8);st('tra',-1);
  if(preg){
    say(pick([
      '마리아가 부른 배를 감싸 쥔 채 당신 품에 기댑니다. “조심조심, 알지?” 두 사람은 조용히 서로의 체온을 나누며 밤을 보냅니다.',
      '불을 끄고 나란히 누워 있다가, 마리아가 당신의 손을 자기 배 위에 올립니다. 안에서 작은 발길질이 느껴집니다. 두 사람은 소리 죽여 웃습니다.'
    ]));
    return;
  }
  say(pick([
    '촛불처럼 낮은 스탠드 불빛 아래, 두 사람은 오랜만에 서로에게만 집중합니다. 방문 너머 에밀리의 고른 숨소리가 들립니다. 밤이 천천히 깊어집니다.',
    '서로의 이름을 부르는 낮은 목소리, 이불 속에서 겹쳐지는 체온. 오랜만에 두 사람은 아무 걱정도 하지 않고 밤을 보냅니다.'
  ]));
  if(protect)say('모든 것이 끝난 뒤 마리아가 당신의 가슴에 귀를 댑니다. “…챙겨 줘서 고마워. 지금은 그게 마음이 편해.”');
  else if(c.chance>=0.2)say('마리아가 천장을 보며 작게 속삭입니다. “오늘은 좀 위험한 날이었는데… 뭐, 어떻게든 되겠지?” 당신은 대답 대신 그녀의 손을 꼭 잡습니다.');
  if(kids().length>=MAX_KIDS)return;
  const p=c.chance*(protect?CONDOM_PROTECT:1);
  if(p>0&&R()<p){
    S.preg={conceived:S.day,due:S.day+PREG_DAYS,told:0,checks:0,emily:0,lastCheck:-99};
    S.flags.cycOff=null;
  }
}

    add('돌봄','입맛 당기는 간식을 사 온다 ($6)',{done:d.mSnack,min:15,fn:()=>{if(!pay(6))return;d.mSnack=1;pass(15);rel('maria',4);st('str',-1);

    say(`에밀리가 버니를 ${ks[ks.length-1].name}의 손에 쥐여 주고 가운데에 앉습니다. 휴대폰 타이머가 깜빡이는 동안 마리아가 당신의 어깨에 머리를 기댑니다. 사진 속 식구는 이제 ${3+ks.length}명입니다.`);note('냉장고 문의 가족사진이 한 장 더 늘었습니다.');}});
}

function kidWhere(k){
  const x=kidOf(k),h=hh(),atHome=S.loc==='home';
  if(S.sep||S.flags.famAtLucia)return {state:'away',here:false,txt:'마리아와 함께 있음'};
  if(h>=21||h<6)return {state:'asleep',here:atHome,txt:'아기 침대에서 잠들어 있음'};
  if(mariaWorking()&&!mLeave())return {state:'away',here:false,txt:'로사 아주머니 댁에서 돌봄 중 (평일 17:00 이후 귀가)'};
  return {state:'home',here:atHome,txt:'집에 있음'};
}
function kidMood(k){

let reState={filter:'all'};
function houseFeatures(H){
  const f=[`수면 회복 ${REST_N[H.rest]||'보통'}`];
  if(H.str>0)f.push('매일 스트레스 소폭 증가');
  if(H.str<0)f.push(`매일 스트레스 감소 (${-H.str})`);
  if(H.relM)f.push('마리아 호감 점진 상승');
  if(H.relE)f.push('에밀리 호감 점진 상승');
  if(H.damp)f.push('습기·곰팡이');
  if(H.garden)f.push('공용 정원');
  if(H.yard)f.push('마당·차고 작업대');
  if(H.view)f.push('바다 전망 발코니·피트니스 센터');
  if(H.safe)f.push('24시간 보안 (빈집털이 없음)');
  return f.join(' · ');
}
function moveCalc(id,mode){
  const cur=HOUSES[S.house],H=HOUSES[id];
  const refund=S.houseOwned?0:Math.max(0,(S.deposit||0)-(S.flags.rentExtra||0));
  const sale=S.houseOwned?Math.round((cur.buy||0)*0.85):0;
  const cost=(mode==='buy'?H.buy:H.deposit)+MOVE_FEE;
  return {refund,sale,cost,net:cost-refund-sale};
}
function realtyPage(msg){
  pageTitle=PL.realty.n;
  let n=0;const N=t=>`(${++n}) ${t}`;
  const cur=HOUSES[S.house];
  const H=['<div class="wd">'];
  H.push(`<p>벽면 코르크 보드에 매물 사진이 빼곡히 꽂혀 있습니다. 중개인 <b>데니스</b>가 안경을 고쳐 쓰며 고개를 듭니다. “이사 생각 있으세요?”</p><p class="wd-links">${lk(N('중개소를 나온다'),()=>{say('중개소 문을 닫고 거리로 나옵니다.');})}</p>`);
  H.push(`<p class="wd-dim">현재 거주지: ${cur.n} (${S.houseOwned?'자가':'임대'}) · 매주 ${S.houseOwned?'관리비·재산세':'집세'} $${S.rent}${S.houseOwned?'':` · 맡긴 보증금 $${S.deposit||0}`} · 현금 $${S.money}</p>`);
  H.push('<hr class="wd-hr">');
  if(msg)H.push(`<div class="wd-msgbox">${msg}</div>`);
  H.push(fxInline());
  H.push(`<p class="wd-sec"><span class="wd-title">매물 목록</span> <i class="wd-cnt">${HOUSE_ORDER.length}건</i></p>`);
  H.push(`<p class="wd-radios">${[['all','전체'],['rent','임대 가능'],['buy','매매 가능']].map(([f,t])=>rd(t,reState.filter===f,()=>{reState.filter=f;realtyPage();})).join(SEP)}</p>`);
  H.push(`<p class="wd-dim">이사 비용(이삿짐 트럭) $${MOVE_FEE} · 이사에 4시간이 걸립니다. 임대 중인 집의 보증금은 이사 때 돌려받고, 소유한 집은 매입가의 85%에 되팝니다.</p>`);
  HOUSE_ORDER.filter(id=>reState.filter==='buy'?!!HOUSES[id].buy:true).forEach(id=>{
    const Hh=HOUSES[id],here=S.house===id;
    const badge=here?(S.houseOwned?'소유 중':'현재 거주 중'):Hh.buy?'임대·매매':'임대';
    let acts;
    if(here)acts='<span class="wd-dim">지금 살고 있는 집입니다.</span>';
    else{
      const L=[lk('집을 보러 간다 (1:00)',()=>{pass(60);realtyPage(`<p>${Hh.tour}</p>`);})];
      L.push(lk(`임대 계약 (보증금 $${Hh.deposit})`,()=>moveConfirm(id,'rent')));
      if(Hh.buy)L.push(lk(`매입 ($${Hh.buy.toLocaleString()})`,()=>moveConfirm(id,'buy')));
      acts=L.join(SEP);
    }
    H.push(`<div class="wd-item wd-static${here?' worn':''}"><div class="wd-item-info"><b>${Hh.n} <em class="lp-badge ${here?'ok':''}">${badge}</em></b>
      <span>${Hh.area} · 임대: 주당 $${Hh.rent} · 보증금 $${Hh.deposit}${Hh.buy?` · 매매가 $${Hh.buy.toLocaleString()} (소유 시 주당 관리비·재산세 $${Hh.upkeep})`:''}</span>
      <span>${houseFeatures(Hh)}</span><span class="wd-desc">${Hh.desc}</span><p class="wd-links">${acts}</p></div></div>`);
  });
  H.push('</div>');
  buf.push(H.join(''));
}
function moveConfirm(id,mode){
  const Hh=HOUSES[id],c=moveCalc(id,mode);
  pageTitle=PL.realty.n+' · 계약';
  const H=['<div class="wd">'];
  H.push(`<p>데니스가 계약서 두 장을 책상 위에 펼칩니다. “<b>${Hh.n}</b>, ${mode==='buy'?'매매':'임대'} 계약입니다.”</p>`);
  H.push('<hr class="wd-hr">');
  H.push(`<p class="wd-sec"><span class="wd-title">비용 내역</span></p><p>${mode==='buy'?`매입가 $${Hh.buy.toLocaleString()}`:`보증금 $${Hh.deposit}`} + 이사 비용 $${MOVE_FEE}${c.refund?`<br>현재 집 보증금 환급 −$${c.refund}`:''}${c.sale?`<br>현재 집 매각 대금 −$${c.sale.toLocaleString()}`:''}<br><b>실제 필요한 현금: ${c.net>=0?'$'+c.net.toLocaleString():`없음 ($${(-c.net).toLocaleString()} 환급)`}</b></p>`);
  H.push(`<p>이사 후 매주 월요일 ${mode==='buy'?`관리비·재산세 $${Hh.upkeep}`:`집세 $${Hh.rent}`}가 빠져나갑니다.</p>`);
  const block=S.missedRent>0?'밀린 주거비가 있어 신용 조회를 통과하지 못했습니다. 먼저 미납금을 정리해야 합니다.':S.money<c.net?`현금이 $${(c.net-S.money).toLocaleString()} 부족합니다.`:'';
  const tierDiff=Hh.tier-HOUSES[S.house].tier;
  if(tierDiff<0)H.push('<p class="wd-hot">지금보다 형편없는 집입니다. 마리아와 에밀리가 실망할 것입니다.</p>');
  if(id==='penthouse'&&!S.job&&S.gangRank===0)H.push('<p class="wd-hot">직업 없이 펜트하우스에 들어가면 사람들의 시선이 곱지 않을 것입니다.</p>');
  if(block)H.push(`<p class="wd-hot">${block}</p>`);
  const L=[];
  if(!block)L.push(lk('계약서에 서명하고 이사한다 (4:00)',()=>doMove(id,mode)));
  L.push(lk('다시 생각한다',()=>realtyPage()));
  H.push(`<p class="wd-links">${L.join(SEP)}</p>`);
  H.push('</div>');
  buf.push(H.join(''));
}
function doMove(id,mode){
  const c=moveCalc(id,mode),oldT=HOUSES[S.house].tier,Hh=HOUSES[id];
  cash(-c.net);
  S.house=id;S.houseOwned=mode==='buy';S.deposit=mode==='rent'?Hh.deposit:0;
  S.rent=S.houseOwned?Hh.upkeep:Hh.rent;S.flags.rentExtra=0;
  pass(240);S.loc='home';
  const diff=Hh.tier-oldT;
  if(diff>0){rel('maria',4+diff*3);rel('emily',2+diff*2);st('str',-4*diff);}
  else if(diff<0){rel('maria',diff*5);rel('emily',diff*2);st('str',-diff*4);}
  if(id==='penthouse'&&!S.job&&S.gangRank===0)S.heat+=8;
  say('빌린 트럭에 상자와 가구를 싣습니다. 에밀리는 버니를 꼭 안고 조수석에 앉아 “새집! 새집!” 하고 노래를 부릅니다.');
  say(diff>0?`<b>${Hh.n}</b>. 마리아가 빈 거실 한가운데 서서 천천히 한 바퀴 돕니다. “우리… 정말 여기 사는 거야?” 그녀의 목소리가 떨립니다.`:diff<0?`<b>${Hh.n}</b>. 마리아가 축축한 벽을 말없이 바라봅니다. “…당분간이지, 스콧?” 에밀리가 엄마 다리 뒤에 숨습니다.`:`<b>${Hh.n}</b>. 새 열쇠가 손바닥 위에서 차갑게 반짝입니다.`);
  if(S.furniture.length)say('사 두었던 가구들도 새집에 하나씩 자리를 잡습니다.');
  note(`이사 완료: ${Hh.n} · ${S.houseOwned?'자가':'임대'} · 매주 월요일 ${S.houseOwned?'관리비·재산세':'집세'} $${S.rent}`);
}

LOC.prison=()=>{
  const P=S.prison;
  if(!P){S.loc='street';menu();return;}
  const h=hh(),d=S.daily;
  say(`교도소 일과 시간입니다. 남은 복역 일수: <b>${P.daysLeft}일</b> (총 ${P.totalDays}일 형기 · 혐의: ${P.reason}) · 탈옥 준비도: <b>${P.escapePrep}%</b>`);

  if(h>=7&&h<21&&!d.pWork)opt('교도소 세탁실·작업장 노역에 참여한다 (4시간, +$12)',()=>{
    d.pWork=1;pass(240,{work:true});cash(12);
    atUp('strg',2);atUp('dex',2);
    if(R()<0.45){
      P.escapePrep=clamp(P.escapePrep+12);
      say('작업장 구석에서 녹슨 철사 조각과 낡은 드라이버 끝부분을 몰래 챙겨 수감복 안쪽에 숨겼습니다.');
      note('탈옥 준비도 +12%');
    }else{
      say('증기가 자욱한 세탁실에서 무거운 빨래 자루를 나르며 시간을 보냅니다.');
    }
  });

  if(h>=8&&h<19&&!d.pYard)opt('야외 운동장에서 턱걸이와 달리기로 몸을 단련한다 (2시간)',()=>{
    d.pYard=1;pass(120);st('fat',14);st('str',-6);
    atUp('strg',4);atUp('stam',4);
    say('철조망 아래 운동장에서 땀이 비 오듯 쏟아질 때까지 근력과 지구력을 단련합니다. 다른 수감자들도 함부로 건드리지 못합니다.');
    note('근력과 지구력이 향상되었습니다.');
  });

  if(h>=9&&h<20&&!d.pScout)opt('간수들의 교대 시간과 환풍구·배수로 구조를 살핀다 (2시간)',()=>{
    d.pScout=1;pass(120);skUp('street',2);atUp('calm',2);
    P.escapePrep=clamp(P.escapePrep+18);
    say('야간 순찰 간수가 복도 끝을 도는 데 걸리는 시간과 세탁실 뒤편 배수로 철창의 부식 상태를 머릿속에 정확히 그려 넣습니다.');
    note('탈옥 준비도 +18%');
  });

  if(h>=10&&h<18&&!d.pBrawl)opt('시비를 걸어오는 수감자와 맞붙는다',()=>{
    d.pBrawl=1;pass(45);
    const winProb=35+(S.attrs.strg*0.45)+(S.attrs.stam*0.2);
    if(R()*100<winProb){
      st('str',-8);atUp('strg',2);P.escapePrep=clamp(P.escapePrep+8);
      say('상대의 주먹을 피하고 묵직한 정타를 꽂아 넣습니다. 쓰러진 수감자의 주머니에서 담배와 철사 묶음을 챙깁니다.');
      note('싸움에서 승리했습니다. (탈옥 준비도 +8%)');
    }else{
      injure(1,'광대뼈');st('fat',20);st('str',12);P.daysLeft+=1;
      say('난투 끝에 간수들의 진압봉에 얻어맞고 독방에 갇혔습니다. 징벌로 형기가 1일 추가되었습니다.');
    }
  },{cls:'risk'});

  if(!d.pEscapeTry)opt(`탈옥을 시도한다 (성공 예상률 ${calcEscapeChance()}%)`,()=>{
    d.pEscapeTry=1;pass(90);
    const chance=calcEscapeChance();
    if(R()*100<chance){
      const reason=P.reason;
      S.prison=null;S.loc='seabreeze';S.heat=clamp(S.heat+45);st('str',12);st('tra',2);
      say('<b>탈옥 성공!</b> 자물쇠를 따고 배수로 철창을 뜯어낸 뒤, 차가운 밤바다 안개를 뚫고 시브리즈 블러바드 해안가로 빠져나왔습니다! 이제 경찰의 추적을 각오해야 합니다.');
      note(`탈옥에 성공했습니다! (${reason} 잔여 형기 도주 · 수배도 급상승)`);
    }else{
      P.daysLeft+=3;P.escapePrep=Math.max(0,P.escapePrep-35);
      st('str',18);st('fat',20);st('tra',3);injure(2,'발목');
      say('<b>경보음이 울립니다!</b> 담장을 넘기 직전 탐조등이 당신을 비추고 진압대가 들이닥칩니다. 독방 징벌과 함께 형기가 3일 추가되었습니다.');
    }
  },{cls:'risk'});

  opt('감방 침대에 누워 시간을 보낸다 (4시간)',()=>doSleep(240));
  if(h>=21||h<5)opt('소등 후 잠자리에 든다',sleepNight);
};

function calcEscapeChance(){
  const prep=S.prison?.escapePrep||0;
  const statBonus=(S.attrs.strg*0.18)+(S.attrs.stam*0.15)+(S.attrs.dex*0.25)+(S.attrs.calm*0.18)+(S.skills.street*0.15);
  return Math.max(8,Math.min(88,Math.round(10+prep*0.45+statBonus-(S.st.fat*0.2))));
}

/* ----- 의류 매장 (참고 이미지 디자인: 탭 · 검색 · 가격표 카드) ----- */
let csState={tab:'all',q:'',per:12,page:0,sel:null,showOpt:false,showFlt:false,sort:'name',inv:false,hideOwned:false,afford:false,desc:false};
const CS_TABS=[
  [['all','전체'],['upper','상의'],['lower','하의'],['underUpper','속옷 상'],['underLower','속옷 하']],
  [['head','머리'],['face','얼굴'],['neck','목'],['hands','손'],['handheld','소지품'],['legs','다리'],['feet','신발']]
];
const CS_SORT={name:'이름',price:'가격',warmth:'보온',cha:'매력',integ:'내구도'};
const CS_PER=[6,12,24];
const slotName=k=>(CLOTH_SLOTS.find(x=>x.k===k)||{}).n||'';
function csDotRow(lbl,v,col){
  let h=`<div class="cs-dots"><span>${lbl}</span>`;
  for(let i=0;i<7;i++)h+=i<v?`<i style="background:${col};border-color:${col}"></i>`:'<i></i>';
  return h+'</div>';
}
function csRows(it){
  const iv=Math.max(0,Math.min(7,Math.round(it.integ/100*7)));
  const cv=Math.max(0,Math.min(7,it.cha+1));
  const wv=Math.max(0,Math.min(7,Math.round(it.warmth/9*7)));
  const ic=iv>=6?'#5f86c9':'#4d6ee8';
  const cc=cv>=5?'#9b4fd6':cv>=3?'#4d6ee8':'#5f86c9';
  const wc=wv>=5?'#e6e04a':wv>=3?'#a8dcc0':'#7fd1c8';
  return csDotRow('내.',iv,ic)+csDotRow('매.',cv,cc)+csDotRow('보.',wv,wc);
}
function csMatch(it,q){return !q||it.n.includes(q)||it.col.includes(q)||slotName(it.slot).includes(q);}
function csList(){
  let L=CLOTH_SHOP.map(e=>({e,it:clothOf(e.id)})).filter(x=>x.it);
  if(csState.tab!=='all')L=L.filter(x=>x.it.slot===csState.tab);
  if(csState.q)L=L.filter(x=>csMatch(x.it,csState.q));
  if(csState.hideOwned)L=L.filter(x=>!S.wardrobe.includes(x.e.id));
  if(csState.afford)L=L.filter(x=>x.e.p<=S.money);
  const o=csState.sort;
  L.sort((a,b)=>{
    const c=o==='price'?a.e.p-b.e.p:o==='warmth'?a.it.warmth-b.it.warmth:o==='cha'?a.it.cha-b.it.cha:o==='integ'?a.it.integ-b.it.integ:a.it.n.localeCompare(b.it.n,'ko');
    return csState.inv?-c:c;
  });
  return L;
}
function csLiveFilter(){
  document.querySelectorAll('.cs-item[data-name]').forEach(el=>{el.style.display=(!csState.q||el.dataset.name.includes(csState.q))?'':'none';});
}
const csTag=(p,own)=>`<span class="cs-tag${own?' own':''}">$${p}</span>`;
function clothesShopPage(msg){
  pageTitle='웨스트게이트 쇼핑몰 · 의류 매장';
  if(csState.sel)return csItemPage(msg);
  let n=0;const N=t=>`(${++n}) ${t}`;
  const H=['<div class="wd cs">'];
  const backL=N('쇼핑몰로 돌아간다');
  const bi=ia(backL,()=>{csState.sel=null;say('옷걸이 사이를 빠져나와 쇼핑몰 통로로 돌아옵니다. 형광등 불빛 아래로 사람들이 오갑니다.');});
  H.push(`<div class="cs-top"><a class="cs-back" data-ch="${bi}" role="button"><span>${backL}</span></a><button type="button" class="cs-sbtn" data-help="cshop">도움말</button>${bt('옵션',()=>{csState.showOpt=!csState.showOpt;clothesShopPage();},'cs-sbtn'+(csState.showOpt?' on':''))}${bt('필터',()=>{csState.showFlt=!csState.showFlt;clothesShopPage();},'cs-sbtn'+(csState.showFlt?' on':''))}</div>`);
  if(csState.showOpt)H.push(`<div class="wd-panel"><p><span class="wd-title">정렬 · 표시</span></p><p class="wd-radios">${Object.keys(CS_SORT).map(k=>rd(CS_SORT[k],csState.sort===k,()=>{csState.sort=k;clothesShopPage();})).join(SEP)}</p><p class="wd-radios">${lkRow([ck('역순 정렬',csState.inv,()=>{csState.inv=!csState.inv;clothesShopPage();}),ck('의류 설명 표시',csState.desc,()=>{csState.desc=!csState.desc;clothesShopPage();})],false)}</p></div>`);
  if(csState.showFlt)H.push(`<div class="wd-panel"><p><span class="wd-title">필터</span></p><p class="wd-radios">${lkRow([ck('보유한 의류 숨기기',csState.hideOwned,()=>{csState.hideOwned=!csState.hideOwned;csState.page=0;clothesShopPage();}),ck('지금 살 수 있는 것만',csState.afford,()=>{csState.afford=!csState.afford;csState.page=0;clothesShopPage();})],false)}</p></div>`);
  CS_TABS.forEach(row=>H.push(`<div class="cs-tabs" role="tablist">${row.map(([k,t])=>`<span class="cs-tab${csState.tab===k?' on':''}" role="tab" aria-selected="${csState.tab===k}" data-ch="${ia(t,()=>{csState.tab=k;csState.page=0;clothesShopPage();})}"><b>${t}</b></span>`).join('')}</div>`));
  const si=ia('검색',()=>clothesShopPage());
  const clrL=N('지우기');
  H.push(`<div class="cs-search"><label for="cs-search">검색:</label><input id="cs-search" data-sch="${si}" value="${esc(csState.q)}" placeholder="이름 · 색상 · 부위" enterkeyhint="search" autocomplete="off"><button type="button" class="cs-clear" data-ch="${ia(clrL,()=>{csState.q='';csState.page=0;clothesShopPage();})}">${clrL}</button></div>`);
  H.push(`<div class="cs-per">페이지당 항목: <span class="cs-perbox" role="button" data-ch="${ia('페이지당 항목',()=>{csState.per=CS_PER[(CS_PER.indexOf(csState.per)+1)%CS_PER.length];csState.page=0;clothesShopPage();})}">${csState.per}</span><span class="wd-dim">현금 $${S.money}</span></div>`);
  if(msg)H.push(`<p class="wd-msg">${msg}</p>`);
  H.push(fxInline());
  const L=csList(),pages=Math.max(1,Math.ceil(L.length/csState.per));
  if(csState.page>=pages)csState.page=pages-1;
  const slice=L.slice(csState.page*csState.per,(csState.page+1)*csState.per);
  if(!slice.length)H.push('<p class="wd-dim">조건에 맞는 의류가 없습니다.</p>');
  slice.forEach(({e,it})=>{
    const own=S.wardrobe.includes(e.id),lab=N(it.n);
    const i=ia(lab,()=>{csState.sel=e.id;clothesShopPage();});
    H.push(`<div class="cs-item${own?' own':''}" data-ch="${i}" data-name="${esc(it.n+' '+it.col+' '+slotName(it.slot))}" role="button"><span class="cs-slot">${slotName(it.slot)}</span><div class="cs-head"><span class="cs-name">${esc(lab)}</span>${own?'<span class="cs-own">| 보유: 1</span>':''}</div>${csRows(it)}${csState.desc?`<div class="cs-desc">${it.desc}</div>`:''}${csTag(e.p,own)}</div>`);
  });
  if(pages>1)H.push(`<p class="wd-links cs-pager">${lkRow([
    csState.page>0?lk('‹ 이전',()=>{csState.page--;clothesShopPage();}):'<span class="wd-na">‹ 이전</span>',
    `<span>${csState.page+1} / ${pages}</span>`,
    csState.page<pages-1?lk('다음 ›',()=>{csState.page++;clothesShopPage();}):'<span class="wd-na">다음 ›</span>'
  ],false)}</p>`);
  H.push('</div>');
  buf.push(H.join(''));
}
function csItemPage(msg){
  const e=CLOTH_SHOP.find(x=>x.id===csState.sel),it=e&&clothOf(e.id);
  if(!it){csState.sel=null;return clothesShopPage(msg);}
  let n=0;const N=t=>`(${++n}) ${t}`;
  const own=S.wardrobe.includes(e.id),worn=S.worn[it.slot]===e.id,cur=clothOf(S.worn[it.slot]);
  const H=['<div class="wd cs">'];
  const backL=N('목록으로 돌아간다');
  H.push(`<div class="cs-top"><a class="cs-back" data-ch="${ia(backL,()=>{csState.sel=null;clothesShopPage();})}" role="button"><span>${backL}</span></a><button type="button" class="cs-sbtn" data-help="cshop">도움말</button></div>`);
  H.push(`<div class="cs-item cs-big${own?' own':''}"><span class="cs-slot">${slotName(it.slot)}</span><div class="cs-head"><span class="cs-name" style="color:#fff">${esc(it.n)}</span>${own?'<span class="cs-own">| 보유: 1</span>':''}</div>${csRows(it)}${csTag(e.p,own)}</div>`);
  H.push(`<p>${it.desc}</p><p class="wd-dim">부위 ${slotName(it.slot)} · 색상 ${it.col} · 보온 ${it.warmth} · 매력 ${it.cha>=0?'+':''}${it.cha} · 내구도 ${it.integ}%<br>지금 이 부위에 착용 중: ${cur?esc(cur.n):'없음'}</p>`);
  H.push('<hr class="wd-hr">');
  if(msg)H.push(`<p class="wd-msg">${msg}</p>`);
  H.push(fxInline());
  const A=[];
  if(!own){
    A.push(lk(N(`구매한다 ($${e.p})`),()=>csBuy(e,false)));
    A.push(lk(N('구매하고 바로 입는다'),()=>csBuy(e,true)));
  }else if(!worn)A.push(lk(N('탈의실에서 갈아입는다'),()=>{S.worn[it.slot]=e.id;pass(3);clothesShopPage(`탈의실에서 「${it.n}」(으)로 갈아입었습니다.`);}));
  else A.push('<span class="wd-dim">지금 입고 있는 옷입니다.</span>');
  H.push(`<p class="wd-links">${A.join(SEP)}</p><p class="wd-dim">보유 현금 $${S.money}</p>`);
  H.push('</div>');
  buf.push(H.join(''));
}
function csBuy(e,wear){
  const it=clothOf(e.id);
  if(S.money<e.p){clothesShopPage(`현금이 $${e.p-S.money} 부족합니다.`);return;}
  cash(-e.p);pass(5);S.wardrobe.push(e.id);if(S.clothInteg)delete S.clothInteg[e.id];
  if(e.id==='umbrella_blk')S.inv.umbrella++;
  if(it.cha>0&&!S.flags['chaBuy_'+e.id]){S.flags['chaBuy_'+e.id]=1;st('cha',Math.min(2,it.cha));}
  if(wear){S.worn[it.slot]=e.id;pass(3);}
  clothesShopPage(wear?`「${it.n}」을(를) 사서 탈의실에서 바로 갈아입었습니다.`:`「${it.n}」을(를) 샀습니다. 집 옷장에 보관됩니다.`);
}

const GR_ICO=(()=>{

function grLeft(g){return Math.max(0,g.stock-((S.daily.grBought||{})[g.id]||0));}
function grMatch(g){const q=grState.q;return !q||g.n.includes(q)||GR_CATS.find(c=>c[0]===g.cat)[1].includes(q);}
function grCount(){return GROCERY.reduce((a,g)=>a+Math.min(grState.qty[g.id]||0,grLeft(g)),0);}
function grTotal(){return GROCERY.reduce((a,g)=>a+Math.min(grState.qty[g.id]||0,grLeft(g))*g.p,0);}
function grTotalTxt(){const c=grCount();return c?`${c}개 · $${grTotal()}`:'';}
function grUses(id){const r=RECIPES.filter(x=>x.need[id]).map(x=>x.n);return r.length?'쓰이는 요리: '+r.join(', '):'';}
function grUpdate(id){const g=grOf(id),el=document.getElementById('grq-'+id);if(g&&el)el.textContent=`${grState.qty[id]||0}/${grLeft(g)}`;}
function grUpdateTotal(){const el=document.getElementById('gr-total');if(el)el.textContent=grTotalTxt();}
function grFilter(){
  const list=document.querySelector('.gr-list');if(!list)return;
  list.classList.toggle('searching',!!grState.q);
  GR_CATS.forEach(([c])=>{
    let any=false;
    GROCERY.filter(g=>g.cat===c).forEach(g=>{const m=grMatch(g);if(m)any=true;const el=document.getElementById('gri-'+g.id);if(el)el.style.display=m?'':'none';});
    const box=list.querySelector(`[data-catbox="${c}"]`);if(box)box.style.display=(grState.q&&!any)?'none':'';
  });
}
/* 스텝퍼 · 분류 접기 · 상세 정보는 화면을 다시 그리지 않고 즉시 반영 (스크롤 유지) */
function grHandle(el){
  const a=el.dataset.gr;
  if(a==='cat'){const c=el.dataset.cat;grState.open[c]=!grState.open[c];const box=el.closest('.gr-cat');if(box)box.classList.toggle('open',!!grState.open[c]);return;}
  if(a==='det'){const id=el.dataset.id;grState.det[id]=!grState.det[id];const d=document.getElementById('grd-'+id);if(d)d.hidden=!grState.det[id];return;}
  if(a==='q'){
    const id=el.dataset.id,g=grOf(id);if(!g)return;
    const left=grLeft(g),op=el.dataset.op;let q=grState.qty[id]||0;
    q=op==='first'?0:op==='m5'?q-5:op==='m1'?q-1:op==='p1'?q+1:op==='p5'?q+5:left;
    grState.qty[id]=Math.max(0,Math.min(left,q));
    grUpdate(id);
  }else if(a==='fill'){
    const p=(+el.dataset.p)/100;
    GROCERY.forEach(g=>{if(!(grState.q||grState.open[g.cat])||!grMatch(g))return;grState.qty[g.id]=Math.round(grLeft(g)*p);grUpdate(g.id);});
  }
  grUpdateTotal();
}

function kitchenPage(msg){

  RECIPES.slice().sort((a,b)=>canCook(b)-canCook(a)).forEach(r=>{
    const ok=canCook(r);
    const need=Object.keys(r.need).map(k=>{const h=S.pantry[k]||0,g=grOf(k);return `<span class="${h>=r.need[k]?'wd-ok':'wd-hot'}">${g?g.n:k} ${h}/${r.need[k]}</span>`;}).join(' · ');
    const act=ok?`<p class="wd-links">${lk(`요리한다 ${fmtDur(r.min).trim()}`,()=>cookRecipe(r))}</p>`:'';
    H.push(`<div class="wd-item wd-static"><div class="wd-item-info"><b>${r.n} <em class="lp-badge ${ok?'ok':'dim'}">${ok?'요리 가능':'재료 부족'}</em></b><span>${need}</span><span class="wd-desc">피로 −${-r.fat} · 스트레스 −${-r.str}</span>${act}</div></div>`);
  });
  H.push('</div>');
  buf.push(H.join(''));

function cookRecipe(r){
  if(!canCook(r)){kitchenPage('재료가 모자랍니다.');return;}
  const d=S.daily;
  Object.keys(r.need).forEach(k=>{S.pantry[k]-=r.need[k];if(S.pantry[k]<=0)delete S.pantry[k];});
  pass(r.min);st('fat',r.fat);st('str',r.str);skUp('know',0.5);skUp('craft',0.3);
  const mh=mariaHome(),eh=emilyHome();
  const t=r.txt+' '+dishReaction(r,mh,eh,(mh||eh)&&!d.cook);
  if((mh||eh)&&!d.cook)d.cook=1;
  kitchenPage(`<p>${t}</p>`);
}

/* ----- 옷장 (참고 이미지 디자인: 링크 행 · 라디오 · 세트 격자) ----- */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEP='<span class="wd-sep">|</span>';
/* 본문 안에 그려지는 인라인 선택지 (하단 선택지 목록에는 표시되지 않음) */
function ia(label,fn,o={}){opt(label,fn,Object.assign({},o,{inline:true}));return choices.length-1;}
function lk(text,fn,o={}){const i=ia(text.replace(/<[^>]+>/g,''),fn,o);return `<a class="wd-link${o.cls?' '+o.cls:''}${o.active?' active':''}" data-ch="${i}">${text}</a>`;}
function fxInline(){const save=buf;buf=[];flushFx();const out=buf.join('');buf=save;return out;}
function lkRow(arr,trail=true){return arr.join(SEP)+(trail?SEP:'');}
function rd(text,on,fn){const i=ia(text,fn);return `<span class="wd-radio${on?' on':''}" data-ch="${i}" role="radio" aria-checked="${on}"><i></i>${text}</span>`;}
function ck(text,on,fn){const i=ia(text,fn);return `<span class="wd-radio wd-check${on?' on':''}" data-ch="${i}" role="checkbox" aria-checked="${on}"><i></i>${text}</span>`;}
function bt(html,fn,cls){const i=ia(html.replace(/<[^>]+>/g,' '),fn);return `<button type="button" class="${cls||'wd-setbtn'}" data-ch="${i}">${html}</button>`;}

let wdState={slot:'head',mode:'wear',setMode:'wear',repeat:false,order:'name',inv:false,showOpt:false,showRand:false,showDesc:true,wornFirst:true,rand:null};
const ORDER_N={name:'이름',colour:'색상',cha:'매력',integrity:'내구도',warmth:'보온성'};
const WD_MODES={wear:'입기',discard:'버리기',repair:'수선하기 (0:10)'};
const SET_MODES={wear:'입기',del:'삭제',over:'현재 복장으로 덮어쓰기'};
const integOf=it=>(S.clothInteg&&S.clothInteg[it.id]!=null)?S.clothInteg[it.id]:it.integ;
function totalWarmth(){return CLOTH_SLOTS.reduce((a,s)=>{const it=clothOf(S.worn[s.k]);return a+(it?it.warmth:0);},0);}
function comfortRange(){const lo=Math.max(0,Math.round((20-S.temp)*0.9));return [lo,lo+15];}
function outsideFeel(){
  const t=S.temp;
  if(t>=25)return ['바깥은 덥습니다.','wd-hot'];
  if(t>=19)return ['바깥은 따뜻합니다.','wd-warm'];
  if(t>=13)return ['바깥은 선선합니다.','wd-cold'];
  if(t>=7)return ['바깥은 춥습니다.','wd-cold'];
  return ['바깥은 매우 춥습니다.','wd-cold'];
}
function randCfg(){if(!wdState.rand)wdState.rand=Object.fromEntries(CLOTH_SLOTS.map(s=>[s.k,s.k!=='handheld']));return wdState.rand;}
function currentSetItems(){const o={};Object.keys(S.worn).forEach(k=>{if(S.worn[k])o[k]=S.worn[k];});return o;}
function newSetName(){let i=S.outfitSets.length+1;while(S.outfitSets.some(s=>s.name===`맞춤 세트 ${i}`))i++;return `맞춤 세트 ${i}`;}
function wornLines(){
  const L=CLOTH_SLOTS.map(s=>{const c=clothOf(S.worn[s.k]);return c?`${s.n}: ${c.n}`:null;}).filter(Boolean);
  return L.length?L.join(' · '):'아무것도 걸치지 않은 상태입니다.';
}
function createSetFromWorn(back){
  if(S.outfitSets.length>=12){back('의상 세트는 최대 12개까지 저장할 수 있습니다.');return;}
  const name=newSetName();
  S.outfitSets.push({name,items:currentSetItems()});
  back(`현재 차림을 「${name}」 세트로 저장했습니다.`);
}
function applySet(set){
  const m=wdState.setMode;
  if(m==='del'){
    S.outfitSets.splice(S.outfitSets.indexOf(set),1);wdState.setMode='wear';
    wardrobePage(`「${set.name}」 세트를 삭제했습니다.`);return;
  }
  if(m==='over'){
    set.items=currentSetItems();wdState.setMode='wear';
    wardrobePage(`「${set.name}」 세트를 현재 복장으로 덮어썼습니다.`);return;
  }
  let missing=0;
  Object.keys(S.worn).forEach(k=>S.worn[k]=null);
  Object.keys(set.items).forEach(k=>{const cid=set.items[k];if(!cid)return;if(S.wardrobe.includes(cid))S.worn[k]=cid;else missing++;});
  pass(5);
  wardrobePage(`「${set.name}」 세트로 갈아입었습니다.${missing?` (옷장에 없는 의류 ${missing}벌은 제외되었습니다.)`:''}`);
}
function wdItemAct(id){
  const it=clothOf(id);
  if(!it||!S.wardrobe.includes(id)){wardrobePage();return;}
  const k=it.slot,m=wdState.mode;let msg;
  if(m==='wear'){
    if(S.worn[k]===id){S.worn[k]=null;pass(1);msg=`「${it.n}」을(를) 벗었습니다.`;}
    else{S.worn[k]=id;pass(2);msg=`「${it.n}」을(를) 착용했습니다.`;}
  }else if(m==='discard'){
    if(S.worn[k]===id)S.worn[k]=null;
    S.wardrobe=S.wardrobe.filter(x=>x!==id);
    if(S.clothInteg)delete S.clothInteg[id];
    if(id==='umbrella_blk')S.inv.umbrella=Math.max(0,S.inv.umbrella-1);
    msg=`「${it.n}」을(를) 처분했습니다.`;
  }else{
    const ig=integOf(it);
    if(ig>=100)msg=`「${it.n}」은(는) 수선할 곳이 없습니다.`;
    else{
      pass(10);
      if(!S.clothInteg)S.clothInteg={};
      S.clothInteg[id]=Math.min(100,ig+Math.round(15+(S.skills.craft||0)*0.5));
      skUp('craft',0.5);
      msg=`바늘과 실로 「${it.n}」의 해진 곳을 꿰맸습니다. (내구도 ${ig}% → ${S.clothInteg[id]}%)`;
    }
  }
  if(!wdState.repeat)wdState.mode='wear';
  wardrobePage(msg);
}
function wardrobePage(msg){
  pageTitle='옷장';
  let n=0;const N=t=>`(${++n}) ${t}`;
  const pct=v=>Math.max(0,Math.min(100,v/40*100));
  const H=['<div class="wd">'];

  /* 머리말: 닫기 + 옵션 */
  H.push(`<div class="wd-head"><div class="wd-head-l"><p>삐걱거리는 나무 옷장 문을 엽니다.</p><p>${lk(N('옷장을 닫는다'),()=>{say('옷장 문을 닫습니다. 경첩이 삐걱 소리를 냅니다.');})}</p></div>${bt('옵션',()=>{wdState.showOpt=!wdState.showOpt;wardrobePage();},'wd-optbtn'+(wdState.showOpt?' on':''))}</div>`);
  if(wdState.showOpt)H.push(`<div class="wd-panel"><p><span class="wd-title">옷장 표시 옵션</span></p><p class="wd-radios">${lkRow([
    ck('의류 설명 표시',wdState.showDesc,()=>{wdState.showDesc=!wdState.showDesc;wardrobePage();}),
    ck('착용 중인 의류를 맨 위에',wdState.wornFirst,()=>{wdState.wornFirst=!wdState.wornFirst;wardrobePage();})
  ],false)}</p></div>`);
  H.push('<hr class="wd-hr">');

  /* 보온성 */
  const tw=totalWarmth(),[lo,hi]=comfortRange(),[feel,fc]=outsideFeel();
  H.push(`<p class="wd-lbl">보온성:</p>
    <div class="wd-gauge" aria-label="보온성 ${tw}"><span class="rng" style="left:${pct(lo)}%;width:${pct(hi)-pct(lo)}%"></span><span class="mk" style="left:${pct(tw)}%"></span></div>
    <div class="wd-helpwrap"><button type="button" class="wd-help" data-help="warmth" aria-label="보온성 도움말"><span>?</span></button></div>
    <p class="${fc}">${feel} <span class="wd-dim">(${S.weather} · ${S.temp}°C)</span></p>
    <p>현재 복장의 보온성은 <span class="wd-num">${tw}</span>입니다.</p>
    <p>쾌적하게 지내려면 보온성이 <span class="wd-num">${lo}</span>에서 <span class="wd-num">${hi}</span> 사이여야 합니다.</p>`);
  if(tw<lo)H.push('<p class="wd-cold">지금 차림으로는 몸이 떨릴 만큼 춥습니다.</p>');
  else if(tw>hi)H.push('<p class="wd-hot">지금 차림은 땀이 날 만큼 덥습니다.</p>');
  H.push('<hr class="wd-hr">');

  /* 옷매무새 · 빠른 동작 */
  H.push(`<p class="wd-msg">${msg||'옷매무새를 정돈합니다.'}</p>`);
  H.push(fxInline());
  H.push(`<p class="wd-links">${lkRow([
    lk(N('전부 벗는다'),()=>{Object.keys(S.worn).forEach(k=>S.worn[k]=null);pass(3);wardrobePage('착용 중인 모든 의류를 벗어 옷장에 넣었습니다.');}),
    lk(N('무작위로 입는다'),()=>{
      const rc=randCfg();
      CLOTH_SLOTS.forEach(s=>{if(!rc[s.k])return;const pool=S.wardrobe.filter(id=>{const c=clothOf(id);return c&&c.slot===s.k;});S.worn[s.k]=pool.length?pick(pool):null;});
      pass(5);wardrobePage('옷장에서 손에 잡히는 대로 꺼내 입었습니다. — '+wornLines());
    }),
    lk(N('무작위 설정'),()=>{wdState.showRand=!wdState.showRand;wardrobePage();},{active:wdState.showRand}),
    lk(N('거울을 본다'),()=>mirrorPage())
  ])}</p>`);
  if(wdState.showRand){
    const rc=randCfg();
    H.push(`<div class="wd-panel"><p><span class="wd-title">무작위로 입을 부위</span></p>
      <p class="wd-radios">${CLOTH_SLOTS.map(s=>ck(s.n,rc[s.k],()=>{rc[s.k]=!rc[s.k];wardrobePage();})).join(SEP)}</p>
      <p class="wd-links">${lkRow([lk('모두 선택',()=>{CLOTH_SLOTS.forEach(s=>rc[s.k]=true);wardrobePage();}),lk('모두 해제',()=>{CLOTH_SLOTS.forEach(s=>rc[s.k]=false);wardrobePage();})],false)}</p></div>`);
  }

  /* 의상 세트 */
  H.push('<p class="wd-sec"><span class="wd-title">의상 세트</span></p>');
  H.push(`<p class="wd-links">${lkRow([
    lk('현재 복장으로 새 세트 만들기',()=>createSetFromWorn(wardrobePage)),
    lk('모든 세트 편집',()=>setManagePage())
  ],false)}</p>`);
  H.push(`<p class="wd-radios">${Object.keys(SET_MODES).map(m=>rd(SET_MODES[m],wdState.setMode===m,()=>{wdState.setMode=m;wardrobePage();})).join(SEP)}</p>`);
  if(S.outfitSets.length)H.push(`<div class="wd-sets">${S.outfitSets.map(set=>bt(esc(set.name),()=>applySet(set),'wd-setbtn'+(wdState.setMode==='del'?' del':''))).join('')}</div>`);
  else H.push('<p class="wd-dim">저장된 의상 세트가 없습니다.</p>');
  H.push('<hr class="wd-hr">');

  /* 의류 */
  const sl=CLOTH_SLOTS.find(s=>s.k===wdState.slot)||CLOTH_SLOTS[0];
  H.push('<p class="wd-sec"><span class="wd-title">의류</span></p>');
  H.push(`<p class="wd-links">${CLOTH_SLOTS.map(s=>lk(s.n,()=>{wdState.slot=s.k;wardrobePage();},{active:s.k===sl.k})).join(SEP)}</p>`);
  H.push(`<p class="wd-radios">${[
    ...Object.keys(WD_MODES).map(m=>rd(WD_MODES[m],wdState.mode===m,()=>{wdState.mode=m;wardrobePage();})),
    ck('동작 반복',wdState.repeat,()=>{wdState.repeat=!wdState.repeat;wardrobePage();})
  ].join(SEP)}</p>`);

  const items=S.wardrobe.map(clothOf).filter(c=>c&&c.slot===sl.k);
  items.sort((a,b)=>{
    if(wdState.wornFirst){const wa=S.worn[sl.k]===a.id,wb=S.worn[sl.k]===b.id;if(wa!==wb)return wa?-1:1;}
    let c=0;const o=wdState.order;
    if(o==='name')c=a.n.localeCompare(b.n,'ko');
    else if(o==='colour')c=a.col.localeCompare(b.col,'ko');
    else if(o==='cha')c=a.cha-b.cha;
    else if(o==='integrity')c=integOf(a)-integOf(b);
    else c=a.warmth-b.warmth;
    return wdState.inv?-c:c;
  });
  H.push(`<p class="wd-sec"><span class="wd-title">${sl.n}</span> <i class="wd-cnt">${items.length} / 20</i></p>`);
  const orderRow=inv=>Object.keys(ORDER_N).map(o=>lk(ORDER_N[o],()=>{wdState.order=o;wdState.inv=inv;wardrobePage();},{active:wdState.order===o&&wdState.inv===inv})).join(SEP)+SEP;
  H.push(`<p class="wd-links">정렬 기준: ${orderRow(false)}</p><p class="wd-links">역순 정렬: ${orderRow(true)}</p>`);
  const cur=clothOf(S.worn[sl.k]);
  H.push(`<p class="wd-dim">현재 착용: ${cur?esc(cur.n):'없음'}</p>`);
  if(!items.length)H.push('<p class="wd-dim">이 부위에 보관된 의류가 없습니다.</p>');
  items.forEach(it=>{
    const worn=S.worn[sl.k]===it.id,ig=integOf(it);
    let act,ac='';
    if(wdState.mode==='wear')act=worn?'벗기':'입기';
    else if(wdState.mode==='discard'){act='버리기';ac=' risk';}
    else if(ig>=100){act='수선 불필요';ac=' dim';}
    else act='수선';
    const i=ia(it.n,()=>wdItemAct(it.id));
    H.push(`<div class="wd-item${worn?' worn':''}" data-ch="${i}" role="button"><div class="wd-item-info"><b>${worn?'<em class="wd-tag">착용 중</em>':''}${esc(it.n)}</b><span>색상 ${it.col} · 보온 ${it.warmth} · 내구도 ${ig}% · 매력 ${it.cha>=0?'+':''}${it.cha}</span>${wdState.showDesc?`<span class="wd-desc">${it.desc}</span>`:''}</div><span class="wd-act${ac}">${act}</span></div>`);
  });
  H.push('</div>');
  buf.push(H.join(''));
}
function setManagePage(msg){
  pageTitle='옷장 · 의상 세트 편집';
  let n=0;const N=t=>`(${++n}) ${t}`;
  const H=['<div class="wd">'];
  H.push(`<p>저장된 의상 세트의 이름을 바꾸거나 순서를 정리합니다.</p><p>${lk(N('옷장으로 돌아간다'),()=>wardrobePage())}</p>`);
  H.push('<hr class="wd-hr">');
  if(msg)H.push(`<p class="wd-msg">${msg}</p>`);
  H.push(`<p class="wd-sec"><span class="wd-title">의상 세트</span> <i class="wd-cnt">${S.outfitSets.length} / 12</i></p>`);

      lk('현재 복장으로 덮어쓰기',()=>{set.items=currentSetItems();setManagePage(`「${set.name}」 세트를 현재 복장으로 덮어썼습니다.`);})
    ];
    if(idx>0)acts.push(lk('위로',()=>{const a=S.outfitSets;[a[idx-1],a[idx]]=[a[idx],a[idx-1]];setManagePage();}));

    H.push(`<div class="wd-item wd-static"><div class="wd-item-info"><input class="wd-input" id="wdname-${idx}" maxlength="16" value="${esc(set.name)}" aria-label="세트 이름"><span>${esc(names)}</span><p class="wd-links">${acts.join(SEP)}</p></div></div>`);
  });
  H.push(`<p class="wd-links">${lk('현재 복장으로 새 세트 만들기',()=>createSetFromWorn(setManagePage))}</p>`);

function wakeChoice(){const v=S.flags.wakeSel;return (v&&v!=='keep'&&S.outfitSets.some(x=>x.name===v))?v:'keep';}
function wakePage(head,after,first){
  if(!first)buf.push(head);
  else buf.push(fxInline());
  pageTitle='침실';
  const cur=wakeChoice();
  const L=S.outfitSets.map(x=>[x.name,`${esc(x.name)} 입기`]);
  L.push(['keep','입던 그대로 입기']);
  buf.push(`<div class="wd wake"><p class="wd-radios">${L.map(([v,t])=>rd(t,cur===v,()=>{S.flags.wakeSel=v;wakePage(head,after,false);})).join(SEP)}</p></div>`);
  opt('침대에서 일어난다',()=>{
    const sel=wakeChoice();
    if(sel!=='keep'){
      const set=S.outfitSets.find(x=>x.name===sel);let miss=0;
      Object.keys(S.worn).forEach(k=>S.worn[k]=null);
      Object.keys(set.items).forEach(k=>{const c=set.items[k];if(!c)return;if(S.wardrobe.includes(c))S.worn[k]=c;else miss++;});
      pass(5);
      say(`이불을 걷어 내고 「${esc(set.name)}」 차림으로 갈아입습니다.${miss?` (옷장에 없는 의류 ${miss}벌은 빠졌습니다.)`:''}`);
    }else say('어젯밤 차림 그대로 이불을 걷어 내고 일어납니다.');
    after();
  });
}

function sleepNight(){let m=(7*60-S.t+1440)%1440;doSleep(m||480);}
function doSleep(mins){
  const nightmare=R()<S.st.tra/110;
  if(mins>=240)say(S.loc==='home'?'얇은 이불을 끌어당깁니다.':S.loc==='base'?'막사의 좁은 철제 침상에 몸을 누이고 군용 담요를 끌어당깁니다.':'아무 데나 몸을 누입니다.');
  pass(mins,{sleep:true,rest:nightmare?6:(S.loc==='home'?HOUSES[S.house].rest:11)});
  const wake=S.loc==='home'&&mins>=240&&!S.prison&&!S.ended;
  if(nightmare){say(pick(NIGHTMARES));st('str',12);st('ctl',-2);}
  else if(mins>=240){say(wake?'푹 자고 개운하게 일어났습니다.':'오랜만에 꿈 없이 잤습니다.');st('str',-10);st('ctl',1);}
  else{st('str',-3);say('잠깐 눈을 붙였습니다.');}
  if(S.loc==='home'&&!weekend()&&hh()===7)say('현관문 닫히는 소리. 마리아가 에밀리를 유치원에 데려다주고 출근했습니다.');
  /* 기상: 옷 고르기 화면을 먼저 띄우고, 일어난 뒤 집 화면으로 */
  if(wake){
    const head=nightmare?'<p>악몽에서 깨어났습니다. 식은땀에 젖은 이불을 걷어 냅니다.</p>':'<p>푹 자고 개운하게 일어났습니다.</p>';
    if(nightmare)buf.push(head);
    wakePage(head,()=>say(desc()),true);
  }
}

    say(S.rel.maria>=35?'집에 돌아와 취직 소식을 전하자 마리아의 얼굴이 환해집니다. “정말? 스콧, 잘됐어.” 그녀는 앞치마에 손을 닦고 당신을 꼭 끌어안습니다.':'마리아에게 취직 소식을 전합니다. 그녀는 놀란 듯 눈을 크게 뜨고는 작게 고개를 끄덕입니다. “잘됐네, 스콧. 이번엔 오래 다녀.”');
    note(`취직: ${J.n} (${jobTitle(id,0)}) · ${J.days.map(x=>DAYS[x][0]).join('·')} ${J.start}:00 시작 · 일당 $${J.pay} · 경고 3회 누적 시 해고`);
  }else{
    st('str',10);say('“연락드리겠습니다.” 그 말이 무슨 뜻인지 당신은 압니다.');
    sys('(관련 기술과 매력을 올리고, 피로·스트레스를 낮추면 합격 가능성이 높아집니다.)');
  }
}

/* ----- 경고 · 해고 · 사직 ----- */
function addStrike(reason,n=1){
  if(!S.job)return false;
  S.job.strikes=(S.job.strikes||0)+n;
  note(`경고 ${Math.min(3,S.job.strikes)}/3 — ${reason}`);
  st('str',4);
  if(S.job.strikes>=3){fireJob(`경고 누적 (${reason})`);return true;}
  return false;
}
function fireJob(reason,txt){
  if(!S.job)return;
  const id=S.job.id,J=JOBS[id];
  say(txt||'관리자가 굳은 얼굴로 당신을 사무실로 부릅니다. “미안하지만 오늘부로 그만 나와 주게.” 사물함 열쇠를 반납하고 나오는 길, 등 뒤로 동료들의 시선이 꽂힙니다.');
  note(`해고: 「${J.n}」 (${jobTitle(id)}) — 사유: ${reason} · 14일간 재지원 불가`);
  S.flags['ban_'+id]=S.day+14;S.flags.firedCount=(S.flags.firedCount||0)+1;
  S.job=null;S.shift=null;
  st('str',15);st('ctl',-3);st('tra',1);rel('maria',-12);
  if(id==='mech')rel('frank',-15);
}
function quitConfirm(){
  if(!S.job)return;
  const id=S.job.id,J=JOBS[id],mid=!!S.shift;
  pageTitle='사직';
  say(mid?'작업 도중, 손에 쥔 공구를 내려다봅니다. 지금 이대로 걸어 나가면 오늘 일당은 한 푼도 받지 못하고, 업계에 소문도 날 것입니다.'
    :`「${J.n}」의 ${jobTitle(id)} 자리를 그만두려 합니다. 일당 $${jobPay()}짜리 일자리입니다. 마리아에게는 뭐라고 말해야 할까요.`);
  sys(`그만두면 ${mid?14:7}일 동안 같은 직장에 재지원할 수 없고, 쌓아 온 직급과 근무 평가가 모두 사라집니다.`);
  opt(mid?'작업복을 벗어 던지고 그대로 나간다':'정식으로 사직서를 제출한다',()=>{
    S.flags['ban_'+id]=S.day+(mid?14:7);
    if(mid){S.shift=null;st('str',-4);st('ctl',-3);rel('maria',-10);say('“야, 카터! 어디 가!” 등 뒤의 고함을 무시하고 문을 박차고 나옵니다. 잠깐은 속이 시원하지만, 주머니 속 손이 금세 차가워집니다.');}
    else{st('str',-8);rel('maria',S.rel.maria>=50?-4:-8);say(`${BOSS[id]}이(가) 사직서를 받아 들고 잠시 당신을 바라봅니다. “아쉽군. 몸 조심하게.” 짐을 챙겨 나오는 발걸음이 가볍고도 무겁습니다.`);}
    if(id==='mech')rel('frank',mid?-20:-6);
    note(`퇴사: 「${J.n}」`);
    S.job=null;
  },{cls:'risk'});
  opt('다시 생각한다',()=>{
    if(mid){say('숨을 한 번 고르고 공구를 다시 쥡니다.');cont();}
    else say('사직서를 다시 접어 주머니에 넣습니다. 아직은 버텨야 합니다.');
  });
}

/* ----- 근무 진행 (1시간 단위) ----- */
